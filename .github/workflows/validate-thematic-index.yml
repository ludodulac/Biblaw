name: Validate thematic index

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/thematic-index/books/**'
      - 'scripts/complete_book17_thematic.py'
      - 'scripts/complete_books18_20_thematic.py'
      - 'scripts/deepen_book18_semantic.py'
      - 'scripts/deepen_book18_semantic_part2.py'
      - 'scripts/finalize_book18_semantic.py'
      - 'scripts/deepen_book19_semantic_part1.py'
      - 'scripts/deepen_book19_semantic_part2.py'
      - 'scripts/deepen_book19_semantic_part3.py'
      - 'scripts/deepen_book19_semantic_part4.py'
      - 'scripts/deepen_book19_semantic_part5.py'
      - 'scripts/deepen_book19_semantic_part6.py'
      - 'scripts/finalize_book19_semantic.py'
      - 'scripts/deepen_book20_semantic_part1.py'
      - 'scripts/deepen_book20_semantic_part2.py'
      - 'scripts/deepen_book20_semantic_part3.py'
      - 'scripts/deepen_book20_semantic_part4.py'
      - 'scripts/deepen_book20_semantic_part5.py'
      - 'scripts/deepen_book20_semantic_part6.py'
      - 'scripts/finalize_book20_semantic.py'
      - 'scripts/ground_books18_20_semantic_evidence.py'
      - 'scripts/complete_books21_23_thematic.py'
      - 'scripts/deepen_book21_semantic_part1.py'
      - 'scripts/deepen_book21_semantic_part2.py'
      - 'scripts/complete_books24_26_thematic.py'
      - 'scripts/complete_books27_30_thematic.py'
      - 'scripts/complete_books31_40_thematic.py'
      - 'scripts/complete_books41_44_thematic.py'
      - 'scripts/sync_thematic_documentary_status.py'
      - 'scripts/build_book_contexts.py'
      - 'scripts/normalize_thematic_metadata.py'
      - 'scripts/validate_thematic_index.py'
      - 'scripts/build_thematic_directory.py'
      - '.github/workflows/validate-thematic-index.yml'

permissions:
  contents: write

concurrency:
  group: thematic-index-generated-files
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete canonical Michael book 17
        run: python scripts/complete_book17_thematic.py
      - name: Complete canonical books 18 to 20
        run: python scripts/complete_books18_20_thematic.py
      - name: Apply deep semantic pass for Gabriel book 18
        run: python scripts/deepen_book18_semantic.py
      - name: Apply second deep semantic pass for Gabriel book 18
        run: python scripts/deepen_book18_semantic_part2.py
      - name: Apply first deep semantic pass for Raphael book 19
        run: python scripts/deepen_book19_semantic_part1.py
      - name: Apply second deep semantic pass for Raphael book 19
        run: python scripts/deepen_book19_semantic_part2.py
      - name: Apply third deep semantic pass for Raphael book 19
        run: python scripts/deepen_book19_semantic_part3.py
      - name: Apply fourth deep semantic pass for Raphael book 19
        run: python scripts/deepen_book19_semantic_part4.py
      - name: Apply fifth deep semantic pass for Raphael book 19
        run: python scripts/deepen_book19_semantic_part5.py
      - name: Apply final deep semantic pass for Raphael book 19
        run: python scripts/deepen_book19_semantic_part6.py
      - name: Apply first deep semantic pass for Ouriel book 20
        run: python scripts/deepen_book20_semantic_part1.py
      - name: Apply second deep semantic pass for Ouriel book 20
        run: python scripts/deepen_book20_semantic_part2.py
      - name: Apply third deep semantic pass for Ouriel book 20
        run: python scripts/deepen_book20_semantic_part3.py
      - name: Apply fourth deep semantic pass for Ouriel book 20
        run: python scripts/deepen_book20_semantic_part4.py
      - name: Apply fifth deep semantic pass for Ouriel book 20
        run: python scripts/deepen_book20_semantic_part5.py
      - name: Apply final deep semantic pass for Ouriel book 20
        run: python scripts/deepen_book20_semantic_part6.py
      - name: Ground residual semantic evidence for books 18 to 20
        run: python scripts/ground_books18_20_semantic_evidence.py
      - name: Finalize complete deep semantic pass for Gabriel book 18
        run: python scripts/finalize_book18_semantic.py
      - name: Finalize complete deep semantic pass for Raphael book 19
        run: python scripts/finalize_book19_semantic.py
      - name: Finalize complete deep semantic pass for Ouriel book 20
        run: python scripts/finalize_book20_semantic.py
      - name: Complete canonical books 21 to 23
        run: python scripts/complete_books21_23_thematic.py
      - name: Apply first deep semantic pass for Michael book 21
        run: python scripts/deepen_book21_semantic_part1.py
      - name: Apply second deep semantic pass for Michael book 21
        run: python scripts/deepen_book21_semantic_part2.py
      - name: Complete canonical books 24 to 26
        run: python scripts/complete_books24_26_thematic.py
      - name: Complete canonical books 27 to 30
        run: python scripts/complete_books27_30_thematic.py
      - name: Complete canonical books 31 to 40
        run: python scripts/complete_books31_40_thematic.py
      - name: Complete canonical books 41 to 44
        run: python scripts/complete_books41_44_thematic.py
      - name: Gate thematic completion on documentary integrity
        run: python scripts/sync_thematic_documentary_status.py
      - name: Normalize thematic metadata
        run: python scripts/normalize_thematic_metadata.py
      - name: Build PDF-only book contexts
        run: python scripts/build_book_contexts.py
      - name: Validate thematic index
        run: python scripts/validate_thematic_index.py
      - name: Rebuild thematic directory
        run: python scripts/build_thematic_directory.py
      - name: Commit normalized index and reports
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/thematic-index/books data/thematic-index/book-contexts.json data/thematic-index/theme-directory.json data/thematic-index/validation-report.json)" ]; then
            echo 'No thematic index changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index/books data/thematic-index/book-contexts.json data/thematic-index/theme-directory.json data/thematic-index/validation-report.json
          git commit -m 'Normalize validate and contextualize thematic index'
          git pull --rebase origin main
          git push origin HEAD:main
