name: Temporary Book 01 Psalms 11-20 derivative rebuild

on:
  push:
    branches:
      - feat/book01-psalms-11-20-theme-coverage-2026-11-08
    paths:
      - .github/workflows/book01-psalms11-20-derivatives-temporary.yml
      - data/thematic-index/books/book-01.json
      - scripts/audit_book01_psalms11_20_theme_coverage.py

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate all canonical thematic search derivatives
        run: python scripts/check_biblaw.py TARGETED --area thematic
      - name: Refresh independent conceptual coverage audit
        run: python scripts/audit_conceptual_coverage.py
      - name: Verify previously reviewed Psalms 1-10 remain intact
        run: python scripts/audit_book01_first10_theme_coverage.py
      - name: Verify Psalms 11-20 and all browser-facing search links
        run: python scripts/audit_book01_psalms11_20_theme_coverage.py
      - name: Commit derived artifacts to this review branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index data/browser-search-catalog.json
          if git diff --cached --quiet; then
            echo 'Generated indexes already match canonical input'
            exit 0
          fi
          git commit -m 'Regenerate thematic search indexes for Book 01 Psalms 11-20'
          git push origin HEAD:feat/book01-psalms-11-20-theme-coverage-2026-11-08
