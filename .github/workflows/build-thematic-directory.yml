name: Validate thematic derivatives manually

on:
  workflow_dispatch:

# Historical partial directory publishing was unsafe because downstream aliases, connections and
# runtime could be left stale. This manual workflow now validates the complete deterministic
# derivative chain without writing to main; normal publication remains owned by the canonical flow.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rebuild deterministic thematic derivatives
        run: python scripts/check_biblaw.py TARGETED --area thematic
      - name: Verify all regenerated outputs are committed
        run: git diff --exit-code
