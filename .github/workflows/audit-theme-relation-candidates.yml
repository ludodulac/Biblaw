name: Audit theme relation candidates

on:
  push:
    branches:
      - work/theme-relation-candidates
    paths:
      - "scripts/report_theme_relation_candidates.py"
      - "scripts/report_theme_relation_review_context.py"
      - "scripts/report_theme_layer_coverage.py"
      - "scripts/audit_theme_relation_candidates.py"
      - "scripts/audit_theme_relation_review_pilot.py"
      - "scripts/audit_validated_theme_relations.py"
      - "data/thematic-index/theme-search-index.json"
      - "data/thematic-index/theme-quality-audit.json"
      - "data/thematic-index/themes/**"
      - "data/thematic-index/reviews/theme-relations-pilot.json"
      - "data/thematic-index/theme-relations-validated.json"
      - "data/thematic-index/THEME-RELATIONS-CONTRACT.md"
      - ".github/workflows/audit-theme-relation-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run relation candidate sentinels
        run: python scripts/audit_theme_relation_candidates.py

      - name: Audit editorial/search theme layer coverage
        run: python scripts/report_theme_layer_coverage.py

      - name: Audit semantic review pilot
        run: python scripts/audit_theme_relation_review_pilot.py

      - name: Audit canonical validated relation store
        run: python scripts/audit_validated_theme_relations.py

      - name: Report bounded semantic review evidence
        run: >-
          python scripts/report_theme_relation_review_context.py
          --theme union-pere-nature
          --theme union
          --theme pere
          --theme nature
          --theme alliance-de-lumiere
          --theme alliance
          --theme lumiere
          --theme nature-vivante
          --max-occurrences 3

      - name: Diagnose licorne theme candidate structure
        run: python scripts/report_theme_relation_candidates.py --theme union-pere-nature --limit 10