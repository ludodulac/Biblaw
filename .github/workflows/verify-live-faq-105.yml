name: Vérifier les 105 FAQ du site public après publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-faq-105.yml'
      - 'data/faq-*.json'
      - 'js/biblaw-faq.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-faq-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Contrôler le site GitHub Pages réel (HTTPS, 105 FAQ, 424 liens, 19 correspondances)
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from urllib.parse import urlencode
          BASE = 'https://ludodulac.github.io/Biblaw/'
          sha = os.environ['RELEASE_SHA']
          def fetch(path):
              url = BASE + path + '?' + urlencode({'release_check': sha[:12]})
              req = urllib.request.Request(url,headers={'User-Agent':'BIBLAW-release-check/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  assert response.status == 200, f'{path}: status {response.status}'
                  return response.read().decode('utf-8')
          def check():
              html = fetch('')
              assert 'id="faqSearch"' in html and 'js/biblaw-faq.js?v=102' in html, 'Public index is not the expected themed FAQ release'
              js = fetch('js/biblaw-faq.js')
              assert 'faq-099.json' in js and 'faq-099-routing.json' in js, 'Public FAQ loader not updated'
              paths = ['data/faq-public-085.json']
              paths += [f'data/faq-090-{n}.json' for n in range(1,6)]
              paths += [f'data/faq-091-{n}.json' for n in range(1,10)]
              paths += [f'data/faq-{n:03d}.json' for n in range(92,100)]
              all_questions = []
              for path in paths:
                  obj = json.loads(fetch(path))
                  all_questions += obj.get('questions', [obj])
              count = len(all_questions)
              ids = [q['id'] for q in all_questions]
              links = sum(q['answer'].count('(psaume ') for q in all_questions)
              assert count == 105 and len(set(ids)) == 105, f'Public FAQ count or IDs: {count}/{len(set(ids))}'
              assert links == 424, f'Public Psalm citations: {links}'
              thematic = json.loads(fetch('data/faq-101-index.json'))
              assert thematic['version'] == 1 and len(thematic['questions']) == 95
              assert len(thematic['topics']) == 11
              assert sum(x['count'] for x in thematic['topics']) == 95
              assert thematic['originalCitations'] == 424
              routes = json.loads(fetch('data/faq-099-routing.json'))['routes']
              assert len(routes) == 19
              for route in routes:
                  dest = route.get('target_id')
                  if route['resolution'] == 'unsupported':
                      assert dest is None, 'Unsupported question has an invented response'
                  else:
                      assert dest in ids, f"Broken FAQ route: {route['number']}"
              print(f'LIVE_SITE_PASS url={BASE} questions={count} links={links} routes={len(routes)} unique_ids={len(set(ids))}')
          for attempt in range(1,13):
              try:
                  check()
                  break
              except Exception as exc:
                  if attempt == 12:
                      raise
                  print(f'Awaiting live page version ({attempt}/12): {type(exc).__name__}: {exc}',flush=True)
                  time.sleep(12)
          PY
