<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f13"><title>Biblaw — Atelier de validation</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/biblaw.css"><link rel="stylesheet" href="css/validation.css"></head><body>
<header class="site-header"><a class="wordmark" href="index.html"><span class="wordmark-mark">B</span><span>Biblaw</span></a><nav class="site-actions"><a class="quiet-link" href="index.html">Recherche</a><a class="quiet-link" href="reader.html">Lecteur PDF</a></nav></header>
<main class="validation-shell"><section class="validation-intro"><div class="kicker">Atelier éditorial · lot pilote</div><h1>Valider la structure</h1><p>Comparez chaque extraction au PDF avant de l’intégrer définitivement au corpus. Les cases sont mémorisées uniquement dans ce navigateur.</p></section>
<section class="validation-toolbar"><label for="recordSelect">Texte à contrôler</label><select id="recordSelect" class="input"></select><a id="sourceLink" class="primary source-link" target="_blank">Ouvrir la page source</a></section>
<section id="validationStats" class="validation-stats"></section>
<section class="validation-grid"><aside class="review-panel"><div class="kicker">Contrôles humains</div><h2>Liste de vérification</h2><div id="checklist" class="checklist"></div><label class="review-label" for="reviewNote">Note de relecture</label><textarea id="reviewNote" placeholder="Signaler une coupure, un locuteur incertain, une note mal rattachée…"></textarea><button id="copyReview" class="secondary">Copier le compte rendu</button><p id="copyStatus" class="muted" aria-live="polite"></p></aside><article class="structured-panel"><div id="recordHeader"></div><div id="dialogueNotice"></div><div id="verses"></div><div id="notes"></div><div id="prayer"></div></article></section>
</main><script src="js/validation.js"></script></body></html>
