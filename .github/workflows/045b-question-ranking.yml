name: BIBLAW 045B focused question ranking
on:
  push:
    branches:
      - feat/045b-question-aware-ranking
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check js/biblaw.js
      - name: Evaluate canonical direct-answer ranks
        run: node scripts/test_045b_question_ranking.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biblaw-045b-ranking
          path: 045b-ranking-result.json
