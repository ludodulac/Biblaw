name: BIBLAW livre 17 - reconstruction ponctuelle
on:
  push:
    branches:
      - feat/book17-full-theme-coverage
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/book17-full-theme-coverage
          persist-credentials: true
      - name: Appliquer les 301 associations éditoriales du livre 17
        run: python scripts/apply_book17_editorial_coverage.py
      - name: Vérifier 821 versets et 83 associations historiques
        run: python scripts/audit_book17_full_theme_coverage.py
      - name: Reconstruire les index thématiques officiels
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Contrôler les livres 1 à 17
        run: |
          python scripts/audit_book01_first10_theme_coverage.py
          python scripts/audit_book01_psalms11_20_theme_coverage.py
          python scripts/audit_book01_end_book02_first10_theme_coverage.py
          python scripts/audit_book02_psalms11_24_theme_coverage.py
          python scripts/audit_book03_full_theme_coverage.py
          python scripts/audit_book04_full_theme_coverage.py
          python scripts/audit_book05_full_theme_coverage.py
          python scripts/audit_book06_full_theme_coverage.py
          python scripts/audit_book07_full_theme_coverage.py
          python scripts/audit_book08_full_theme_coverage.py
          python scripts/audit_book09_full_theme_coverage.py
          python scripts/audit_book10_full_theme_coverage.py
          python scripts/audit_book11_full_theme_coverage.py
          python scripts/audit_book12_full_theme_coverage.py
          python scripts/audit_book13_full_theme_coverage.py
          python scripts/audit_book14_full_theme_coverage.py
          python scripts/audit_book15_full_theme_coverage.py
          python scripts/audit_book16_full_theme_coverage.py
          python scripts/audit_book17_full_theme_coverage.py
      - name: Retirer les outils éditoriaux provisoires
        run: |
          rm scripts/apply_book17_editorial_coverage.py
          rm scripts/book17-work/part*.json
          rmdir scripts/book17-work
          rm .github/workflows/book17-one-shot.yml
      - name: Enregistrer le livre 17 et les index reconstruits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "BIBLAW: enrich book 17 and rebuild canonical thematic indexes"
          git push origin HEAD:feat/book17-full-theme-coverage
