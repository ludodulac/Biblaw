name: OCCV2 031 proof
on:
  push:
    branches: [audit/occv2-031-proof]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/occv2-031-generic-review-queue, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Prove parameterized and default modes
        run: |
          python scripts/build_linguistic_sense_review_queue.py --proposals data/linguistic/audits/sense-classifier-023a.json --calibration data/linguistic/audits/sense-threshold-per-sense-025.json --output /tmp/q1.json
          cmp /tmp/q1.json data/linguistic/review/sense-review-queue-026.json
          python scripts/audit_linguistic_sense_review_queue.py --queue /tmp/q1.json --proposals data/linguistic/audits/sense-classifier-023a.json --calibration data/linguistic/audits/sense-threshold-per-sense-025.json
          python scripts/build_linguistic_sense_review_queue.py
          python scripts/audit_linguistic_sense_review_queue.py
          git diff --exit-code -- data/linguistic/review/sense-review-queue-026.json
          python scripts/build_linguistic_sense_review_queue.py --proposals data/linguistic/audits/sense-classifier-023a.json --calibration data/linguistic/audits/sense-threshold-per-sense-025.json --output /tmp/q2.json
          cmp /tmp/q1.json /tmp/q2.json
          ! grep -Eiq '\b(bien|biens|BENEFIT_WELFARE|EVALUATIVE_GOOD|POSSESSION_RESOURCE|occ-[0-9a-f]{24})\b' scripts/build_linguistic_sense_review_queue.py scripts/audit_linguistic_sense_review_queue.py
          python - <<'PY'
          from pathlib import Path
          for f in ["scripts/build_linguistic_sense_review_queue.py","scripts/audit_linguistic_sense_review_queue.py"]:
              s=Path(f).read_text()
              for token in ("023","025","026"):
                  lines=[x for x in s.splitlines() if token in x]
                  assert lines and all("DEFAULT_" in x for x in lines),(f,token,lines)
          print("ANTI_SPECIALIZATION=PASS")
          PY
          test "$(git diff --name-only fb7b568726cd89f374509fe521358f738280f25b | sort)" = "$(printf '%s\n' scripts/audit_linguistic_sense_review_queue.py scripts/build_linguistic_sense_review_queue.py | sort)"
      - name: Collapse to one commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft fb7b568726cd89f374509fe521358f738280f25b
          git commit -m "BIBLAW-OCCV2-031 generalize semantic review queue"
          git push --force-with-lease origin HEAD:feat/occv2-031-generic-review-queue
