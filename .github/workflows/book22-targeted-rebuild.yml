name: BIBLAW — Book 22 targeted rebuild (temporary)
on:
  push:
    branches:
      - feat/book22-gabriel-full-coverage-20261109
permissions:
  contents: write
jobs:
  book22:
    if: ${{ !contains(github.event.head_commit.message, '[book22-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Gabriel book 22 enrichment
        run: python scripts/apply_book22_enrichment.py
      - name: Rebuild canonical thematic derivatives
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Verify book 22 and earlier protected books
        run: |
          python scripts/audit_book22_full_theme_coverage.py
          python scripts/audit_book21_full_theme_coverage.py
          python scripts/audit_book20_full_theme_coverage.py
          python scripts/validate_thematic_index.py
          git diff --exit-code -- data/corpus/books
      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "build(book22): regenerate thematic indexes [book22-output]"
            git push origin HEAD:feat/book22-gabriel-full-coverage-20261109
          fi
