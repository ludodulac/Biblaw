name: BIBLAW 064-19 A targeted original PDF evidence
on:
  pull_request:
    paths:
      - 'scripts/prove_notes_064_19_A.py'
      - '.github/workflows/prove-notes-064-19-A.yml'
permissions:
  contents: read
jobs:
  proof-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF reader
        run: python -m pip install --quiet pymupdf==1.26.4
      - name: Capture 12 targeted source PDF pages
        run: python scripts/prove_notes_064_19_A.py
      - name: Preserve images and layout
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biblaw-064-19-proof-A
          path: reports/notes-064-19-proof/A/
          if-no-files-found: error
