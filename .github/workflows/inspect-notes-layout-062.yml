name: BIBLAW 062 focused layout inspection
on:
  pull_request:
    paths:
      - 'scripts/inspect_note_layout_062.py'
      - '.github/workflows/inspect-notes-layout-062.yml'
permissions:
  contents: read
  actions: read
jobs:
  inspect-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: biblaw-notes-evidence-061
          run-id: 39433962159
          github-token: ${{ github.token }}
          path: /tmp/notes061
      - run: python -m pip install --quiet pymupdf==1.26.4
      - run: python scripts/inspect_note_layout_062.py /tmp/notes061/per-note-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: biblaw-062-layout-evidence
          path: reports/notes-062/layout-evidence.json
