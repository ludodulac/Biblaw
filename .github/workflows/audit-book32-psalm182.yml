name: Audit book 32 Psalm 182
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_book32_psalm182_boundary.py'
      - '.github/workflows/audit-book32-psalm182.yml'
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Audit pages 3112 to 3117
        run: python scripts/audit_book32_psalm182_boundary.py
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pilot/book-32-psalm-182-boundary-audit.json
          git commit -m 'Record PDF audit for book 32 Psalm 182' || exit 0
          git push origin HEAD:main
