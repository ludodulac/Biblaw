name: Linguistic adversarial audit 013
on:
  push:
    branches: [audit/linguistic-occurrences-013]
  pull_request:
    branches: [feat/linguistic-occurrences-012-industrialization]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/audit_linguistic_013_evidence.py
      - run: python scripts/audit_linguistic_foundation_004.py
      - run: python scripts/audit_linguistic_second_pilot_006.py
      - run: python scripts/audit_linguistic_inversion_008.py
      - run: python scripts/audit_linguistic_consolidation_011.py
      - run: python scripts/audit_linguistic_fourth_pilot_012.py
