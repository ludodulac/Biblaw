name: Generate SUIS pilot 006
on:
  push:
    branches: [feat/linguistic-occurrences-006]
    paths:
      - 'scripts/build_linguistic_adjudication.py'
      - 'data/linguistic/pilots/suis-config.json'
      - 'data/linguistic/lexicon.json'
      - '.github/workflows/generate-suis-pilot-006.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/linguistic-occurrences-006
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_linguistic_adjudication.py --config data/linguistic/pilots/suis-config.json --write
      - name: Commit generated pilot artifacts
        run: |
          git config user.name "biblaw-linguistic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/linguistic/pilots/suis-occurrences.json data/linguistic/pilots/suis.json data/linguistic/pilots/suis-compounds.json
          git diff --cached --quiet || git commit -m "Generate reproducible SUIS pilot artifacts"
          git push
