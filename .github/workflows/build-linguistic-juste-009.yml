name: Build JUSTE pilot 009
on:
  workflow_dispatch:
  push:
    branches: [feat/linguistic-occurrences-009]
    paths:
      - 'data/linguistic/pilots/juste-config.json'
      - 'scripts/build_linguistic_adjudication.py'
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/linguistic-occurrences-009}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/build_linguistic_adjudication.py --config data/linguistic/pilots/juste-config.json --write
      - name: Commit deterministic artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/linguistic/pilots/juste-occurrences.json data/linguistic/pilots/juste.json data/linguistic/pilots/juste-compounds.json
          git diff --cached --quiet || git commit -m "Generate deterministic JUSTE pilot artifacts"
          git push
