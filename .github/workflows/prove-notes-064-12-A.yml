name: BIBLAW 064-12-A targeted PDF note evidence
on:
  pull_request:
    paths:
      - 'scripts/prove_notes_064_12_A.py'
      - '.github/workflows/prove-notes-064-12-A.yml'
permissions:
  contents: read
jobs:
  targeted-pdf-evidence-A:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted PDF reader
        run: python -m pip install --quiet pymupdf==1.26.4
      - name: Capture targeted original PDF evidence, no authentication
        run: python scripts/prove_notes_064_12_A.py
      - name: Preserve five-note PDF evidence A
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biblaw-064-12-proof-A
          path: reports/notes-064-12-proof/A/
          if-no-files-found: error
