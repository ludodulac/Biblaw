name: Extract Bible books 1-10

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/extract_books_01_10.py'
      - 'scripts/normalize_embedded_psalm_headings.py'
      - 'data/pilot/book-inventory.json'
      - '.github/workflows/extract-books-01-10.yml'

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Extract books 1-10
        run: python scripts/extract_books_01_10.py
      - name: Normalize embedded psalm headings
        run: python scripts/normalize_embedded_psalm_headings.py
      - name: Commit extracted corpus
        run: |
          if [ -z "$(git status --porcelain -- data/corpus/books data/notes/books data/pilot/books-01-10-extraction-report.json)" ]; then
            echo 'No extraction changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/corpus/books data/notes/books data/pilot/books-01-10-extraction-report.json
          git commit -m 'Extract Bible books 1-10'
          git push
