name: BIBLAW 041B lexical product verification
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - 'scripts/build_lexical_expansion_041b.py'
      - '.github/workflows/occv2-041b-finalize-occurrences.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.number == 67
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download verified Morphalou 3.1
        run: |
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 -o "$RUNNER_TEMP/morphalou.zip" 'https://huggingface.co/datasets/datasets-CNRS/Morphalou/resolve/2b5dec836bef836a184d157ba3f71755bf55d523/Morphalou3.1_formatCSV_toutEnUn.zip?download=true'
          echo '4fc815cbf17aecdf1b47f6bbc263489a460fd8d11ae17e6b522336c72bd0e333  '"$RUNNER_TEMP/morphalou.zip" | sha256sum -c -
      - name: Generate candidate runtime and audit
        run: |
          mkdir -p "$RUNNER_TEMP/041b"
          python scripts/build_lexical_expansion_041b.py --morphalou "$RUNNER_TEMP/morphalou.zip" --output "$RUNNER_TEMP/041b/lexical-expansion-runtime.json" --report "$RUNNER_TEMP/041b/rapport-041b.json"
      - name: Publish verification candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biblaw-041b-candidate-runtime
          path: ${{ runner.temp }}/041b/
          if-no-files-found: warn
          retention-days: 30
