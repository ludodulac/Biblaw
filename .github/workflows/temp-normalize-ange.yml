name: Migration temporaire ange vers anges

on:
  push:
    branches:
      - normalize-ange-to-anges

permissions:
  contents: write

jobs:
  migrate-rebuild-audit:
    if: "!contains(github.event.head_commit.message, '[generated-ange-migration]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrer uniquement le singleton ange et enregistrer l'adjudication
        shell: bash
        run: |
          python - <<'PY'
          import copy, hashlib, json, re
          from pathlib import Path

          root = Path('.')
          books_dir = root / 'data/thematic-index/books'
          book_paths = sorted(books_dir.glob('book-*.json'))
          assert len(book_paths) == 44, f'expected 44 canonical books, got {len(book_paths)}'

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def dump(path, data):
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Snapshot all canonical relations before the one-id migration.
          all_relations = []
          historical_anges = []
          legacy_hits = []
          singular_anges_evidence = []
          psalm_035_before = None
          for path in book_paths:
              data = load(path)
              for psalm in data.get('psalmAnalyses', []):
                  if psalm.get('recordId') == 'book-07-psalm-035':
                      psalm_035_before = copy.deepcopy(psalm)
                  for rel in psalm.get('themes', []):
                      row = {'path': str(path), 'recordId': psalm.get('recordId'), 'relation': copy.deepcopy(rel)}
                      all_relations.append(row)
                      if rel.get('themeId') == 'anges':
                          historical_anges.append(row)
                          teaching = rel.get('teaching') or ''
                          if re.search(r"\b(?:l[’']|un |cet |son |ton |votre )?[Aa]nge\b", teaching):
                              singular_anges_evidence.append(row)
                      elif rel.get('themeId') == 'ange':
                          legacy_hits.append(row)

          assert len({r['recordId'] for r in historical_anges}) == 130, 'anges must have 130 distinct psalms before migration'
          assert len(legacy_hits) == 1, f'expected one canonical ange relation, got {len(legacy_hits)}'
          assert legacy_hits[0]['recordId'] == 'book-07-psalm-035', legacy_hits[0]['recordId']
          assert len(singular_anges_evidence) >= 2, 'need at least two existing anges teachings explicitly using singular Ange'
          assert psalm_035_before is not None

          Path('/tmp/all_relations_before.json').write_text(json.dumps(all_relations, ensure_ascii=False, sort_keys=True), encoding='utf-8')
          Path('/tmp/historical_anges_before.json').write_text(json.dumps(historical_anges, ensure_ascii=False, sort_keys=True), encoding='utf-8')
          Path('/tmp/psalm035_before.json').write_text(json.dumps(psalm_035_before, ensure_ascii=False, sort_keys=True), encoding='utf-8')
          for tracked in ['data/thematic-index/theme-relations-validated.json', 'data/thematic-index/theme-rubrics.json']:
              Path('/tmp/' + Path(tracked).name + '.sha256').write_text(hashlib.sha256(Path(tracked).read_bytes()).hexdigest(), encoding='utf-8')

          # Change exactly one field in the existing canonical relation.
          path = books_dir / 'book-07.json'
          data = load(path)
          changed = 0
          for psalm in data.get('psalmAnalyses', []):
              if psalm.get('recordId') != 'book-07-psalm-035':
                  continue
              assert not any(r.get('themeId') == 'anges' for r in psalm.get('themes', [])), 'unexpected collision: psalm 035 already has anges'
              for rel in psalm.get('themes', []):
                  if rel.get('themeId') == 'ange':
                      before = copy.deepcopy(rel)
                      rel['themeId'] = 'anges'
                      after = copy.deepcopy(rel)
                      restored = copy.deepcopy(after)
                      restored['themeId'] = 'ange'
                      assert restored == before, 'book-07-psalm-035 changed beyond themeId'
                      assert rel.get('label') == 'Ange'
                      changed += 1
          assert changed == 1, f'expected exactly one relation migration, got {changed}'
          dump(path, data)

          # Build an evidence-grounded adjudication record from the actual pre-migration corpus.
          legacy = legacy_hits[0]
          evidence = singular_anges_evidence[:3]
          adjudications_path = root / 'data/thematic-index/theme-adjudications.json'
          store = load(adjudications_path)
          adjudication_id = 'adjudication--ange--anges--2026-09-12'
          assert not any(r.get('id') == adjudication_id for r in store.get('records', [])), 'adjudication already exists'

          def passage(row):
              rel = row['relation']
              return {
                  'recordId': row['recordId'],
                  'verseNumbers': rel.get('verseNumbers') or [],
                  'teaching': rel.get('teaching'),
              }

          canonical_sources = sorted({legacy['path'], *(r['path'] for r in evidence)})
          record = {
              'id': adjudication_id,
              'candidateId': 'review--ange--anges',
              'themes': [
                  {'themeId': 'ange', 'label': 'Ange'},
                  {'themeId': 'anges', 'label': 'Anges'},
              ],
              'triggeringQuestion': 'Determine from corpus evidence whether the singleton themeId ange marks a distinct general concept or fragments the same general concept already indexed as anges.',
              'discoverySignals': [
                  {'kind': 'identifier-fragmentation', 'detail': 'The canonical themeId anges covers 130 distinct psalms before migration while ange occurs once.'},
                  {'kind': 'singular-language-under-plural-id', 'detail': f'{len(evidence)} consulted existing anges teachings explicitly use Ange in the singular.'},
                  {'kind': 'user-adjudication', 'detail': 'User approved treating ange as a historical/input variant of the canonical general concept anges after AI-assisted corpus review.'},
              ],
              'passagesConsulted': {
                  'ange': [passage(legacy)],
                  'anges': [passage(r) for r in evidence],
              },
              'corpusForRelation': [
                  'Before migration, anges is attested in 130 distinct psalms and already covers both plural angelic language and teachings explicitly phrased around a singular Ange.',
                  'The singleton ange relation occurs only in book-07-psalm-035 and does not establish a stable documentary boundary separating an individual general Ange concept from the general anges concept.',
                  'The contextual label Ange on book-07-psalm-035 is preserved so the singular search form remains evidence-based after identifier normalization.',
              ],
              'corpusAgainstOrRefuting': [
                  'Lexical singular/plural difference alone is not treated as semantic proof; the decision rests on the reviewed corpus distribution and teachings.',
                  'Specialized themes such as ange-gardien, ange-de-la-benediction, ange-de-la-sanctification, ange-comme-orientation, archanges and ronde-des-archanges are explicitly outside this normalization and remain distinct.',
              ],
              'decision': 'VARIANT',
              'resolution': 'identifier-normalization',
              'legacyThemeId': 'ange',
              'canonicalThemeId': 'anges',
              'canonicalMapping': None,
              'humanJustification': None,
              'approvalJustification': 'AI-assisted corpus review prepared the evidence; the user explicitly approved normalizing legacy themeId ange into canonical themeId anges. This is not recorded as independent human-only review.',
              'review': {
                  'status': 'ai-assisted-user-approved',
                  'date': '2026-09-12',
                  'source': 'user-approved-ai-assisted-adjudication',
              },
              'provenance': {
                  'decisionProvenance': {
                      'type': 'ai-assisted-user-approved',
                      'preparedBy': 'openai-chatgpt',
                      'approvedBy': 'user',
                      'approvedOn': '2026-09-12',
                  },
                  'canonicalSources': canonical_sources,
              },
          }
          store.setdefault('records', []).append(record)
          dump(adjudications_path, store)
          print('Prepared exact ange -> anges canonical migration and traceable adjudication')
          PY

      - name: Reconstruire uniquement les dérivés thématiques prévus
        run: python scripts/rebuild_thematic_derivatives.py

      - name: Auditer la migration et les non-régressions
        shell: bash
        run: |
          python scripts/audit_conceptual_adjudications.py
          python scripts/audit_public_ui_contract.py
          python scripts/audit_two_theme_search.py
          python - <<'PY'
          import copy, hashlib, importlib.util, json
          from pathlib import Path

          root = Path('.')
          books = sorted((root / 'data/thematic-index/books').glob('book-*.json'))
          assert len(books) == 44

          all_after = []
          current_anges = []
          legacy_hits = []
          psalm_035_after = None
          for path in books:
              data = json.loads(path.read_text(encoding='utf-8'))
              for psalm in data.get('psalmAnalyses', []):
                  if psalm.get('recordId') == 'book-07-psalm-035':
                      psalm_035_after = copy.deepcopy(psalm)
                  for rel in psalm.get('themes', []):
                      row = {'path': str(path), 'recordId': psalm.get('recordId'), 'relation': copy.deepcopy(rel)}
                      all_after.append(row)
                      if rel.get('themeId') == 'anges': current_anges.append(row)
                      if rel.get('themeId') == 'ange': legacy_hits.append(row)

          assert not legacy_hits, f'legacy ange still canonical: {legacy_hits}'
          assert len({r['recordId'] for r in current_anges}) == 131, 'anges must have exactly 131 distinct psalms after migration'

          historical = json.loads(Path('/tmp/historical_anges_before.json').read_text(encoding='utf-8'))
          historical_now = [r for r in current_anges if r['recordId'] != 'book-07-psalm-035']
          assert historical_now == historical, 'one or more of the 130 historical anges relations changed'

          before_all = json.loads(Path('/tmp/all_relations_before.json').read_text(encoding='utf-8'))
          before_other = [r for r in before_all if r['relation'].get('themeId') not in {'ange', 'anges'}]
          after_other = [r for r in all_after if r['relation'].get('themeId') not in {'ange', 'anges'}]
          assert after_other == before_other, 'a canonical relation outside ange/anges changed'

          psalm_before = json.loads(Path('/tmp/psalm035_before.json').read_text(encoding='utf-8'))
          psalm_after = copy.deepcopy(psalm_035_after)
          migrated = [r for r in psalm_after['themes'] if r.get('themeId') == 'anges' and r.get('label') == 'Ange']
          assert len(migrated) == 1
          migrated[0]['themeId'] = 'ange'
          assert psalm_after == psalm_before, 'book-07-psalm-035 changed beyond the approved themeId substitution'

          for tracked in ['data/thematic-index/theme-relations-validated.json', 'data/thematic-index/theme-rubrics.json']:
              before_hash = Path('/tmp/' + Path(tracked).name + '.sha256').read_text(encoding='utf-8')
              after_hash = hashlib.sha256(Path(tracked).read_bytes()).hexdigest()
              assert after_hash == before_hash, f'{tracked} changed unexpectedly'

          directory = json.loads(Path('data/thematic-index/theme-directory.json').read_text(encoding='utf-8'))
          by_id = {t['id']: t for t in directory['themes']}
          assert 'ange' not in by_id
          assert by_id['anges']['occurrenceCount'] == 131

          public = json.loads(Path('data/thematic-index/theme-directory-public.json').read_text(encoding='utf-8'))
          public_by_id = {t['id']: t for t in public['themes']}
          assert 'ange' not in public_by_id
          assert public_by_id['anges']['occurrenceCount'] == 131
          occ035 = [o for o in public_by_id['anges']['occurrences'] if o['recordId'] == 'book-07-psalm-035']
          assert len(occ035) == 1 and occ035[0].get('verseNumbers') and occ035[0].get('teaching')

          search = json.loads(Path('data/thematic-index/theme-search-index.json').read_text(encoding='utf-8'))
          aliases = {a['queryKey']: a for a in search['aliases']}
          for query in ('ange', 'anges'):
              assert aliases[query]['themeIds'] == ['anges'], (query, aliases[query])
              assert aliases[query]['ambiguous'] is False

          runtime = json.loads(Path('data/thematic-index/theme-search-runtime.json').read_text(encoding='utf-8'))
          for query in ('ange', 'anges'):
              assert runtime['aliases'][query]['themeIds'] == ['anges']
              assert runtime['aliases'][query]['ambiguous'] is False
          assert 'ange' not in runtime.get('neighbors', {})

          # One-theme and two-theme aliases resolve to the exact same canonical occurrence set.
          record_ids = {tid: {o['recordId'] for o in t['occurrences']} for tid, t in public_by_id.items()}
          assert record_ids['anges'] == {o['recordId'] for o in public_by_id['anges']['occurrences']}
          for other_id, other_records in record_ids.items():
              via_ange = record_ids['anges'] & other_records
              via_anges = record_ids['anges'] & other_records
              assert via_ange == via_anges, f'dual-theme alias intersection drift with {other_id}'

          # Browser search catalog must retain the migrated Psalm for source navigation.
          catalog_text = Path('data/browser-search-catalog.json').read_text(encoding='utf-8')
          assert 'book-07-psalm-035' in catalog_text

          # The normalizer guard must reject a reintroduced legacy id.
          spec = importlib.util.spec_from_file_location('normalizer', 'scripts/normalize_known_theme_identifiers.py')
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          fake = {'psalmAnalyses': [{'recordId': 'fixture', 'themes': [{'themeId': 'ange', 'label': 'Ange'}]}]}
          try:
              mod.validate_data(fake, Path('fixture.json'))
          except AssertionError:
              pass
          else:
              raise AssertionError('normalizer failed to reject reintroduced legacy ange')

          adjudications = json.loads(Path('data/thematic-index/theme-adjudications.json').read_text(encoding='utf-8'))
          rec = next(r for r in adjudications['records'] if r['id'] == 'adjudication--ange--anges--2026-09-12')
          assert rec['decision'] == 'VARIANT'
          assert rec['resolution'] == 'identifier-normalization'
          assert rec['legacyThemeId'] == 'ange' and rec['canonicalThemeId'] == 'anges'
          assert rec['review']['status'] == 'ai-assisted-user-approved'
          assert rec['provenance']['decisionProvenance']['type'] == 'ai-assisted-user-approved'
          assert rec['canonicalMapping'] is None

          print('Migration audit OK: ange is legacy alias, anges is canonical with 131 psalms, all other canonical relations unchanged')
          PY

      - name: Prouver que le nouveau statut ne généralise pas l'approbation IA
        shell: bash
        run: |
          cp data/thematic-index/theme-adjudications.json /tmp/theme-adjudications.good.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/thematic-index/theme-adjudications.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          r = next(x for x in d['records'] if x['id'] == 'adjudication--ange--anges--2026-09-12')
          r['resolution'] = 'related-semantic-claim'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          if python scripts/audit_conceptual_adjudications.py; then
            echo 'ERROR: ai-assisted-user-approved accepted outside identifier-normalization' >&2
            exit 1
          fi
          cp /tmp/theme-adjudications.good.json data/thematic-index/theme-adjudications.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/thematic-index/theme-adjudications.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          semantic = next(x for x in d['records'] if x.get('review', {}).get('status') == 'human-approved' and x.get('decision') != 'VARIANT')
          semantic['review']['status'] = 'ai-assisted-user-approved'
          semantic['resolution'] = 'identifier-normalization'
          semantic['legacyThemeId'] = semantic['themes'][0]['themeId']
          semantic['canonicalThemeId'] = semantic['themes'][1]['themeId']
          semantic['canonicalMapping'] = None
          semantic['humanJustification'] = None
          semantic['approvalJustification'] = 'invalid test fixture'
          semantic.setdefault('provenance', {})['decisionProvenance'] = {'type':'ai-assisted-user-approved','preparedBy':'openai-chatgpt','approvedBy':'user','approvedOn':'2026-09-12'}
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          if python scripts/audit_conceptual_adjudications.py; then
            echo 'ERROR: semantic adjudication improperly accepted through AI-assisted normalization path' >&2
            exit 1
          fi
          cp /tmp/theme-adjudications.good.json data/thematic-index/theme-adjudications.json
          python scripts/audit_conceptual_adjudications.py

      - name: Committer uniquement sources migrées et dérivés reconstruits
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index/books/book-07.json \
                  data/thematic-index/theme-adjudications.json \
                  data/thematic-index/book-contexts.json \
                  data/thematic-index/theme-directory.json \
                  data/thematic-index/theme-directory-public.json \
                  data/thematic-index/theme-search-index.json \
                  data/thematic-index/theme-connections.json \
                  data/thematic-index/theme-search-runtime.json \
                  data/browser-search-catalog.json
          git diff --cached --quiet && { echo 'No generated changes to commit'; exit 1; }
          git commit -m 'Reconstruire les dérivés après normalisation ange vers anges [generated-ange-migration]'
          git push origin HEAD:normalize-ange-to-anges
