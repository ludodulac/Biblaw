name: Validate thematic index

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/thematic-index/books/**'
      - 'scripts/run_canonical_thematic_pipeline.py'
      - 'scripts/*semantic*.py'
      - 'scripts/ground_*semantic*.py'
      - 'scripts/complete_*thematic.py'
      - 'scripts/repair_*.py'
      - 'scripts/sync_thematic_documentary_status.py'
      - 'scripts/build_book_contexts.py'
      - 'scripts/normalize_thematic_metadata.py'
      - 'scripts/validate_thematic_index.py'
      - 'scripts/build_thematic_directory.py'
      - '.github/workflows/validate-thematic-index.yml'

permissions:
  contents: write

concurrency:
  group: thematic-index-generated-files
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extraction dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run canonical documentary repair and thematic indexing pipeline
        run: python scripts/run_canonical_thematic_pipeline.py
      - name: Commit canonical corpus repairs and generated thematic outputs
        run: |
          WATCHED='data/corpus/books/book-15 data/corpus/books/book-23 data/corpus/books/book-26 data/corpus/books/book-32 data/corpus/books/book-35 data/corpus/books/book-36 data/corpus/books/book-38 data/corpus/books/book-44 data/notes/books/book-15 data/notes/books/book-23 data/notes/books/book-26 data/notes/books/book-32 data/notes/books/book-35 data/notes/books/book-36 data/notes/books/book-38 data/thematic-index/books data/thematic-index/book-contexts.json data/thematic-index/theme-directory.json data/thematic-index/validation-report.json'
          if [ -z "$(git status --porcelain -- $WATCHED)" ]; then
            echo 'No canonical thematic changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $WATCHED
          git commit -m 'Preserve audited corpus and canonical deep thematic index'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
