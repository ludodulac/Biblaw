name: BIBLAW 040C canonical corpus verb inventory
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - 'scripts/inventory_corpus_verbs_040c.py'
      - '.github/workflows/occv2-040c-verb-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    if: github.event.pull_request.number == 67
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing French NLP ecosystem for automatic inventory
        run: |
          python -m pip install --disable-pip-version-check 'spacy>=3.8,<3.9'
          python -m pip install --disable-pip-version-check 'https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl'
      - name: Run full canonical psalm inventory
        run: |
          python scripts/inventory_corpus_verbs_040c.py "$RUNNER_TEMP/biblaw-040c"
      - name: Validate output and report
        run: |
          python - "$RUNNER_TEMP/biblaw-040c" <<'PY'
          import csv,json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);r=json.loads((p/'rapport-040c.json').read_text())
          rows=list(csv.DictReader((p/'verbes-corpus-040c.csv').open(encoding='utf-8-sig')))
          assert r['psalms']>0 and len(rows)==r['total_verbs_including_auxiliaries']
          assert sum(int(x['nombre_total_occurrences']) for x in rows)==r['total_verb_occurrences']
          assert [int(x['nombre_total_occurrences']) for x in rows]==sorted((int(x['nombre_total_occurrences']) for x in rows),reverse=True)
          assert r['verification']=='AUTOMATIC_PROVISIONAL_NOT_HUMAN_VERIFIED'
          print('040C CSV COUNTS AND SORT ORDER PASS')
          PY
      - name: Upload CSV and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biblaw-040c-corpus-verbs
          path: ${{ runner.temp }}/biblaw-040c/
          if-no-files-found: warn
          retention-days: 30
