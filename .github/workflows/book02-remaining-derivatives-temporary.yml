name: Temporary Book 02 full thematic rebuild

on:
  push:
    branches:
      - feat/book02-psalms11-24-semantic-coverage-2026-11-08
    paths:
      - .github/workflows/book02-remaining-derivatives-temporary.yml
      - data/thematic-index/books/book-02.json
      - scripts/audit_book02_psalms11_24_theme_coverage.py

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild every deterministic thematic index
        run: python scripts/check_biblaw.py TARGETED --area thematic
      - name: Refresh conceptual coverage after new relations
        run: python scripts/audit_conceptual_coverage.py
      - name: Guard historical Psalm indexing and projections
        run: |
          python scripts/audit_book01_first10_theme_coverage.py
          python scripts/audit_book01_psalms11_20_theme_coverage.py
          python scripts/audit_book01_end_book02_first10_theme_coverage.py
      - name: Verify all remaining Psalms of Gabriel
        run: python scripts/audit_book02_psalms11_24_theme_coverage.py
      - name: Commit generated thematic files to feature branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index data/browser-search-catalog.json
          if git diff --cached --quiet; then
            echo 'No derived changes remain'
            exit 0
          fi
          git commit -m 'Refresh all thematic search projections after Gabriel book 2 review'
          git push origin HEAD:feat/book02-psalms11-24-semantic-coverage-2026-11-08
