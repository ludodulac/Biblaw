name: BIBLAW Livre 35 - reconstruction ephemere
on:
  push:
    branches:
      - feat/book35-raphael-thematic-coverage-20261109
permissions:
  contents: write
jobs:
  rebuild:
    name: Regenerer et auditer les index du livre 35
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Installer l'extracteur PDF requis par les scripts historiques
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Regenerer les artefacts thematiques canoniques
        env:
          BIBLAW_STAGE_TIMEOUT_SECONDS: "900"
          BIBLAW_SLOW_STEP_SECONDS: "120"
        run: python scripts/run_canonical_thematic_pipeline.py
      - name: Verifier le livre 35 et les index
        run: |
          python scripts/audit_book35_full_theme_coverage.py
          python scripts/validate_thematic_index.py
          python scripts/validate_thematic_search_runtime.py
          python scripts/audit_conceptual_coverage.py
      - name: Sauvegarder les index reconstruits sur la branche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u data/thematic-index
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "BIBLAW book35: regenerate canonical thematic indexes after 148 enrichments"
            git push origin HEAD:feat/book35-raphael-thematic-coverage-20261109
          fi
