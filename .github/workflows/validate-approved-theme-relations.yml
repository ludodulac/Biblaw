name: Validate approved theme relations

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/thematic-index/THEME-RELATIONS-CONTRACT.md'
      - 'data/thematic-index/theme-relations-validated.json'
      - 'data/thematic-index/theme-relations-public.json'
      - 'data/thematic-index/books/**'
      - 'data/thematic-index/theme-search-index.json'
      - 'data/thematic-index/theme-directory-public.json'
      - 'scripts/audit_validated_theme_relations.py'
      - 'scripts/audit_validated_theme_relations_product_isolation.py'
      - 'scripts/audit_public_theme_relations.py'
      - 'scripts/build_public_theme_relations.py'
      - 'js/biblaw.js'
      - 'js/theme-relations.js'
      - 'index.html'
      - 'scripts/build_browser_search_catalog.py'
      - 'scripts/build_public_theme_directory.py'
      - 'scripts/build_thematic_directory.py'
      - 'scripts/build_thematic_search_index.py'
      - 'scripts/build_thematic_connections.py'
      - 'scripts/build_thematic_search_runtime.py'
      - 'scripts/rebuild_thematic_derivatives.py'
      - 'scripts/run_canonical_thematic_pipeline.py'
      - 'scripts/build_pages_site.py'
      - 'scripts/audit_production_search_queries.py'
      - '.github/workflows/validate-approved-theme-relations.yml'
  pull_request:
    paths:
      - 'data/thematic-index/THEME-RELATIONS-CONTRACT.md'
      - 'data/thematic-index/theme-relations-validated.json'
      - 'data/thematic-index/theme-relations-public.json'
      - 'data/thematic-index/books/**'
      - 'data/thematic-index/theme-search-index.json'
      - 'data/thematic-index/theme-directory-public.json'
      - 'scripts/audit_validated_theme_relations.py'
      - 'scripts/audit_validated_theme_relations_product_isolation.py'
      - 'scripts/audit_public_theme_relations.py'
      - 'scripts/build_public_theme_relations.py'
      - 'js/biblaw.js'
      - 'js/theme-relations.js'
      - 'index.html'
      - 'scripts/build_browser_search_catalog.py'
      - 'scripts/build_public_theme_directory.py'
      - 'scripts/build_thematic_directory.py'
      - 'scripts/build_thematic_search_index.py'
      - 'scripts/build_thematic_connections.py'
      - 'scripts/build_thematic_search_runtime.py'
      - 'scripts/rebuild_thematic_derivatives.py'
      - 'scripts/run_canonical_thematic_pipeline.py'
      - 'scripts/build_pages_site.py'
      - 'scripts/audit_production_search_queries.py'
      - '.github/workflows/validate-approved-theme-relations.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check validator and builder syntax
        run: python -m py_compile scripts/audit_validated_theme_relations.py scripts/audit_validated_theme_relations_product_isolation.py scripts/audit_public_theme_relations.py scripts/build_public_theme_relations.py
      - name: Check presentation JavaScript syntax
        run: node --check js/theme-relations.js
      - name: Audit canonical approved relations
        run: python scripts/audit_validated_theme_relations.py
      - name: Rebuild public relation presentation view
        run: |
          python scripts/build_public_theme_relations.py
          git diff --exit-code -- data/thematic-index/theme-relations-public.json
      - name: Audit public relation presentation boundary
        run: python scripts/audit_public_theme_relations.py
      - name: Prove production search contract is unchanged
        run: python scripts/audit_production_search_queries.py
      - name: Build Pages payload with presentation-only relations
        run: |
          python scripts/build_pages_site.py
          test -e _site/data/thematic-index/theme-relations-public.json
          test -e _site/js/theme-relations.js
          test ! -e _site/data/thematic-index/theme-relations-validated.json
