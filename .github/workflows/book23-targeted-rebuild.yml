name: BIBLAW — Book 23 targeted rebuild (temporary)
on:
  push:
    branches:
      - feat/book23-raphael-coverage-20261109
permissions:
  contents: write
jobs:
  book23:
    if: ${{ !contains(github.event.head_commit.message, '[book23-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile new scripts
        run: python -m py_compile scripts/apply_book23_enrichment.py scripts/audit_book23_full_theme_coverage.py
      - name: Apply book 23 enrichment twice (idempotence)
        run: |
          python scripts/apply_book23_enrichment.py
          sha256sum data/thematic-index/books/book-23.json > /tmp/book23-before.sha
          python scripts/apply_book23_enrichment.py
          sha256sum -c /tmp/book23-before.sha
      - name: Rebuild canonical thematic derivatives
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Validate book 23 and protect preceding books
        run: |
          python scripts/audit_book23_full_theme_coverage.py
          python scripts/audit_book22_full_theme_coverage.py
          python scripts/audit_book21_full_theme_coverage.py
          python scripts/audit_book20_full_theme_coverage.py
          python scripts/validate_thematic_index.py
          git diff --exit-code -- data/corpus/books
      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "build(book23): regenerate thematic indexes [book23-output]"
            git push origin HEAD:feat/book23-raphael-coverage-20261109
          fi
