name: Regenerate conceptual coverage report for Book 18
on:
  push:
    branches:
      - feat/book18-full-theme-coverage
    paths:
      - .github/workflows/book18-coverage-temporary.yml
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate conceptual coverage report
        run: python scripts/audit_conceptual_coverage.py
      - name: Commit reproducible report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index/conceptual-coverage-audit.json
          if git diff --cached --quiet; then
            echo 'Already current'
          else
            git commit -m 'Refresh conceptual coverage evidence after book enrichment'
            git push origin HEAD:feat/book18-full-theme-coverage
          fi
