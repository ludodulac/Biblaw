name: BIBLAW 045 question-aware ranking benchmark
on:
  push:
    branches: [feat/045-question-aware-psalm-ranking]
    paths:
      - js/question-psalm-ranker.js
      - scripts/benchmark_045_question_psalm_ranking.js
      - .github/workflows/045-question-ranking.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Question ranking before and after
        run: node scripts/benchmark_045_question_psalm_ranking.js | tee ranking-045.json
      - name: Existing Q120 benchmark
        run: node scripts/benchmark_theme_engine_q120.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biblaw-045-ranking-benchmark
          path: ranking-045.json
