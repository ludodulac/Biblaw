name: Validate Bible books 1-10

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/validate_books_01_10.py'
      - 'data/corpus/books/**'
      - '.github/workflows/validate-books-01-10.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Validate books 1-10
        run: python scripts/validate_books_01_10.py
      - name: Commit validation report
        run: |
          if [ -z "$(git status --porcelain -- data/pilot/books-01-10-validation-report.json)" ]; then
            echo 'No validation changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pilot/books-01-10-validation-report.json
          git commit -m 'Validate Bible books 1-10 extraction'
          git push
