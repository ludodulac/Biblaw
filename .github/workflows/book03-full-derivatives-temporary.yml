name: Temporary Book 03 full thematic derivative rebuild

on:
  push:
    branches:
      - feat/book03-complete-theme-evidence-2026-11-08
    paths:
      - .github/workflows/book03-full-derivatives-temporary.yml
      - data/thematic-index/books/book-03.json
      - scripts/audit_book03_full_theme_coverage.py
      - scripts/audit_book01_end_book02_first10_theme_coverage.py

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild the entire deterministic thematic search system
        run: python scripts/check_biblaw.py TARGETED --area thematic
      - name: Refresh independent conceptual coverage measurements
        run: python scripts/audit_conceptual_coverage.py
      - name: Verify historic Books 1 and 2 are unchanged by this thematic pass
        run: |
          python scripts/audit_book01_first10_theme_coverage.py
          python scripts/audit_book01_psalms11_20_theme_coverage.py
          python scripts/audit_book01_end_book02_first10_theme_coverage.py
          python scripts/audit_book02_psalms11_24_theme_coverage.py
      - name: Verify entire 23-Psalm Book 03 and public search projections
        run: python scripts/audit_book03_full_theme_coverage.py
      - name: Commit all computed thematic derivatives to review branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index data/browser-search-catalog.json
          if git diff --cached --quiet; then
            echo 'All derivatives are already deterministic and current'
            exit 0
          fi
          git commit -m 'Regenerate public thematic indexes for all 23 Raphael Psalms'
          git push origin HEAD:feat/book03-complete-theme-evidence-2026-11-08
