name: BIBLAW 063 verify unresolved PDF notes
on:
  pull_request:
    paths:
      - 'scripts/review_notes_063.py'
      - '.github/workflows/review-notes-063.yml'
permissions:
  contents: read
jobs:
  review-33:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install --quiet pymupdf==1.26.4
      - name: Compare only 30 uncertain notes plus 3 book 44 against PDF typography
        run: python scripts/review_notes_063.py
      - name: Preserve full PDF evidence for each examined note
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biblaw-063-original-pdf-evidence
          path: reports/notes-063/targeted-pdf-evidence.json
          if-no-files-found: error
