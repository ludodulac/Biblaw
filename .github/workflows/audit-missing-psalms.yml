name: Audit missing Psalm boundaries

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_missing_psalm_boundaries.py'
      - '.github/workflows/audit-missing-psalms.yml'

permissions:
  contents: write

concurrency:
  group: bible-corpus-extraction
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Audit source PDF boundaries
        run: python scripts/audit_missing_psalm_boundaries.py
      - name: Commit audit report
        run: |
          if [ -z "$(git status --porcelain -- data/pilot/missing-psalm-boundary-audit.json)" ]; then
            echo 'No audit changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pilot/missing-psalm-boundary-audit.json
          git commit -m 'Audit missing Psalm boundaries from PDF'
          git pull --rebase origin main
          git push origin HEAD:main
