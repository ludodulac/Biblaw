name: Repair book 32 Psalm 182
on:
  push:
    paths:
      - 'scripts/repair_book32_psalm182.py'
      - 'scripts/finalize_books32_34_semantic.py'
      - '.github/workflows/repair-book32-psalm182.yml'
permissions:
  contents: write
concurrency:
  group: thematic-index-generated-files
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Repair Psalm 182 from PDF
        run: python scripts/repair_book32_psalm182.py
      - name: Repair audited PDF boundaries already closed in books 35 and 36
        run: |
          python - <<'PY'
          import scripts.repair_known_pdf_psalm_anomalies as r
          for case in r.CASES:
              if case['book'] in (35, 36):
                  r.extract_case(case)
          PY
      - name: Rebuild thematic Books 31-40 then preserve completed deep passes
        run: |
          python scripts/complete_books31_40_thematic.py
          python scripts/deepen_books29_31_semantic_evidence.py
          python scripts/finalize_books29_31_semantic.py
          python scripts/deepen_books32_34_semantic_evidence.py
          python scripts/finalize_books32_34_semantic.py
          python scripts/deepen_books35_37_semantic_evidence.py
          python scripts/finalize_books35_37_semantic.py
      - name: Documentary and global validation
        run: |
          python scripts/sync_thematic_documentary_status.py
          python scripts/normalize_thematic_metadata.py
          python scripts/build_book_contexts.py
          python scripts/validate_thematic_index.py
          python scripts/build_thematic_directory.py
      - name: Commit repaired generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/corpus/books/book-32 data/notes/books/book-32 data/corpus/books/book-35 data/corpus/books/book-36 data/notes/books/book-35 data/notes/books/book-36 data/thematic-index data/pilot/books-31-40-validation-report.json
          git commit -m 'Restore Book 32 Psalm 182 and preserve deep books 31 to 37' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
