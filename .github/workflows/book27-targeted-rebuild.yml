name: BIBLAW — Book 27 targeted rebuild (temporary)
on:
  push:
    branches:
      - feat/book27-raphael-thematic-coverage-20261109
permissions:
  contents: write
jobs:
  book27:
    if: ${{ !contains(github.event.head_commit.message, '[book27-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Raphael scripts and canonical pipeline
        run: python -m py_compile scripts/apply_book27_enrichment.py scripts/audit_book27_full_theme_coverage.py scripts/run_canonical_thematic_pipeline.py
      - name: Apply book 27 twice and verify idempotence
        run: |
          python scripts/apply_book27_enrichment.py
          sha256sum data/thematic-index/books/book-27.json > /tmp/book27.sha
          python scripts/apply_book27_enrichment.py
          sha256sum -c /tmp/book27.sha
      - name: Rebuild canonical thematic derivatives
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Verify books 20–27 and unchanged source corpus
        run: |
          python scripts/audit_book27_full_theme_coverage.py
          python scripts/audit_book26_full_theme_coverage.py
          python scripts/audit_book25_full_theme_coverage.py
          python scripts/audit_book24_full_theme_coverage.py
          python scripts/audit_book23_full_theme_coverage.py
          python scripts/audit_book22_full_theme_coverage.py
          python scripts/audit_book21_full_theme_coverage.py
          python scripts/audit_book20_full_theme_coverage.py
          python scripts/validate_thematic_index.py
          git diff --exit-code -- data/corpus/books
      - name: Commit regenerated thematic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "build(book27): regenerate thematic indexes [book27-output]"
            git push origin HEAD:feat/book27-raphael-thematic-coverage-20261109
          fi
