name: Validate deep books 23 to 25

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/deepen_book23_semantic_part1.py'
      - 'scripts/deepen_books23_25_semantic_evidence.py'
      - 'scripts/finalize_books23_25_semantic.py'
      - '.github/workflows/validate-deep-books23-25.yml'

permissions:
  contents: write

concurrency:
  group: thematic-index-generated-files
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild canonical books 21 to 23
        run: python scripts/complete_books21_23_thematic.py
      - name: Preserve completed deep Michael book 21
        run: |
          python scripts/deepen_book21_semantic_part1.py
          python scripts/deepen_book21_semantic_part2.py
          python scripts/deepen_book21_semantic_part3.py
          python scripts/deepen_book21_semantic_part4.py
          python scripts/deepen_book21_semantic_part5.py
          python scripts/deepen_book21_semantic_part6.py
          python scripts/deepen_book21_semantic_part7.py
          python scripts/deepen_book21_semantic_part8.py
          python scripts/ground_book21_semantic_evidence.py
          python scripts/finalize_book21_semantic.py
      - name: Preserve completed deep Gabriel book 22
        run: |
          python scripts/deepen_book22_semantic_part1.py
          python scripts/deepen_book22_semantic_part2.py
          python scripts/deepen_book22_semantic_part3.py
          python scripts/deepen_book22_semantic_part4.py
          python scripts/deepen_book22_semantic_part5.py
          python scripts/deepen_book22_semantic_part6.py
          python scripts/deepen_book22_semantic_part7.py
          python scripts/ground_book22_semantic_evidence.py
          python scripts/finalize_book22_semantic.py
      - name: Apply curated Raphael book 23 opening pass
        run: python scripts/deepen_book23_semantic_part1.py
      - name: Rebuild canonical books 24 to 26
        run: python scripts/complete_books24_26_thematic.py
      - name: Ground complete deep evidence for books 23 to 25
        run: python scripts/deepen_books23_25_semantic_evidence.py
      - name: Finalize books 23 to 25
        run: python scripts/finalize_books23_25_semantic.py
      - name: Gate thematic completion on documentary integrity
        run: python scripts/sync_thematic_documentary_status.py
      - name: Normalize thematic metadata
        run: python scripts/normalize_thematic_metadata.py
      - name: Build PDF-only book contexts
        run: python scripts/build_book_contexts.py
      - name: Validate thematic index
        run: python scripts/validate_thematic_index.py
      - name: Rebuild thematic directory
        run: python scripts/build_thematic_directory.py
      - name: Commit generated outputs
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/thematic-index/books data/thematic-index/book-contexts.json data/thematic-index/theme-directory.json data/thematic-index/validation-report.json)" ]; then
            echo 'No thematic index changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index/books data/thematic-index/book-contexts.json data/thematic-index/theme-directory.json data/thematic-index/validation-report.json
          git commit -m 'Finalize deep semantic books 23 to 25'
          git pull --rebase origin main
          git push origin HEAD:main
