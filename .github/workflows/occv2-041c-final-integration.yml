name: BIBLAW 041C integrate and Chromium verify occurrences
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - 'scripts/build_lexical_expansion_041b.py'
      - 'scripts/smoke_occurrences_041c.mjs'
      - 'scripts/audit_lexical_expansion_041c.py'
      - 'scripts/audit_lexical_expansion_runtime.py'
      - '.github/workflows/occv2-041c-final-integration.yml'
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.pull_request.number == 67
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/occv2-040a-simple-morphological-search
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify official Morphalou 3.1 archive
        run: |
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 -o "$RUNNER_TEMP/morphalou.zip" 'https://huggingface.co/datasets/datasets-CNRS/Morphalou/resolve/2b5dec836bef836a184d157ba3f71755bf55d523/Morphalou3.1_formatCSV_toutEnUn.zip?download=true'
          echo '4fc815cbf17aecdf1b47f6bbc263489a460fd8d11ae17e6b522336c72bd0e333  '"$RUNNER_TEMP/morphalou.zip" | sha256sum -c -
      - name: Generate canonical derived runtime
        run: |
          mkdir -p "$RUNNER_TEMP/041c"
          python scripts/build_lexical_expansion_041b.py --morphalou "$RUNNER_TEMP/morphalou.zip" --output data/lexical-expansion-runtime.json --report "$RUNNER_TEMP/041c/rapport-generation-041c.json"
      - name: Audit generated lexical runtime
        run: python scripts/audit_lexical_expansion_runtime.py
      - name: Build exact Pages payload locally without deployment
        run: python scripts/build_pages_site.py
      - name: Install isolated Chromium test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify eight searches in real Chromium
        env:
          BIBLAW_REPORT: ${{ runner.temp }}/041c/rapport-navigateur-041c.json
        run: |
          python -m http.server 4173 --directory _site >/tmp/biblaw-041c-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/smoke_occurrences_041c.mjs
          node scripts/smoke_occurrence_expansion_browser.mjs
      - name: Commit generated runtime only after browser PASS
        run: |
          git add data/lexical-expansion-runtime.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(041C): regenerate browser lexical runtime from Morphalou'
            git fetch origin feat/occv2-040a-simple-morphological-search
            git rebase -X theirs origin/feat/occv2-040a-simple-morphological-search
            git push origin HEAD:feat/occv2-040a-simple-morphological-search
          fi
      - name: Publish measured verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biblaw-041c-browser-results
          path: ${{ runner.temp }}/041c/
          if-no-files-found: warn
          retention-days: 30
