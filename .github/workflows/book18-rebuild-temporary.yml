name: Rebuild Book 18 indexes on feature branch
on:
  push:
    branches:
      - feat/book18-full-theme-coverage
    paths:
      - data/thematic-index/books/book-18.json
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild canonical thematic derivatives
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Verify Book 18 audited evidence
        run: python scripts/audit_book18_full_theme_coverage.py
      - name: Verify earlier Book 17 was not affected
        run: python scripts/audit_book17_full_theme_coverage.py
      - name: Commit deterministic indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index data/browser-search-catalog.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Rebuild BIBLAW thematic indexes for Book 18'
            git push origin HEAD:feat/book18-full-theme-coverage
          fi
