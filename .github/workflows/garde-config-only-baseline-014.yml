name: GARDE config-only baseline 014
on:
  push:
    branches: [feat/linguistic-occurrences-014-replication]
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_linguistic_adjudication.py --config data/linguistic/pilots/garde-config.json
      - run: |
          python - <<'PY'
          import json,importlib.util
          from pathlib import Path
          R=Path('.')
          spec=importlib.util.spec_from_file_location('m',R/'scripts/build_linguistic_adjudication.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          cfg=json.load(open('data/linguistic/pilots/garde-config.json'));gold=json.load(open('data/linguistic/gold/garde-gold.json'))
          raw,adj,inv=m.build(cfg); by={x['occurrenceId']:x for x in adj['analyses']}; ro={x['occurrenceId']:x for x in raw['occurrences']}
          z={'correct':[],'unknown':[],'ambiguous':[],'contradictory':[]}
          for g in gold['entries']:
            a=by[g['occurrenceId']]
            if a['category']==g['category']: z['correct'].append(g['occurrenceId'])
            elif a['status']=='UNKNOWN': z['unknown'].append(g['occurrenceId'])
            elif a['status']=='AMBIGUOUS': z['ambiguous'].append(g['occurrenceId'])
            else:z['contradictory'].append({'id':g['occurrenceId'],'expected':g['category'],'actual':a['category'],'context':ro[g['occurrenceId']]['context']})
          print(json.dumps({'raw':raw['occurrenceCount'],'segmentation':adj['segmentationCounts'],'counts':adj['counts'],'gold':{k:len(v) for k,v in z.items()},'details':z},ensure_ascii=False))
          for a in adj['analyses']:
            if a['status']=='PROVISIONAL': print(json.dumps({'id':a['occurrenceId'],'category':a['category'],'evidence':a['evidence'],'context':ro[a['occurrenceId']]['context']},ensure_ascii=False))
          PY
