name: Rebuild Book 19 indexes on feature branch
on:
  push:
    branches:
      - feat/book19-full-theme-coverage
    paths:
      - data/thematic-index/books/book-19.json
      - scripts/audit_book19_full_theme_coverage.py
      - .github/workflows/book19-rebuild-temporary.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild canonical thematic derivatives
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Verify Book 19 audited evidence
        run: python scripts/audit_book19_full_theme_coverage.py
      - name: Verify Book 18 historical preservation
        run: python scripts/audit_book18_full_theme_coverage.py
      - name: Regenerate conceptual coverage report
        run: python scripts/audit_conceptual_coverage.py
      - name: Commit deterministic outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index data/browser-search-catalog.json
          if git diff --cached --quiet; then
            echo 'Generated outputs already current'
          else
            git commit -m 'Rebuild BIBLAW thematic indexes and conceptual coverage for Book 19'
            git push origin HEAD:feat/book19-full-theme-coverage
          fi
