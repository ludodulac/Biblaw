name: BIBLAW 043 thematic question quality
on:
  push:
    branches: [feat/043-thematic-relevance-quality]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relevance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit eight real user questions
        run: node scripts/audit_043_eight_questions.js --require-liberation
      - name: Assert thematic ranking across eight questions
        run: node scripts/audit_043b_ranking.js
      - name: Run existing thematic benchmark
        run: node scripts/benchmark_theme_engine_q120.js
      - name: Build local browser payload
        run: python scripts/build_pages_site.py
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Chromium thematic ranking smoke
        run: |
          python -m http.server 4173 --directory _site >/tmp/biblaw-043b-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/smoke_043b_thematic_ranking_browser.mjs
      - name: Upload eight-question report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biblaw-043-eight-question-report
          path: |
            audit-043-eight-questions.json
            audit-043b-ranking.json
