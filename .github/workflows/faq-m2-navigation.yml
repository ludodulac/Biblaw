name: Biblaw FAQ M2 - fluid navigation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/biblaw-faq.js'
      - 'css/biblaw-light.css'
      - 'scripts/smoke_faq_m2_navigation_browser.mjs'
      - '.github/workflows/faq-m2-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  faq-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original FAQ content, deduplication and lazy answers
        run: |
          node scripts/check_faq_integrity.mjs
          node scripts/check_faq_100_merge.mjs
          node scripts/check_faq_101_topics.mjs
          node scripts/check_faq_dom.mjs
      - name: Build local Pages bundle without deployment
        run: python scripts/build_pages_site.py
      - name: Install isolated Chromium test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test FAQ M2 mobile and desktop navigation
        run: |
          python -m http.server 4173 --directory _site >/tmp/biblaw-faq-m2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/smoke_faq_m2_navigation_browser.mjs
