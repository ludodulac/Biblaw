name: Validate Michaël book 17

on:
  push:
    branches: [main]
    paths:
      - "Bible essénienne (classée par livres).pdf"
      - "scripts/extract_book17.py"
      - "scripts/normalize_book17_dialogues.py"
      - "scripts/validate_book17.py"
      - "data/**"
      - ".github/workflows/validate-book17.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Re-extract book 17 from the source PDF
        run: python3 scripts/extract_book17.py

      - name: Normalize dialogue attribution
        run: python3 scripts/normalize_book17_dialogues.py

      - name: Apply automated validation
        run: python3 scripts/validate_book17.py --apply

      - name: Commit validated records
        run: |
          if git diff --quiet; then
            echo "No validation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Validate Michaël book 17 automatically"
          git push
