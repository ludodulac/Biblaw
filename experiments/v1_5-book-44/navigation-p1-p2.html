<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test P1 / P2 — Navigation C livre 44</title><style>
:root{font-family:system-ui,sans-serif;color:#202124;background:#f7f7f5}body{margin:0}main{max-width:980px;margin:auto;padding:28px 18px 70px}h1{margin:.2rem 0}.note{color:#5f6368}.tabs,.families{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{border:1px solid #bbb;background:white;padding:9px 12px;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#202124;color:white}.summary{padding:12px 14px;background:#fff;border:1px solid #ddd;border-radius:10px;margin:12px 0}.bucket{margin:28px 0}.bucket>h2{border-bottom:2px solid #333;padding-bottom:8px}.function{background:white;border:1px solid #ddd;border-radius:10px;margin:12px 0;padding:14px}.function h3{margin:0 0 5px}.subject{background:white;border:1px solid #ddd;border-radius:10px;margin:10px 0;padding:14px}.function .subject{border:0;border-top:1px solid #e5e5e5;border-radius:0;margin:0;padding:12px 0}.function .subject:first-of-type{border-top:0}.reason{font-size:.92rem;margin:5px 0 9px;padding:7px 9px;background:#f1f1ef;border-radius:6px}.meta{font-size:.9rem;color:#666}.evidence{margin:8px 0;padding-left:12px;border-left:3px solid #bbb}.error{background:#fff0f0;border:1px solid #c66;padding:12px;border-radius:8px}code{font-size:.9em}
</style></head><body><main><h1>Test P1 / P2 — Navigation C, livre 44</h1><p class="note">Même matière C, deux rendus. P2 utilise uniquement les appréciations de l’audit de granularité comme configuration de présentation.</p><div class="families" id="families"></div><div class="tabs"><button id="p1" aria-pressed="true">P1 · fonction intertitre</button><button id="p2" aria-pressed="false">P2 · adaptatif</button></div><div id="status" class="summary">Chargement…</div><section id="output"></section></main><script>
const FAMILIES=['argent','œuvre','vie intérieure','vertus','responsabilité','terre'];
const j=async p=>{const r=await fetch(p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let consolidation,relations,granularity,primary=[],family='argent',presentation='P1';
function subjectMap(){return new Map(primary.flatMap(d=>d.subjects.map(s=>[[d.source.recordId,s.localId].join('|'),{...s,recordId:d.source.recordId,psalmNumber:d.source.psalmNumber,sourcePath:`data/documentary-extractions/psalms/book-44/psalm-${d.source.psalmNumber}.json`}])))}
function rows(){const rel=new Map(relations.assignments.map(a=>[[a.family,a.recordId,a.localId].join('|'),a.relationNature]));const by=subjectMap();const f=consolidation.families.find(x=>x.entry===family);return f.functions.flatMap(fn=>fn.members.map(m=>({family,functionLabel:fn.label,rationale:fn.rationale,nature:rel.get([family,m.recordId,m.localId].join('|')),subject:by.get([m.recordId,m.localId].join('|'))}))) }
function decision(nature,label){const o=(granularity.priorityObservations||[]).find(x=>x.family===family&&x.relationNature===nature&&x.function===label);if(o?.observation==='explanation-may-suffice')return 'ATTACHED';if(o)return 'INTERTITLE';// Conservative counterexample/default: no audit decision means P2 does not demote the function.
return 'INTERTITLE'}
function subjectHTML(r,attached=false){const s=r.subject;return `<div class="subject">${attached?`<div class="reason"><strong>Raison documentaire :</strong> ${esc(r.functionLabel)} — ${esc(r.rationale)}</div>`:''}<strong>Psaume ${s.psalmNumber} · ${esc(s.localId)}</strong><div>${esc(s.localSubject)}</div><div class="meta">Versets : ${esc((s.verseNumbers||[]).join(', '))} · provenance : <code>${esc(s.sourcePath)}</code></div>${(s.evidence||[]).map(e=>`<div class="evidence"><span class="meta">v. ${esc((e.verseNumbers||[]).join(', '))}</span> — ${esc(e.quote)}</div>`).join('')}${s.documentaryNote?`<details><summary>Note documentaire</summary>${esc(s.documentaryNote)}</details>`:''}</div>`}
function renderBucket(nature,bucket){let html=`<div class="bucket"><h2>${nature==='DIRECT'?'Matières DIRECTES':'Relations FONCTIONNELLES'} <small>(${bucket.length})</small></h2>`;for(const label of [...new Set(bucket.map(r=>r.functionLabel))]){const items=bucket.filter(r=>r.functionLabel===label);const d=presentation==='P1'?'INTERTITLE':decision(nature,label);if(d==='INTERTITLE')html+=`<div class="function"><h3>${esc(label)}</h3><p class="note">${esc(items[0].rationale)}</p>${items.map(r=>subjectHTML(r,false)).join('')}</div>`;else html+=items.map(r=>subjectHTML(r,true)).join('')}return html+'</div>'}
function render(){document.querySelectorAll('.families button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===family)));document.querySelector('#p1').setAttribute('aria-pressed',String(presentation==='P1'));document.querySelector('#p2').setAttribute('aria-pressed',String(presentation==='P2'));const rs=rows(),d=rs.filter(x=>x.nature==='DIRECT'),f=rs.filter(x=>x.nature==='FONCTIONNEL');const p2head=[...new Set(rs.filter(r=>decision(r.nature,r.functionLabel)==='INTERTITLE').map(r=>r.nature+'|'+r.functionLabel))].length,p2attached=rs.filter(r=>decision(r.nature,r.functionLabel)==='ATTACHED').length;document.querySelector('#status').textContent=`${family} — ${rs.length} rattachement(s), ${d.length} DIRECT / ${f.length} FONCTIONNEL · P2: ${p2head} intertitre(s), ${p2attached} résultat(s) avec fonction attachée`;document.querySelector('#output').innerHTML=renderBucket('DIRECT',d)+renderBucket('FONCTIONNEL',f)}
async function init(){try{[consolidation,relations,granularity]=await Promise.all([j('consolidation-pilot.json'),j('relation-nature-audit.json'),j('function-granularity-audit.json')]);primary=await Promise.all(Array.from({length:26},(_,i)=>j(`../../data/documentary-extractions/psalms/book-44/psalm-${260+i}.json`)));if(consolidation.families.length!==6||relations.assignments.length!==65||relations.assignments.filter(x=>x.relationNature==='DIRECT').length!==46||relations.assignments.filter(x=>x.relationNature==='FONCTIONNEL').length!==19)throw Error('Contrôle 6 familles / 65 / 46 / 19 échoué');document.querySelector('#families').innerHTML=FAMILIES.map(f=>`<button data-f="${esc(f)}">${esc(f)}</button>`).join('');document.querySelectorAll('.families button').forEach(b=>b.onclick=()=>{family=b.dataset.f;render()});document.querySelector('#p1').onclick=()=>{presentation='P1';render()};document.querySelector('#p2').onclick=()=>{presentation='P2';render()};render()}catch(e){document.querySelector('#status').className='error';document.querySelector('#status').textContent=e.message}}
init();
</script></body></html>
