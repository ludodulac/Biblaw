name: Refresh public theme directory

on:
  push:
    paths:
      - '.github/workflows/refresh-public-theme-directory.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild and audit compact public directory
        run: |
          python scripts/build_public_theme_directory.py
          python scripts/audit_public_theme_directory.py
      - name: Commit compact directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index/theme-directory-public.json
          if git diff --cached --quiet; then echo 'Public directory already fresh'; exit 0; fi
          git commit -m 'Refresh compact public theme directory'
          git pull --rebase origin main
          git push origin HEAD:main
