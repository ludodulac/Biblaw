name: Validate thematic search UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'js/biblaw.js'
      - 'css/biblaw.css'
      - 'data/browser-search-catalog.json'
      - 'data/thematic-index/theme-directory.json'
      - 'data/thematic-index/theme-search-runtime.json'
      - 'scripts/audit_production_search_queries.py'
      - '.github/workflows/validate-search-ui.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: node --check js/biblaw.js
      - name: Check search UI DOM, bundle and contextual result contract
        run: |
          python - <<'PY'
          import json, unicodedata, re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('js/biblaw.js').read_text(encoding='utf-8')
          css=Path('css/biblaw.css').read_text(encoding='utf-8')
          required=('query','searchButton','archangelFilter','ambiguityPanel','suggestionKicker','suggestionTitle','senseChoices','closeAmbiguity','results','resultCount','themeDirectory','indexPanel','recordDialog','dialogContent')
          missing=[item for item in required if f'id="{item}"' not in html]
          assert not missing, f'missing DOM ids: {missing}'
          assert 'id="bookFilter"' not in html
          assert 'bookFilter' not in js
          assert 'value="chouette"' not in html
          assert 'id="query" type="search" value=""' in html
          assert 'value="psalm" checked' in html
          for value in ('prayer','note','annex'):
              assert f'value="{value}" checked' not in html
          assert 'js/biblaw.js' in html
          assert "fetch('data/browser-search-catalog.json')" in js
          assert "catalog.records.map" not in js
          assert 'themesByRecord' in js
          assert 'function contextualVerses' in js
          assert 'Passage concerné' in js
          assert 'Thèmes également présents dans ce psaume' in js
          assert 'Thèmes présents dans ce psaume' in js
          assert 'dialog-themes' in js
          assert 'data-related-theme' in js
          assert 'classés Central, Important, puis Lié' in js
          assert '.theme-context' in css and '.related-themes' in css
          # The UI ordering contract is explicit and independent from numeric score implementation details.
          assert 'const importanceRank' in js
          assert "{ central: 0, important: 1, related: 2 }" in js
          assert 'importanceRank(a.importance)-importanceRank(b.importance)' in js
          assert 'importanceRank(x.thematic?.importance)-importanceRank(y.thematic?.importance)' in js
          assert 'betterImportance' in js and 'sameImportance' in js
          # Theme directory uses the generated schema, not removed legacy field names.
          assert 't.occurrenceCount' in js and 't.score' in js
          assert 't.psalmCount' not in js and 't.totalScore' not in js
          # Search highlighting stays presentational: it marks literal normalized query words only.
          assert 'function exactVerses' in js
          assert 'const highlighted' in js
          assert '<mark class="search-hit">' in js
          assert 'Passage${chosen.length>1' in js
          assert '.search-hit' in css
          # Text search is literal: phrases must be contiguous, word-bounded and based on displayed corpus text, not semantic IDs.
          assert 'const textFragments' in js
          assert 'const literalIncludes' in js
          assert 'const literalTextMatch' in js
          assert 'literalIncludes(v.text,query)' in js
          assert '...(r.conceptIds || [])' not in js
          assert 'terms.filter' not in js
          assert 'Recherche un mot ou une expression dans le texte du corpus.' in js
          # French leading articles are a query convenience only; canonical theme IDs are untouched.
          assert 'const stripLeadingArticle' in js
          assert 'const themeQueryForms' in js
          assert "['l','le','la','les','un','une','des']" in js
          assert 'for(const q of forms)' in js
          # A recognized theme must not hide literal corpus occurrences.
          assert 'function textualPsalmMatches' in js
          assert 'Deux lectures de cette recherche' in js
          assert 'data-show-text-search' in js
          assert "$('modeExact').click()" in js
          # Ambiguous aliases must remain explicit choices and identical labels must be distinguishable.
          assert "const ambiguous=resolvedThemes.length>1" in js
          assert 'const labelCounts=new Map()' in js
          assert 'const duplicateLabel=' in js
          assert 'theme.occurrenceCount||theme.occurrences?.length||0' in js
          assert 'thème ${theme.id}' in js
          assert "ambiguous?'Correspondances multiples':'Navigation transversale'" in js
          def norm(value):
              value=''.join(c for c in unicodedata.normalize('NFD', str(value or '')) if unicodedata.category(c)!='Mn').lower().replace('œ','oe').replace('æ','ae').replace('’',' ').replace("'",' ')
              return re.sub(r'\s+',' ',re.sub(r'[^a-z0-9\s-]',' ',value).replace('-',' ')).strip()
          def literal_contains(value, query):
              needle=norm(query)
              return bool(needle) and f' {needle} ' in f' {norm(value)} '
          def forms(value):
              q=norm(value)
              parts=q.split()
              stripped=' '.join(parts[1:]) if len(parts)>1 and parts[0] in {'l','le','la','les','un','une','des'} else q
              return list(dict.fromkeys(x for x in (q,stripped) if x))
          assert forms("l’assemblée") == ['l assemblee','assemblee']
          assert forms('assemblée') == ['assemblee']
          assert forms('la sainte assemblée') == ['la sainte assemblee','sainte assemblee']
          assert forms('sainte assemblée') == ['sainte assemblee']
          assert forms('assemblée')[-1] != forms('sainte assemblée')[-1], 'distinct themes must remain distinct'
          assert literal_contains('Alliance de lumière.', 'alliance de lumière')
          assert not literal_contains('Alliance dans la lumière.', 'alliance de lumière')
          assert literal_contains('Dieu', 'dieu')
          assert not literal_contains('dieux', 'dieu')
          bundle=json.loads(Path('data/browser-search-catalog.json').read_text(encoding='utf-8'))
          assert bundle['purpose']=='browser-search-corpus-bundle'
          assert bundle['recordCount']==len(bundle['records'])
          assert bundle['recordCount'] > 1000
          psalms=[r for r in bundle['records'] if r.get('recordType')=='psalm']
          assert len(psalms) >= 1150
          def psalm_fragments(r):
              return [str(r.get('title',''))]+[str(v.get('text','')) for v in r.get('verses',[])]
          def literal_psalm_match(r, query):
              return any(literal_contains(fragment, query) for fragment in psalm_fragments(r))
          counts={}
          audit_queries=('dieu','alliance','alliance de lumière','lumière','assemblée','l’assemblée','sainte assemblée','la sainte assemblée','argent','chouette','abeille','22 commandements')
          for query in audit_queries:
              count=sum(literal_psalm_match(r, query) for r in psalms)
              counts[query]=count
              print(f'Literal smoke query {query}: {count} psalms')
          for query in ('dieu','lumière','alliance'):
              assert counts[query] > 0, f'no literal results for {query}'
          assert counts['dieu'] > 1, 'Dieu should have multiple literal psalm occurrences; thematic UI must expose the textual route'
          print(f"Browser search bundle OK: {bundle['recordCount']} records, {len(psalms)} psalms")
          PY
      - name: Check thematic runtime contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          runtime=json.loads((root/'data/thematic-index/theme-search-runtime.json').read_text(encoding='utf-8'))
          directory=json.loads((root/'data/thematic-index/theme-directory.json').read_text(encoding='utf-8'))
          assert runtime['semanticMerging'] is False
          assert runtime['connectionMeaning']=='psalm-cooccurrence-only'
          assert runtime['themeCount']==directory['themeCount']
          canonical={t['id'] for t in directory['themes']}
          for theme in directory['themes']:
              assert isinstance(theme.get('occurrenceCount'), int) and theme['occurrenceCount'] == len(theme.get('occurrences', []))
              assert isinstance(theme.get('score'), int)
          for alias in runtime['aliases'].values(): assert set(alias['themeIds']) <= canonical
          ambiguous={key:alias for key,alias in runtime['aliases'].items() if alias.get('ambiguous')}
          assert len(ambiguous)==runtime['ambiguousAliasCount']
          assert all(len(alias.get('themeIds',[]))>1 for alias in ambiguous.values()), 'ambiguous aliases must expose every candidate id'
          assert all(set(alias['themeIds']) <= canonical for alias in ambiguous.values())
          assert 'alliance' in runtime['aliases'], 'expected thematic alias alliance'
          assert runtime['aliases']['alliance']['themeIds'], 'alliance alias has no theme'
          assert runtime['aliases']['alliance de lumiere']['ambiguous'] is True
          assert set(runtime['aliases']['alliance de lumiere']['themeIds'])=={'alliance','alliance-de-lumiere'}
          print(f"Search UI contract OK: {runtime['themeCount']} themes, {runtime['aliasCount']} aliases, {len(ambiguous)} ambiguous aliases preserved")
          PY
      - name: Audit production search queries
        run: python scripts/audit_production_search_queries.py
