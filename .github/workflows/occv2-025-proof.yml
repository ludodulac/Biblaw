name: OCCV2 025 finalize
on:
  push:
    branches: [audit/occv2-025-proof]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/occv2-025-per-sense-threshold-calibration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Generate twice
        run: |
          python scripts/calibrate_linguistic_sense_threshold_per_sense.py
          cp data/linguistic/audits/sense-threshold-per-sense-025.json /tmp/report.json
          python scripts/calibrate_linguistic_sense_threshold_per_sense.py
          cmp /tmp/report.json data/linguistic/audits/sense-threshold-per-sense-025.json
      - name: Commit exactly report into existing commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/linguistic/audits/sense-threshold-per-sense-025.json
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:feat/occv2-025-per-sense-threshold-calibration
