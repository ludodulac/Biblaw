<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livre 44 — ATTACHED-only / D1a+</title><style>:root{font-family:system-ui,sans-serif;color:#202124;background:#f7f7f5}main{max-width:1040px;margin:auto;padding:24px 16px 60px}.controls{position:sticky;top:0;background:#f7f7f5;padding:10px 0;z-index:2}.family{margin:28px 0}.nature{margin:18px 0}.card,.status{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0}.function,.rationale{background:#f1f1ef;padding:8px;border-radius:7px;margin:8px 0}.meta{font-size:.88rem;color:#666}.evidence{border-left:3px solid #bbb;padding-left:10px;margin:7px 0}.detail{margin-top:9px}.error{background:#fff0f0;padding:12px;border:1px solid #d88}button{padding:8px 12px;margin-right:8px}</style></head><body><main><h1>Livre 44 — confrontation ATTACHED-only / D1a+</h1><p>Mêmes 65 rattachements, même ordre, mêmes données. Seule la divulgation change.</p><div class="controls"><button data-mode="A">A — ATTACHED-only complet</button><button data-mode="B">B — D1a+ adaptatif</button><span id="modeLabel"></span></div><div id="status" class="status">Chargement…</div><div id="out"></div></main><script>
const j=async p=>{const r=await fetch(p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=(...x)=>x.join('|');let A,C,R,REF,P=[],mode='A';
function pm(){return new Map(P.flatMap(d=>d.subjects.map(s=>[key(d.source.recordId,s.localId),{...s,recordId:d.source.recordId,psalmNumber:d.source.psalmNumber,sourcePath:`data/documentary-extractions/psalms/book-44/psalm-${d.source.psalmNumber}.json`}])))}function fm(){const m=new Map();for(const f of C.families)for(const fn of f.functions)for(const x of fn.members)m.set(key(f.entry,x.recordId,x.localId),{label:fn.label,rationale:fn.rationale});return m}function rows(){return A.audits.map(x=>({family:x[0],recordId:x[1],localId:x[2],nature:x[3],function:x[4],verdict:x[5]}))}
function documentary(s,fn,showR){return `${showR?`<div class="rationale"><strong>Rationale :</strong> ${esc(fn.rationale)}</div>`:''}<div class="meta">Versets : ${esc((s.verseNumbers||[]).join(', '))} · provenance V1.5 : <code>${esc(s.sourcePath)}</code></div>${(s.evidence||[]).map(e=>`<div class="evidence">v. ${esc((e.verseNumbers||[]).join(', '))} — ${esc(e.quote)}</div>`).join('')}<div class="meta"><strong>Note documentaire :</strong> ${esc(s.documentaryNote)}</div>`}
function card(a,p,f){const s=p.get(key(a.recordId,a.localId)),fn=f.get(key(a.family,a.recordId,a.localId)),head=`<strong>Psaume ${s.psalmNumber} · ${esc(a.localId)}</strong><div>${esc(s.localSubject)}</div><div class="function"><strong>Fonction documentaire :</strong> ${esc(fn.label)}</div>`;if(mode==='A')return `<article class="card">${head}${documentary(s,fn,true)}</article>`;const need=a.verdict==='RATIONALE-NEEDED';return `<article class="card">${head}${need?`<div class="rationale"><strong>Rationale :</strong> ${esc(fn.rationale)}</div>`:''}<details class="detail"><summary>Détail documentaire</summary>${documentary(s,fn,!need)}</details></article>`}
function render(rs,p,f){let h='';for(const family of C.families.map(x=>x.entry)){h+=`<section class="family"><h2>${esc(family)}</h2>`;for(const nature of ['DIRECT','FONCTIONNEL']){h+=`<section class="nature"><h3>${nature}</h3>`;for(const a of rs.filter(x=>x.family===family&&x.nature===nature))h+=card(a,p,f);h+='</section>'}h+='</section>'}document.querySelector('#out').innerHTML=h;document.querySelector('#modeLabel').textContent=mode==='A'?'ATTACHED-only complet':'D1a+ adaptatif'}
async function init(){try{[A,C,R,REF]=await Promise.all([j('d1a-exhaustive-audit.json'),j('consolidation-pilot.json'),j('relation-nature-audit.json'),j('attached-only-exhaustive-audit.json')]);P=await Promise.all(Array.from({length:26},(_,i)=>j(`../../data/documentary-extractions/psalms/book-44/psalm-${260+i}.json`)));const p=pm(),f=fm(),rs=rows(),count=v=>rs.filter(x=>x.verdict===v).length;if(C.families.length!==6||rs.length!==65||rs.filter(x=>x.nature==='DIRECT').length!==46||rs.filter(x=>x.nature==='FONCTIONNEL').length!==19||count('COMPACT-SUFFICIENT')!==63||count('RATIONALE-NEEDED')!==2||count('COMPACTION-FAIL')!==0)throw Error('Invariants 6/65/46/19/63/2/0 rompus');const rel=R.assignments.map(x=>key(x.family,x.recordId,x.localId)),got=rs.map(x=>key(x.family,x.recordId,x.localId)),ref=REF.audits.map(x=>key(x[0],x[1],x[2]));if(rel.length!==65||rel.some(k=>!new Set(got).has(k)))throw Error('Ensemble différent de relation-nature-audit');if(ref.join('\n')!==got.join('\n'))throw Error('Ordre différent de ATTACHED-only');for(const x of rs){const s=p.get(key(x.recordId,x.localId)),fn=f.get(key(x.family,x.recordId,x.localId));if(!s)throw Error(`Primaire absent: ${x.recordId}/${x.localId}`);if(!fn||fn.label!==x.function||!fn.rationale)throw Error(`Fonction/rationale C incohérente: ${x.family}/${x.recordId}/${x.localId}`)}const mult=new Map();for(const x of rs){const k=key(x.recordId,x.localId);mult.set(k,(mult.get(k)||0)+1)}if([...mult.values()].filter(n=>n>1).length!==13)throw Error('Invariant 13 multi-rattachés rompu');document.querySelector('#status').textContent='Contrôles OK — 6 familles · 65 rattachements · 46 DIRECT / 19 FONCTIONNEL · 63/2/0 · 13 multi-rattachés';document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render(rs,p,f)});render(rs,p,f)}catch(e){document.querySelector('#status').className='error';document.querySelector('#status').textContent=`ERREUR — ${e.message}`;document.querySelector('#out').innerHTML=''}}init();
</script></body></html>
