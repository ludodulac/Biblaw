name: Linguistic occurrence pilot
on:
  push:
    branches: [feat/linguistic-occurrences-002]
  pull_request:
    paths:
      - 'scripts/build_linguistic_occurrence_index.py'
      - 'scripts/audit_linguistic_occurrences.py'
      - 'data/linguistic/**'
jobs:
  porte-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build PORTE pilot slice
        run: python scripts/build_linguistic_occurrence_index.py --form porte --output data/linguistic/pilots/porte-occurrences.json
      - name: Audit occurrence identity, offsets and adjudication
        run: python scripts/audit_linguistic_occurrences.py
