<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livre 44 — ATTACHED-only</title><style>:root{font-family:system-ui,sans-serif;color:#202124;background:#f7f7f5}main{max-width:1040px;margin:auto;padding:24px 16px 60px}.family,.subject,.status{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}.subject{margin:9px 0}.attached{background:#f1f1ef;padding:9px;border-radius:7px;margin:8px 0}.meta{font-size:.88rem;color:#666}.evidence{border-left:3px solid #bbb;padding-left:10px;margin:7px 0}.error{background:#fff0f0;padding:12px}h2{margin-top:8px}h3{border-bottom:1px solid #ddd;padding-bottom:6px}</style></head><body><main><h1>Livre 44 — variante ATTACHED-only</h1><p>Navigation expérimentale : famille → DIRECT → sujets, puis famille → FONCTIONNEL → sujets. Aucune fonction n'est un étage; fonction et rationale restent attachées à chaque résultat.</p><div id="status" class="status">Chargement…</div><section id="out"></section></main><script>
const j=async p=>{const r=await fetch(p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let A,C,R,P=[];
const key=(...x)=>x.join('|');
function primaryMap(){return new Map(P.flatMap(d=>d.subjects.map(s=>[key(d.source.recordId,s.localId),{...s,recordId:d.source.recordId,psalmNumber:d.source.psalmNumber,sourcePath:`data/documentary-extractions/psalms/book-44/psalm-${d.source.psalmNumber}.json`}])))}
function functionMap(){const m=new Map();for(const f of C.families)for(const fn of f.functions)for(const x of fn.members)m.set(key(f.entry,x.recordId,x.localId),{label:fn.label,rationale:fn.rationale});return m}
function card(a,pm,fm){const [family,recordId,localId,nature,fnLabel,verdict,difficulty]=a,s=pm.get(key(recordId,localId)),fn=fm.get(key(family,recordId,localId));return `<article class="subject"><strong>Psaume ${s.psalmNumber} · ${esc(localId)}</strong><div>${esc(s.localSubject)}</div><div class="attached"><strong>Fonction documentaire :</strong> ${esc(fn.label)}<br><strong>Rationale :</strong> ${esc(fn.rationale)}</div><div class="meta">Nature : ${esc(nature)} · audit : ${esc(verdict)} · difficulté : ${esc(difficulty)}<br>Versets : ${esc((s.verseNumbers||[]).join(', '))} · provenance V1.5 : <code>${esc(s.sourcePath)}</code></div>${(s.evidence||[]).map(e=>`<div class="evidence">v. ${esc((e.verseNumbers||[]).join(', '))} — ${esc(e.quote)}</div>`).join('')}<div class="meta"><strong>Note documentaire :</strong> ${esc(s.documentaryNote)}</div></article>`}
function render(){const pm=primaryMap(),fm=functionMap();let h='';for(const family of A.scope.families){h+=`<section class="family"><h2>${esc(family)}</h2>`;for(const nature of ['DIRECT','FONCTIONNEL']){const rows=A.audits.filter(a=>a[0]===family&&a[3]===nature);h+=`<h3>${nature} — ${rows.length}</h3>${rows.map(a=>card(a,pm,fm)).join('')}`}h+='</section>'}document.querySelector('#out').innerHTML=h}
async function init(){try{[A,C,R]=await Promise.all([j('attached-only-exhaustive-audit.json'),j('consolidation-pilot.json'),j('relation-nature-audit.json')]);P=await Promise.all(Array.from({length:26},(_,i)=>j(`../../data/documentary-extractions/psalms/book-44/psalm-${260+i}.json`)));const pm=primaryMap(),fm=functionMap(),rel=new Map(R.assignments.map(x=>[key(x.family,x.recordId,x.localId),x.relationNature]));if(A.audits.length!==65||C.families.length!==6||R.assignments.length!==65)throw Error('Invariant cardinalité échoué');if(A.audits.filter(a=>a[3]==='DIRECT').length!==46||A.audits.filter(a=>a[3]==='FONCTIONNEL').length!==19)throw Error('Invariant nature échoué');const auditSet=new Set(A.audits.map(a=>key(a[0],a[1],a[2]))),relSet=new Set(R.assignments.map(x=>key(x.family,x.recordId,x.localId)));if(auditSet.size!==65||relSet.size!==65||[...auditSet].some(x=>!relSet.has(x))||[...relSet].some(x=>!auditSet.has(x)))throw Error('Ensemble des rattachements incohérent');for(const a of A.audits){const [family,recordId,localId,nature,fnLabel]=a,fn=fm.get(key(family,recordId,localId));if(!pm.has(key(recordId,localId)))throw Error(`Sujet primaire absent: ${recordId}/${localId}`);if(!fn||fn.label!==fnLabel||!fn.rationale)throw Error(`Fonction/rationale absente: ${family}/${recordId}/${localId}`);if(rel.get(key(family,recordId,localId))!==nature)throw Error(`Nature incohérente: ${family}/${recordId}/${localId}`)}document.querySelector('#status').textContent=`Contrôles structurels satisfaits : 6 familles · 65 rattachements · 46 DIRECT · 19 FONCTIONNEL · aucun intertitre fonctionnel · ${A.counts['DOCUMENTARY-AMBIGUITY']} ambiguïté documentaire.`;render()}catch(e){document.querySelector('#status').className='error';document.querySelector('#status').textContent=e.message}}init();
</script></body></html>
