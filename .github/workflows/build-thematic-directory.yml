name: Build thematic directory

on:
  workflow_dispatch:

# Normal book updates rebuild the directory inside validate-thematic-index.yml.
# This workflow remains available only for an explicit manual rebuild, avoiding
# two concurrent jobs writing the same generated file.
permissions:
  contents: write

concurrency:
  group: thematic-index-generated-files
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build thematic directory
        run: python scripts/build_thematic_directory.py
      - name: Commit thematic directory
        run: |
          if [ -z "$(git status --porcelain -- data/thematic-index/theme-directory.json)" ]; then
            echo 'No thematic directory changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index/theme-directory.json
          git commit -m 'Build thematic directory'
          git pull --rebase origin main
          git push origin HEAD:main
