name: Linguistic adversarial audit 010
on:
  push:
    branches: [audit/linguistic-occurrences-010]
  pull_request:
    paths: ['scripts/**','docs/**']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/audit_linguistic_010_evidence.py
      - run: python scripts/audit_linguistic_third_pilot_009.py
      - run: python scripts/audit_linguistic_foundation_004.py
      - run: python scripts/audit_linguistic_second_pilot_006.py
      - run: python scripts/audit_linguistic_inversion_008.py
