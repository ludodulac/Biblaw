name: Linguistic inversion correction 008
on:
  push:
    branches: [fix/linguistic-occurrences-008]
  pull_request:
    paths:
      - 'data/linguistic/**'
      - 'scripts/**linguistic**'
      - 'scripts/audit_corpus_inversions_008.py'
jobs:
  inversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Corpus inversion inventory
        run: python scripts/audit_corpus_inversions_008.py
      - name: Occurrence tests
        run: python scripts/test_linguistic_occurrence_index.py
      - name: PORTE occurrence regression
        run: python scripts/audit_linguistic_occurrences.py
      - name: PORTE foundation regression
        run: python scripts/audit_linguistic_foundation_004.py
      - name: SUIS pilot regression
        run: python scripts/audit_linguistic_second_pilot_006.py
