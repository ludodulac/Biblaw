name: Rafraîchissement temporaire couverture conceptuelle

on:
  push:
    branches:
      - normalize-ange-to-anges

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[generated-conceptual-coverage]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruire les rapports dérivés avec leurs générateurs officiels
        run: |
          python scripts/audit_thematic_search_quality.py
          python scripts/audit_conceptual_coverage.py
          python scripts/audit_conceptual_adjudications.py
      - name: Committer seulement les rapports générés
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index/theme-quality-audit.json data/thematic-index/conceptual-coverage-audit.json
          git diff --cached --quiet && { echo 'No derived report changes'; exit 1; }
          git commit -m 'Rafraîchir les rapports de couverture après normalisation [generated-conceptual-coverage]'
          git push origin HEAD:normalize-ange-to-anges
