<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navigation C — V1.5 livre 44</title><style>
:root{font-family:system-ui,sans-serif;color:#202124;background:#f7f7f5}body{margin:0}main{max-width:980px;margin:auto;padding:28px 18px 70px}h1{margin:.2rem 0}.note{color:#5f6368}.tabs,.families{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{border:1px solid #bbb;background:white;padding:9px 12px;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#202124;color:white}.summary{padding:12px 14px;background:#fff;border:1px solid #ddd;border-radius:10px;margin:12px 0}.bucket{margin:28px 0}.bucket>h2{border-bottom:2px solid #333;padding-bottom:8px}.function{background:white;border:1px solid #ddd;border-radius:10px;margin:12px 0;padding:14px}.function h3{margin:0 0 5px}.subject{border-top:1px solid #e5e5e5;padding:12px 0}.subject:first-of-type{border-top:0}.meta{font-size:.9rem;color:#666}.evidence{margin:8px 0;padding-left:12px;border-left:3px solid #bbb}.compare{display:grid;grid-template-columns:1fr;gap:12px}.representation{background:white;border:1px solid #ddd;border-radius:10px;padding:14px}.representation details{margin:8px 0}.error{background:#fff0f0;border:1px solid #c66;padding:12px;border-radius:8px}code{font-size:.9em}@media(min-width:850px){.compare{grid-template-columns:1fr 1fr 1fr}}
</style></head><body><main><h1>Navigation C — livre 44</h1><p class="note">Surface locale expérimentale. Aucune donnée documentaire n’est modifiée. Les sujets sont hydratés directement depuis V1.5.</p><div class="families" id="families"></div><div class="tabs"><button id="nav" aria-pressed="true">Navigation C</button><button id="abc" aria-pressed="false">Comparer A / B / C</button></div><div id="status" class="summary">Chargement…</div><section id="output"></section></main><script>
const FAMILIES=['argent','œuvre','vie intérieure','vertus','responsabilité','terre'];
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replaceAll('œ','oe').match(/[a-z0-9]+/g)?.join(' ')||'';
const j=async p=>{const r=await fetch(p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()};
let consolidation,audit,thematic,primary=[],family='argent',mode='nav';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function subjectMap(){return new Map(primary.flatMap(d=>d.subjects.map(s=>[[d.source.recordId,s.localId].join('|'),{...s,recordId:d.source.recordId,psalmNumber:d.source.psalmNumber,sourcePath:`data/documentary-extractions/psalms/book-44/psalm-${d.source.psalmNumber}.json`}])))}
function rows(){const rel=new Map(audit.assignments.map(a=>[[a.family,a.recordId,a.localId].join('|'),a.relationNature]));const by=subjectMap();const f=consolidation.families.find(x=>x.entry===family);return f.functions.flatMap(fn=>fn.members.map(m=>({family,functionLabel:fn.label,rationale:fn.rationale,nature:rel.get([family,m.recordId,m.localId].join('|')),subject:by.get([m.recordId,m.localId].join('|'))}))) }
function subjectHTML(r){const s=r.subject;return `<div class="subject"><strong>Psaume ${s.psalmNumber} · ${esc(s.localId)}</strong><div>${esc(s.localSubject)}</div><div class="meta">Versets : ${esc((s.verseNumbers||[]).join(', '))} · provenance : <code>${esc(s.sourcePath)}</code></div>${(s.evidence||[]).map(e=>`<div class="evidence"><span class="meta">v. ${esc((e.verseNumbers||[]).join(', '))}</span> — ${esc(e.quote)}</div>`).join('')}${s.documentaryNote?`<details><summary>Note documentaire</summary>${esc(s.documentaryNote)}</details>`:''}</div>`}
function renderC(){const rs=rows();const groups=['DIRECT','FONCTIONNEL','RESIDUEL'];let html='';for(const nature of groups){const bucket=rs.filter(r=>r.nature===nature);if(!bucket.length)continue;html+=`<div class="bucket"><h2>${nature==='DIRECT'?'Matières DIRECTES':nature==='FONCTIONNEL'?'Relations FONCTIONNELLES':'Cas RÉSIDUELS'} <small>(${bucket.length})</small></h2>`;for(const label of [...new Set(bucket.map(r=>r.functionLabel))]){const items=bucket.filter(r=>r.functionLabel===label);html+=`<div class="function"><h3>${esc(label)}</h3><p class="note">${esc(items[0].rationale)}</p>${items.map(subjectHTML).join('')}</div>`}html+='</div>'}return html}
function searchB(){const q=norm(family),hits=[];for(const d of primary)for(const s of d.subjects){const ev=(s.evidence||[]).map(x=>x.quote).join(' ');const fields=[s.localSubject,s.documentaryNote,ev].map(norm);if(fields.some(x=>x.includes(q)))hits.push({psalm:d.source.psalmNumber,subject:s.localSubject})}return hits}
function searchA(){const q=norm(family),hits=[];for(const p of thematic.psalmAnalyses||[])for(const t of p.themes||[]){if(norm([t.themeId,t.label,t.teaching].join(' ')).includes(q))hits.push({psalm:p.number,label:t.label,importance:t.importance,directness:t.directness})}return hits}
function renderABC(){const a=searchA(),b=searchB(),c=rows();const box=(title,items,render)=>`<div class="representation"><h2>${title}</h2><p class="meta">${items.length} résultat(s)</p>${items.map(render).join('')||'<p>Aucun résultat.</p>'}</div>`;return `<div class="compare">${box('A · index thématique',a,x=>`<details><summary>Psaume ${x.psalm} · ${esc(x.label)}</summary><span class="meta">${esc(x.importance||'')} ${esc(x.directness||'')}</span></details>`)}${box('B · lexical V1.5',b,x=>`<details><summary>Psaume ${x.psalm}</summary>${esc(x.subject)}</details>`)}${box('C · consolidation',c,x=>`<details><summary>${esc(x.nature)} · psaume ${x.subject.psalmNumber}</summary><strong>${esc(x.functionLabel)}</strong><br>${esc(x.subject.localSubject)}</details>`)}</div>`}
function render(){document.querySelectorAll('.families button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===family)));document.querySelector('#nav').setAttribute('aria-pressed',String(mode==='nav'));document.querySelector('#abc').setAttribute('aria-pressed',String(mode==='abc'));const rs=rows(),d=rs.filter(x=>x.nature==='DIRECT').length,f=rs.filter(x=>x.nature==='FONCTIONNEL').length;document.querySelector('#status').textContent=`${family} — ${rs.length} rattachement(s) : ${d} DIRECT, ${f} FONCTIONNEL`;document.querySelector('#output').innerHTML=mode==='nav'?renderC():renderABC()}
async function init(){try{[consolidation,audit,thematic]=await Promise.all([j('consolidation-pilot.json'),j('relation-nature-audit.json'),j('../../data/thematic-index/books/book-44.json')]);primary=await Promise.all(Array.from({length:26},(_,i)=>j(`../../data/documentary-extractions/psalms/book-44/psalm-${260+i}.json`)));const rel=audit.assignments;if(consolidation.families.length!==6||rel.length!==65||rel.filter(x=>x.relationNature==='DIRECT').length!==46||rel.filter(x=>x.relationNature==='FONCTIONNEL').length!==19)throw Error('Contrôle 6 familles / 65 / 46 / 19 échoué');document.querySelector('#families').innerHTML=FAMILIES.map(f=>`<button data-f="${esc(f)}">${esc(f)}</button>`).join('');document.querySelectorAll('.families button').forEach(b=>b.onclick=()=>{family=b.dataset.f;render()});document.querySelector('#nav').onclick=()=>{mode='nav';render()};document.querySelector('#abc').onclick=()=>{mode='abc';render()};render()}catch(e){document.querySelector('#status').className='error';document.querySelector('#status').textContent=e.message}}
init();
</script></body></html>
