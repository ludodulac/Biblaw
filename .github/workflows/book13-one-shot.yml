name: BIBLAW livre 13 - reconstruction ponctuelle
on:
  push:
    branches:
      - feat/book13-full-theme-coverage
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/book13-full-theme-coverage
          persist-credentials: true
      - name: Appliquer les 319 associations éditoriales du livre 13
        run: python scripts/apply_book13_editorial_coverage.py
      - name: Vérifier les versets et les 86 relations historiques
        run: python scripts/audit_book13_full_theme_coverage.py
      - name: Reconstruire les index thématiques publics
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Contrôler les livres 1 à 13
        run: |
          python scripts/audit_book01_first10_theme_coverage.py
          python scripts/audit_book01_psalms11_20_theme_coverage.py
          python scripts/audit_book01_end_book02_first10_theme_coverage.py
          python scripts/audit_book02_psalms11_24_theme_coverage.py
          python scripts/audit_book03_full_theme_coverage.py
          python scripts/audit_book04_full_theme_coverage.py
          python scripts/audit_book05_full_theme_coverage.py
          python scripts/audit_book06_full_theme_coverage.py
          python scripts/audit_book07_full_theme_coverage.py
          python scripts/audit_book08_full_theme_coverage.py
          python scripts/audit_book09_full_theme_coverage.py
          python scripts/audit_book10_full_theme_coverage.py
          python scripts/audit_book11_full_theme_coverage.py
          python scripts/audit_book12_full_theme_coverage.py
          python scripts/audit_book13_full_theme_coverage.py
      - name: Nettoyer les outils éditoriaux temporaires
        run: |
          rm scripts/apply_book13_editorial_coverage.py
          rm scripts/book13-work/part*.json
          rmdir scripts/book13-work
          rm .github/workflows/book13-one-shot.yml
      - name: Enregistrer l'index du livre 13 reconstruit et testé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "BIBLAW: enrich book 13 and rebuild canonical thematic indexes"
          git push origin HEAD:feat/book13-full-theme-coverage
