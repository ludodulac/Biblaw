name: Generate corrected JUSTE 011
on:
  push:
    branches: [feat/linguistic-occurrences-011-consolidated]
    paths:
      - 'scripts/build_linguistic_adjudication.py'
      - 'data/linguistic/pilots/juste-config.json'
      - 'data/linguistic/gold/juste-gold.json'
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/linguistic-occurrences-011-consolidated}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/build_linguistic_adjudication.py --config data/linguistic/pilots/juste-config.json --write
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/linguistic/pilots/juste-occurrences.json data/linguistic/pilots/juste.json data/linguistic/pilots/juste-compounds.json
          git diff --cached --quiet || git commit -m "Regenerate JUSTE artifacts under 011 proof model"
          git push
