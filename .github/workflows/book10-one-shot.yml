name: BIBLAW livre 10 - reconstruction ponctuelle
on:
  push:
    branches:
      - feat/book10-full-theme-coverage
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/book10-full-theme-coverage
          persist-credentials: true
      - name: Appliquer les associations du livre 10
        run: python scripts/apply_book10_editorial_coverage.py
      - name: Vérifier la conservation des liens du livre 10
        run: python scripts/audit_book10_full_theme_coverage.py
      - name: Reconstruire les dérivés thématiques canoniques
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Vérifier les couvertures des livres 1 à 10
        run: |
          python scripts/audit_book01_first10_theme_coverage.py
          python scripts/audit_book01_psalms11_20_theme_coverage.py
          python scripts/audit_book01_end_book02_first10_theme_coverage.py
          python scripts/audit_book02_psalms11_24_theme_coverage.py
          python scripts/audit_book03_full_theme_coverage.py
          python scripts/audit_book04_full_theme_coverage.py
          python scripts/audit_book05_full_theme_coverage.py
          python scripts/audit_book06_full_theme_coverage.py
          python scripts/audit_book07_full_theme_coverage.py
          python scripts/audit_book08_full_theme_coverage.py
          python scripts/audit_book09_full_theme_coverage.py
          python scripts/audit_book10_full_theme_coverage.py
      - name: Supprimer la reconstruction ponctuelle et les fragments temporaires
        run: |
          rm scripts/apply_book10_editorial_coverage.py
          rm scripts/book10-work/part*.json
          rmdir scripts/book10-work
          rm .github/workflows/book10-one-shot.yml
      - name: Enregistrer le résultat contrôlé sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "BIBLAW: enrich book 10 and rebuild canonical thematic search indexes"
          git push origin HEAD:feat/book10-full-theme-coverage
