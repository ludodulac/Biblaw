name: Validate deep books 15 to 17

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/repair_known_pdf_psalm_anomalies.py'
      - 'scripts/deepen_books15_17_semantic_evidence.py'
      - 'scripts/finalize_books15_17_semantic.py'
      - '.github/workflows/validate-deep-books15-17.yml'

permissions:
  contents: write

concurrency:
  group: thematic-index-generated-files
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Restore audited Book 15 Psalm 75
        run: |
          python - <<'PY'
          import scripts.repair_known_pdf_psalm_anomalies as r
          case = next(c for c in r.CASES if c['book'] == 15 and c['psalm'] == 75)
          r.extract_case(case)
          PY
      - name: Refresh documentary validation for books 11 to 20
        run: python scripts/validate_books_11_20.py
      - name: Refresh PDF-derived thematic source packs
        run: python scripts/build_thematic_source_packs.py
      - name: Preserve complete Book 17 thematic coverage
        run: python scripts/complete_book17_thematic.py
      - name: Apply descriptive deep indexing to books 15 to 17
        run: python scripts/deepen_books15_17_semantic_evidence.py
      - name: Finalize books 15 to 17
        run: python scripts/finalize_books15_17_semantic.py
      - name: Gate thematic completion on documentary integrity
        run: python scripts/sync_thematic_documentary_status.py
      - name: Normalize thematic metadata
        run: python scripts/normalize_thematic_metadata.py
      - name: Build PDF-only book contexts
        run: python scripts/build_book_contexts.py
      - name: Validate thematic index
        run: python scripts/validate_thematic_index.py
      - name: Rebuild thematic directory
        run: python scripts/build_thematic_directory.py
      - name: Commit generated outputs
        run: |
          if [ -z "$(git status --porcelain -- data/corpus/books/book-15 data/notes/books/book-15 data/pilot/books-11-20-validation-report.json data/thematic-index/source-packs/book-15 data/thematic-index/books/book-15.json data/thematic-index/books/book-16.json data/thematic-index/books/book-17.json data/thematic-index/book-contexts.json data/thematic-index/theme-directory.json data/thematic-index/validation-report.json)" ]; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/corpus/books/book-15 data/notes/books/book-15 data/pilot/books-11-20-validation-report.json data/thematic-index/source-packs/book-15 data/thematic-index/books/book-15.json data/thematic-index/books/book-16.json data/thematic-index/books/book-17.json data/thematic-index/book-contexts.json data/thematic-index/theme-directory.json data/thematic-index/validation-report.json
          git commit -m 'Restore Psalm 75 and finalize deep books 15 to 17'
          git pull --rebase origin main
          git push origin HEAD:main
