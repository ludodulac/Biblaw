name: Browser smoke - lexical occurrence expansion

on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/biblaw.css'
      - 'js/biblaw.js'
      - 'js/theme-suggestion-engine.js'
      - 'data/browser-search-catalog.json'
      - 'data/lexical-expansion-runtime.json'
      - 'data/thematic-index/theme-directory-public.json'
      - 'data/thematic-index/theme-search-runtime.json'
      - 'scripts/build_pages_site.py'
      - 'scripts/smoke_occurrence_expansion_browser.mjs'
      - 'scripts/smoke_search_ui_052.mjs'
      - 'scripts/smoke_search_ui_053.mjs'
      - 'scripts/smoke_public_preview_054.mjs'
      - 'scripts/smoke_public_suggestions_053c.mjs'
      - 'scripts/smoke_search_ui_053d.mjs'
      - 'scripts/smoke_search_ui_053e.mjs'
      - 'scripts/smoke_occurrences_041c.mjs'
      - 'scripts/audit_lexical_expansion_041c.py'
      - 'scripts/audit_lexical_expansion_runtime.py'
      - '.github/workflows/browser-smoke-pr36.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate legacy and 041C lexical safety contracts
        run: python scripts/audit_lexical_expansion_runtime.py
      - name: Build exact public Pages payload without deploying it
        run: python scripts/build_pages_site.py
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify immutable public preview endpoints without deploying
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          PREVIEW="https://rawcdn.githack.com/ludodulac/Biblaw/${{ github.event.pull_request.head.sha }}"
          for resource in index.html js/biblaw.js css/biblaw.css data/browser-search-catalog.json; do
            status="$(curl -L --retry 2 --max-time 30 -s -o /dev/null -w '%{http_code}' "$PREVIEW/$resource" || true)"
            echo "PUBLIC_PREVIEW_HTTP $resource $status"
            if [ "$status" != "200" ]; then echo "::warning::Public CDN did not return HTTP 200 for $resource"; fi
          done
      - name: Tap the real public preview with mobile Chromium
        if: github.event_name == 'pull_request'
        env:
          BIBLAW_SMOKE_URL: https://rawcdn.githack.com/ludodulac/Biblaw/${{ github.event.pull_request.head.sha }}/index.html
        run: node scripts/smoke_public_preview_054.mjs
      - name: Diagnose 053C mobile typing on original reported public link
        if: github.event_name == 'pull_request'
        env:
          BIBLAW_SMOKE_URL: https://rawcdn.githack.com/ludodulac/Biblaw/0205b35b91960e89a81194251f770163e20cc5d4/index.html
        run: node scripts/smoke_public_suggestions_053c.mjs
      - name: Verify 053C six word inputs on fixed public mobile preview
        if: github.event_name == 'pull_request'
        env:
          BIBLAW_SMOKE_URL: https://rawcdn.githack.com/ludodulac/Biblaw/${{ github.event.pull_request.head.sha }}/index.html
          BIBLAW_REQUIRE_EARLY: '1'
        run: node scripts/smoke_public_suggestions_053c.mjs
      - name: Verify 053D prefix-only MOTS and unchanged THÈME on real mobile preview
        if: github.event_name == 'pull_request'
        env:
          BIBLAW_SMOKE_URL: https://rawcdn.githack.com/ludodulac/Biblaw/${{ github.event.pull_request.head.sha }}/index.html
        run: node scripts/smoke_search_ui_053d.mjs
      - name: Verify 053E automatic autonomous compounds on public mobile preview
        if: github.event_name == 'pull_request'
        env:
          BIBLAW_SMOKE_URL: https://rawcdn.githack.com/ludodulac/Biblaw/${{ github.event.pull_request.head.sha }}/index.html
        run: node scripts/smoke_search_ui_053e.mjs
      - name: Run Chromium smoke test against local Pages payload
        run: |
          python -m http.server 4173 --directory _site >/tmp/biblaw-smoke-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/smoke_occurrence_expansion_browser.mjs
          node scripts/smoke_search_ui_052.mjs
          node scripts/smoke_search_ui_053.mjs
          node scripts/smoke_occurrences_041c.mjs
      - name: Enregistrer les aperçus mobiles de la PR (sans déploiement)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biblaw-052-mobile-previews
          path: screenshots-052/*.png
          if-no-files-found: ignore