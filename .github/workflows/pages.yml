name: Publier Biblaw sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier l'orchestration des validations
        run: python scripts/audit_validation_orchestration.py
      - name: Vérifier le contrat de l'interface publique
        run: python scripts/audit_public_ui_contract.py
      - name: Vérifier la recherche documentaire à deux thèmes
        run: python scripts/audit_two_theme_search.py
      - name: Vérifier la projection thématique publique
        run: python scripts/audit_public_theme_directory.py
      - name: Vérifier l'index thématique public
        run: python scripts/audit_theme_directory_ui.py
      - name: Vérifier le runtime thématique public
        run: python scripts/validate_thematic_search_runtime.py
      - name: Vérifier les thèmes des dix premiers psaumes du livre 1
        run: python scripts/audit_book01_first10_theme_coverage.py
      - name: Vérifier les thèmes des psaumes 11 à 20 du livre 1
        run: python scripts/audit_book01_psalms11_20_theme_coverage.py
      - name: Vérifier les psaumes 21–22 du livre 1 et 1–10 du livre 2
        run: python scripts/audit_book01_end_book02_first10_theme_coverage.py
      - name: Vérifier les psaumes 11 à 24 du livre 2
        run: python scripts/audit_book02_psalms11_24_theme_coverage.py
      - name: Vérifier l'intégrité thématique des 23 psaumes du livre 3
        run: python scripts/audit_book03_full_theme_coverage.py
      - name: Vérifier l'intégrité thématique des 24 psaumes du livre 4
        run: python scripts/audit_book04_full_theme_coverage.py
      - name: Vérifier l'intégrité thématique des 25 psaumes du livre 5
        run: python scripts/audit_book05_full_theme_coverage.py
      - name: Vérifier l'intégrité thématique des 30 psaumes du livre 6
        run: python scripts/audit_book06_full_theme_coverage.py
      - name: Vérifier l'intégrité thématique des 25 psaumes du livre 7
        run: python scripts/audit_book07_full_theme_coverage.py
      - name: Vérifier l'intégrité thématique des 27 psaumes du livre 8
        run: python scripts/audit_book08_full_theme_coverage.py
      - name: Vérifier les 29 psaumes du livre 9 et leurs associations thématiques
        run: python scripts/audit_book09_full_theme_coverage.py
      - name: Vérifier les 27 psaumes du livre 10 et leurs associations thématiques
        run: python scripts/audit_book10_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 11 et leurs relations thématiques
        run: python scripts/audit_book11_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 12 et leurs associations thématiques
        run: python scripts/audit_book12_full_theme_coverage.py
      - name: Vérifier les 28 psaumes du livre 13 et leurs associations thématiques
        run: python scripts/audit_book13_full_theme_coverage.py
      - name: Vérifier les 29 psaumes du livre 14 et leurs associations thématiques
        run: python scripts/audit_book14_full_theme_coverage.py
      - name: Vérifier les 27 psaumes du livre 15 et leurs associations thématiques
        run: python scripts/audit_book15_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 16 et leurs associations thématiques
        run: python scripts/audit_book16_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 17 et leurs associations thématiques
        run: python scripts/audit_book17_full_theme_coverage.py
      - name: Vérifier les 27 psaumes du livre 18 et leurs associations thématiques
        run: python scripts/audit_book18_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 19 et leurs associations thématiques
        run: python scripts/audit_book19_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 20 et leurs associations thématiques
        run: python scripts/audit_book20_full_theme_coverage.py
      - name: Vérifier les 34 psaumes du livre 21 et leurs associations thématiques
        run: python scripts/audit_book21_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 22 et leurs associations thématiques
        run: python scripts/audit_book22_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 23 et leurs associations thématiques
        run: python scripts/audit_book23_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 24 et leurs associations thématiques
        run: python scripts/audit_book24_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 25 et leurs associations thématiques
        run: python scripts/audit_book25_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 26 et leurs associations thématiques
        run: python scripts/audit_book26_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 27 et leurs associations thématiques
        run: python scripts/audit_book27_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 28 et leurs associations thématiques
        run: python scripts/audit_book28_full_theme_coverage.py
      - name: Vérifier les 27 psaumes du livre 29 et leurs associations thématiques
        run: python scripts/audit_book29_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 30 et leurs associations thématiques
        run: python scripts/audit_book30_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 31 et leurs associations thématiques
        run: python scripts/audit_book31_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 32 et leurs associations thématiques
        run: python scripts/audit_book32_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 33 et leurs associations thématiques
        run: python scripts/audit_book33_full_theme_coverage.py
      - name: Vérifier les 28 psaumes du livre 34 et leurs associations thématiques
        run: python scripts/audit_book34_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 35 et leurs associations thématiques
        run: python scripts/audit_book35_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 36 et leurs associations thématiques
        run: python scripts/audit_book36_full_theme_coverage.py
      - name: Vérifier les 26 psaumes du livre 37 et leurs associations thématiques
        run: python scripts/audit_book37_full_theme_coverage.py
      - name: Vérifier l'intégrité documentaire publiée
        run: python scripts/audit_corpus_attachments.py
      - name: Vérifier l'expansion lexicale sûre
        run: python scripts/audit_lexical_expansion_runtime.py
      - name: Vérifier l'indépendance des identifiants historiques
        run: python scripts/audit_legacy_psalm_references.py
      - name: Vérifier les requêtes de production de référence
        run: python scripts/audit_production_search_queries.py
      - name: Vérifier la recherche documentaire par numéro
        run: python scripts/audit_psalm_number_search.py
      - name: Résumer les ambiguïtés thématiques explicites
        run: python scripts/report_explicit_theme_ambiguities.py
      - name: Vérifier export PDF et sélections de textes 077
        run: node scripts/smoke_pdf_077.mjs
      - name: Vérifier les véritables sujets des notes publiques 079
        run: python scripts/audit_note_subjects_079.py
      - name: Vérifier les saisies mobiles sans doublon 080
        run: node scripts/smoke_query_input_080.mjs
      - name: Vérifier le classement de deux mots exacts 081
        run: node scripts/smoke_dual_exact_081.mjs
      - name: Vérifier les suggestions publiques, accents et nombres 082
        run: node scripts/smoke_autocomplete_082.mjs
      - name: Vérifier les mots composés et le champ de recherche 083
        run: node scripts/smoke_compound_autocomplete_083.mjs
      - name: Vérifier le champ unique et le bouton plus 084
        run: node scripts/smoke_single_field_084.mjs
      - name: Vérifier les références des vingt-cinq réponses et la confidentialité 089
        run: python scripts/audit_faq_085.py
      - name: Tester les vingt-cinq questions, le retour et les PDF 089
        run: node scripts/smoke_faq_085.mjs
      - name: Vérifier les cinq nouvelles réponses et leurs psaumes 090
        run: python scripts/audit_faq_090.py
      - name: Tester les trente questions, les liens et les PDF 090
        run: node scripts/smoke_faq_090.mjs
      - name: Vérifier les neuf réponses, leurs psaumes et la confidentialité 091
        run: python scripts/audit_faq_091.py
      - name: Tester les trente-neuf questions, les retours et PDF 091
        run: node scripts/smoke_faq_091.mjs
      - name: Vérifier les dix réponses sur religions et science et les références 092
        run: python scripts/audit_faq_092.py
      - name: Tester les quarante-neuf questions, les trente citations et les PDF 092
        run: node scripts/smoke_faq_092.mjs
      - name: Vérifier les cinq réponses sur le sens personnel et leurs psaumes 093
        run: python scripts/audit_faq_093.py
      - name: Tester cinquante-quatre réponses, les quinze liens et les PDF 093
        run: node scripts/smoke_faq_093.mjs
      - name: Vérifier les six réponses sur le bonheur et leurs psaumes 094
        run: python scripts/audit_faq_094.py
      - name: Tester soixante réponses, dix-neuf références et PDF 094
        run: node scripts/smoke_faq_094.mjs
      - name: Vérifier les sept réponses sur la maîtrise intérieure et leurs psaumes 095
        run: python scripts/audit_faq_095.py
      - name: Tester soixante-sept réponses, vingt-cinq références et les PDF 095
        run: node scripts/smoke_faq_095.mjs
      - name: Vérifier les quatorze réponses sur l'harmonie et la conscience 096
        run: python scripts/audit_faq_096.py
      - name: Tester quatre-vingt-une réponses, cinquante-cinq références et les PDF 096
        run: node scripts/smoke_faq_096.mjs
      - name: Vérifier les vingt-et-une nouvelles réponses et leurs psaumes 097/098
        run: python scripts/audit_faq_097_098.py
      - name: Tester cent deux réponses, soixante-neuf liens et les PDF 097/098
        run: node scripts/smoke_faq_097_098.mjs
      - name: Construire la charge utile Pages minimale
        run: python scripts/build_pages_site.py
      - name: Vérifier les fichiers du nouveau site blanc et la confidentialité des notes
        run: |
          test -f _site/index.html
          test -f _site/css/biblaw-light.css
          test -f _site/css/theme-entry.css
          test -f _site/js/theme-entry.js
          test -f _site/js/theme-rubrics.js
          test -f _site/data/thematic-index/theme-rubrics-public.json
          test -f _site/data/note-themes-public-073.json
          test ! -e _site/data/notes
          test ! -e _site/data/note-themes-working-072B.json
          grep -q 'biblaw-light.css' _site/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('_site/data/note-themes-public-073.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['publicNoteCount']==11
          thematic_ids={n for theme in data['themes'] for n in theme['noteIds']}
          reference_ids={r['id'] for r in data.get('referenceNotes', [])}
          assert len(thematic_ids)==data['themedNoteCount']==10
          assert len(reference_ids)==1 and not (thematic_ids & reference_ids)
          assert len(thematic_ids | reference_ids)==data['publicNoteCount']==11
          print('PUBLICATION 079: 10 notes par sujets + 1 renvoi, aucune archive privée')
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
