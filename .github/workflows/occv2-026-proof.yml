name: OCCV2 026 finalize
on:
  push:
    branches: [audit/occv2-026-proof]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/occv2-026-sense-review-queue
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build audit JSON reproducibility
        run: |
          python scripts/build_linguistic_sense_review_queue.py
          cp data/linguistic/review/sense-review-queue-026.json /tmp/queue.json
          python scripts/audit_linguistic_sense_review_queue.py
          python -m json.tool data/linguistic/review/sense-review-queue-026.json >/dev/null
          python scripts/build_linguistic_sense_review_queue.py
          cmp /tmp/queue.json data/linguistic/review/sense-review-queue-026.json
      - name: Collapse to one commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_linguistic_sense_review_queue.py scripts/audit_linguistic_sense_review_queue.py data/linguistic/review/sense-review-queue-026.json
          git reset --soft 02fcfd05a9979cbed07016c9ca7add9d047c43d5
          git commit -m "BIBLAW-OCCV2-026 build semantic review queue"
          git push --force-with-lease origin HEAD:feat/occv2-026-sense-review-queue
