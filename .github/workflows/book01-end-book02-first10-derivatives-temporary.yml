name: Temporary Book 01 finish and Book 02 initial ten thematic rebuild

on:
  push:
    branches:
      - feat/book01-end-book02-first10-theme-coverage-2026-11-08
    paths:
      - .github/workflows/book01-end-book02-first10-derivatives-temporary.yml
      - data/thematic-index/books/book-01.json
      - data/thematic-index/books/book-02.json
      - scripts/audit_book01_end_book02_first10_theme_coverage.py

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild full deterministic thematic derivative chain
        run: python scripts/check_biblaw.py TARGETED --area thematic
      - name: Recompute independent conceptual coverage metrics
        run: python scripts/audit_conceptual_coverage.py
      - name: Validate earlier Psalm audits 1–20
        run: |
          python scripts/audit_book01_first10_theme_coverage.py
          python scripts/audit_book01_psalms11_20_theme_coverage.py
      - name: Validate Books 1–2 current 12-Psalm review
        run: python scripts/audit_book01_end_book02_first10_theme_coverage.py
      - name: Commit all generated thematic derivatives to review branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index data/browser-search-catalog.json
          if git diff --cached --quiet; then
            echo 'No derived changes remain'
            exit 0
          fi
          git commit -m 'Regenerate full thematic search after Book 01 finish and Book 02 start'
          git push origin HEAD:feat/book01-end-book02-first10-theme-coverage-2026-11-08
