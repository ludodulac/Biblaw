name: Book 8 one-time canonical derivative rebuild
on:
  push:
    branches:
      - feat/book08-full-theme-coverage
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Validate book 8 original and new relations
        run: python scripts/audit_book08_full_theme_coverage.py
      - name: Rebuild deterministic public thematic derivatives
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Rebuild conceptual coverage audit
        run: python scripts/audit_conceptual_coverage.py
      - name: Verify themed source audits books 1 through 8
        run: |
          python scripts/audit_book08_full_theme_coverage.py
          python scripts/audit_book07_full_theme_coverage.py
          python scripts/audit_book06_full_theme_coverage.py
          python scripts/audit_book05_full_theme_coverage.py
          python scripts/audit_book04_full_theme_coverage.py
          python scripts/audit_book03_full_theme_coverage.py
          python scripts/audit_book02_psalms11_24_theme_coverage.py
          python scripts/audit_book01_end_book02_first10_theme_coverage.py
      - name: Commit rebuilt indices and delete temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/book08-rebuild-once.yml
          git add -A data
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "build(book08): refresh public thematic derivatives and remove temporary workflow"
            git push origin HEAD:feat/book08-full-theme-coverage
          fi
