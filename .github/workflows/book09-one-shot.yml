name: BIBLAW livre 9 - reconstruction ponctuelle
on:
  push:
    branches:
      - feat/book09-full-theme-coverage
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/book09-full-theme-coverage
          persist-credentials: true
      - name: Appliquer les associations du livre 9
        run: python scripts/apply_book09_editorial_coverage.py
      - name: Vérifier les anciennes associations et les versets du livre 9
        run: python scripts/audit_book09_full_theme_coverage.py
      - name: Reconstruire les dérivés thématiques canoniques
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Vérifier la couverture des livres déjà publiés
        run: |
          python scripts/audit_book01_first10_theme_coverage.py
          python scripts/audit_book01_psalms11_20_theme_coverage.py
          python scripts/audit_book01_end_book02_first10_theme_coverage.py
          python scripts/audit_book02_psalms11_24_theme_coverage.py
          python scripts/audit_book03_full_theme_coverage.py
          python scripts/audit_book04_full_theme_coverage.py
          python scripts/audit_book05_full_theme_coverage.py
          python scripts/audit_book06_full_theme_coverage.py
          python scripts/audit_book07_full_theme_coverage.py
          python scripts/audit_book08_full_theme_coverage.py
          python scripts/audit_book09_full_theme_coverage.py
      - name: Préserver la seule vérification permanente et supprimer les outils temporaires
        run: |
          rm scripts/apply_book09_editorial_coverage.py
          rm .github/workflows/book09-one-shot.yml
      - name: Enregistrer le résultat vérifié sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "BIBLAW: enrich book 9 and rebuild canonical thematic search indexes"
          git push origin HEAD:feat/book09-full-theme-coverage
