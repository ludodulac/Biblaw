name: BIBLAW 064-02 targeted PDF note evidence
on:
  pull_request:
    paths:
      - 'scripts/prove_notes_064_02.py'
      - '.github/workflows/prove-notes-064-02.yml'
permissions:
  contents: read
jobs:
  targeted-pdf-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted PDF reader
        run: python -m pip install --quiet pymupdf==1.26.4
      - name: Capture evidence on eight relevant PDF pages only (no validation)
        run: python scripts/prove_notes_064_02.py
      - name: Preserve first five notes' evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biblaw-064-02-proof-A
          path: reports/notes-064-02-proof/A/
          if-no-files-found: error
      - name: Preserve second five notes' evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biblaw-064-02-proof-B
          path: reports/notes-064-02-proof/B/
          if-no-files-found: error
