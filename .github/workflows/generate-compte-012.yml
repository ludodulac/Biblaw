name: Generate COMPTE 012 artifacts
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/linguistic-occurrences-012-industrialization}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/build_linguistic_adjudication.py --config data/linguistic/pilots/compte-config.json --write
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/linguistic/pilots/compte-occurrences.json data/linguistic/pilots/compte.json data/linguistic/pilots/compte-compounds.json
          git diff --cached --quiet || git commit -m "Generate COMPTE raw config-only baseline"
          git push

