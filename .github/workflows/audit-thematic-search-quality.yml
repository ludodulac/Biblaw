name: Audit thematic search quality

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/thematic-index/books/**'
      - 'data/thematic-index/theme-directory.json'
      - 'scripts/audit_thematic_search_quality.py'
      - '.github/workflows/audit-thematic-search-quality.yml'

permissions:
  contents: write

concurrency:
  group: thematic-search-quality-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build current thematic directory
        run: python scripts/build_thematic_directory.py
      - name: Audit search quality without semantic mutations
        run: python scripts/audit_thematic_search_quality.py
      - name: Commit audit report
        run: |
          if [ -z "$(git status --porcelain -- data/thematic-index/theme-quality-audit.json)" ]; then
            echo 'No audit changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index/theme-quality-audit.json
          git commit -m 'Refresh thematic search quality audit'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
