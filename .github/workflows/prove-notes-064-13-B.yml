name: BIBLAW 064-13 B targeted PDF evidence
on:
  pull_request:
    paths:
      - 'scripts/prove_notes_064_13_B.py'
      - '.github/workflows/prove-notes-064-13-B.yml'
permissions:
  contents: read
jobs:
  proof-b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install --quiet pymupdf==1.26.4
      - name: Capture targeted original PDF pages (no verdict)
        run: python scripts/prove_notes_064_13_B.py
      - name: Preserve proof B images and coordinates
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biblaw-064-13-proof-B
          path: reports/notes-064-13-proof/B/
          if-no-files-found: error
