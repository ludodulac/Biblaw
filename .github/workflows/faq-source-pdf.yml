name: FAQ source PDF comparison

on:
  pull_request:
    paths:
      - 'scripts/audit_faq_pdf_source.py'
      - 'data/faq-*.json'
      - 'docs/FAQ-SOURCE-AUDIT-2026-11-06.md'
      - '.github/workflows/faq-source-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --quiet pymupdf
      - name: Compare sensitive Psalm verses with the original Bible PDF
        run: python scripts/audit_faq_pdf_source.py
      - name: Store PDF source comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faq-pdf-source-evidence
          path: docs/faq-pdf-source-evidence.json
          if-no-files-found: ignore
