name: BIBLAW 064-14 A targeted PDF evidence
on:
  pull_request:
    paths:
      - 'scripts/prove_notes_064_14_A.py'
      - '.github/workflows/prove-notes-064-14-A.yml'
permissions:
  contents: read
jobs:
  proof-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install --quiet pymupdf==1.26.4
      - name: Capture targeted original PDF pages (no verdict)
        run: python scripts/prove_notes_064_14_A.py
      - name: Preserve proof A images and coordinates
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biblaw-064-14-proof-A
          path: reports/notes-064-14-proof/A/
          if-no-files-found: error
