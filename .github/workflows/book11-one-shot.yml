name: BIBLAW livre 11 - reconstruction ponctuelle
on:
  push:
    branches:
      - feat/book11-full-theme-coverage
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/book11-full-theme-coverage
          persist-credentials: true
      - name: Appliquer les 322 nouvelles associations du livre 11
        run: python scripts/apply_book11_editorial_coverage.py
      - name: Vérifier les références aux versets et les 80 liens historiques
        run: python scripts/audit_book11_full_theme_coverage.py
      - name: Reconstruire les index thématiques officiels
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Vérifier les livres 1 à 11
        run: |
          python scripts/audit_book01_first10_theme_coverage.py
          python scripts/audit_book01_psalms11_20_theme_coverage.py
          python scripts/audit_book01_end_book02_first10_theme_coverage.py
          python scripts/audit_book02_psalms11_24_theme_coverage.py
          python scripts/audit_book03_full_theme_coverage.py
          python scripts/audit_book04_full_theme_coverage.py
          python scripts/audit_book05_full_theme_coverage.py
          python scripts/audit_book06_full_theme_coverage.py
          python scripts/audit_book07_full_theme_coverage.py
          python scripts/audit_book08_full_theme_coverage.py
          python scripts/audit_book09_full_theme_coverage.py
          python scripts/audit_book10_full_theme_coverage.py
          python scripts/audit_book11_full_theme_coverage.py
      - name: Retirer les scripts et fragments provisoires
        run: |
          rm scripts/apply_book11_editorial_coverage.py
          rm scripts/book11-work/part*.json
          rmdir scripts/book11-work
          rm .github/workflows/book11-one-shot.yml
      - name: Enregistrer la reconstruction testée dans la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "BIBLAW: enrich book 11 and rebuild canonical thematic indexes"
          git push origin HEAD:feat/book11-full-theme-coverage
