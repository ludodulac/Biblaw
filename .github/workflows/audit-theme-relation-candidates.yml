name: Audit theme relation candidates

on:
  push:
    branches:
      - work/theme-relation-candidates
    paths:
      - "scripts/report_theme_relation_candidates.py"
      - "scripts/report_theme_relation_candidate_risks.py"
      - "scripts/report_theme_relation_review_context.py"
      - "scripts/report_theme_relation_review_queue.py"
      - "scripts/report_theme_relation_general_evidence.py"
      - "scripts/report_theme_layer_coverage.py"
      - "scripts/report_theme_alias_collisions.py"
      - "scripts/audit_theme_relation_candidates.py"
      - "scripts/audit_theme_relation_candidate_risks.py"
      - "scripts/audit_theme_relation_risk_review_coverage.py"
      - "scripts/audit_theme_relation_review_queue.py"
      - "scripts/audit_theme_relation_review_pilot.py"
      - "scripts/audit_validated_theme_relations.py"
      - "data/thematic-index/theme-search-index.json"
      - "data/thematic-index/theme-quality-audit.json"
      - "data/thematic-index/themes/**"
      - "data/thematic-index/reviews/theme-relations-pilot.json"
      - "data/thematic-index/reviews/theme-relations-risk-review.json"
      - "data/thematic-index/theme-relations-validated.json"
      - "data/thematic-index/THEME-RELATIONS-CONTRACT.md"
      - ".github/workflows/audit-theme-relation-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run relation candidate sentinels
        run: python scripts/audit_theme_relation_candidates.py

      - name: Audit structural-risk review priority
        run: python scripts/audit_theme_relation_candidate_risks.py

      - name: Audit complete structural-risk review coverage
        run: python scripts/audit_theme_relation_risk_review_coverage.py

      - name: Audit evidence-readiness review queue
        run: python scripts/audit_theme_relation_review_queue.py

      - name: Audit editorial/search theme layer coverage
        run: python scripts/report_theme_layer_coverage.py

      - name: Audit semantic review pilot
        run: python scripts/audit_theme_relation_review_pilot.py

      - name: Audit canonical validated relation store
        run: python scripts/audit_validated_theme_relations.py

      - name: Report exact alias collisions
        run: python scripts/report_theme_alias_collisions.py

      - name: Report structural candidate risks
        run: python scripts/report_theme_relation_candidate_risks.py

      - name: Report next evidence-ready review candidates
        run: python scripts/report_theme_relation_review_queue.py

      - name: Report bounded semantic review evidence
        run: >-
          python scripts/report_theme_relation_review_context.py
          --theme union-pere-nature --theme union --theme pere --theme nature
          --theme alliance-de-lumiere --theme alliance --theme lumiere --theme nature-vivante
          --theme union-et-soutien-mutuel --theme soutien-mutuel
          --theme discernement-contre-imitation --theme discernement --theme imitation
          --theme concret-contre-abstraction --theme abstraction
          --theme dialogue-avec-la-nature --theme alliance-angelique --theme anges
          --theme present-pont-passe-futur --theme passe-present-futur --theme futur --theme present
          --theme relations-avec-les-regnes --theme regnes --theme relations
          --theme communication-avec-le-divin --theme communication
          --theme oeuvres-et-au-dela --theme oeuvres --theme reciprocite-avec-la-mere --theme mere
          --max-occurrences 3

      - name: Probe diverse evidence-ready relations
        run: >-
          python scripts/report_theme_relation_review_context.py
          --theme corps --theme corps-ame-esprit
          --theme terre --theme terre-eau-air-feu
          --theme lumiere --theme apparences-et-fausse-lumiere
          --theme dieux --theme idoles-et-faux-dieux
          --theme conscience --theme pratique-et-conscience
          --theme pensee --theme maitrise-pensee-parole
          --max-occurrences 3

      - name: Probe atomic component evidence
        run: >-
          python scripts/report_theme_relation_review_context.py
          --theme ame --theme esprit
          --theme eau --theme air --theme feu
          --theme pratique
          --theme parole --theme maitrise
          --max-occurrences 3

      - name: Build compact general review evidence
        run: python scripts/report_theme_relation_general_evidence.py > /tmp/general-review-evidence.json

      - name: Upload compact general review evidence
        uses: actions/upload-artifact@v4
        with:
          name: general-review-evidence
          path: /tmp/general-review-evidence.json
          retention-days: 1

      - name: Probe diverse candidate structures
        run: |
          python scripts/report_theme_relation_candidates.py --theme corps-ame-esprit --limit 10
          python scripts/report_theme_relation_candidates.py --theme terre-eau-air-feu --limit 10
          python scripts/report_theme_relation_candidates.py --theme pratique-et-conscience --limit 10
          python scripts/report_theme_relation_candidates.py --theme maitrise-pensee-parole --limit 10

      - name: Diagnose licorne theme candidate structure
        run: python scripts/report_theme_relation_candidates.py --theme union-pere-nature --limit 10
