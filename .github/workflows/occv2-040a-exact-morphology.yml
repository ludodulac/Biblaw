name: BIBLAW 040A exact morphology checks
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - 'js/biblaw.js'
      - 'index.html'
      - '.github/workflows/occv2-040a-exact-morphology.yml'
permissions:
  contents: read
jobs:
  checks:
    if: github.event.pull_request.number == 67
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JavaScript syntax
        run: node --check js/biblaw.js
      - name: Real canonical corpus exact token checks
        run: |
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts')
          from build_linguistic_occurrence_index import occurrences
          for form in ('maison','maisons','aimer','aime','bien','suis','garde','garder'):
              rows=occurrences(form)
              assert all(x['normalizedForm']==form for x in rows)
              assert len({x['occurrenceId'] for x in rows})==len(rows)
              print(form,len(rows),'canonical occurrence IDs verified')
          PY
      - name: Morphological runtime guard checks
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('data/lexical-expansion-runtime.json'))
          groups=r['g']
          assert all(len(g)>=2 and len(set(g))==len(g) for g in groups)
          for term in ('maison','maisons','aimer','suis','garde','garder','bien'):
              matches=[g for g in groups if term in g]
              assert len(matches)<=1
              print(term,'certified runtime group',matches[:1])
          PY
