name: Migrate public theme directory runtime

on:
  push:
    paths:
      - '.github/workflows/migrate-public-theme-directory.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Switch browser to compact thematic directory
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/biblaw.js')
          text = path.read_text(encoding='utf-8')
          old = "fetch('data/thematic-index/theme-directory.json')"
          new = "fetch('data/thematic-index/theme-directory-public.json')"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one canonical directory fetch, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check js/biblaw.js
      - name: Commit runtime switch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/biblaw.js
          git commit -m 'Load compact public theme directory'
          git pull --rebase origin main
          git push origin HEAD:main
