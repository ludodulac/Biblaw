name: Book 7 final one-time derivative rebuild
on:
  push:
    branches:
      - feat/book07-full-theme-coverage
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Validate complete verse-grounded book 7 index
        run: python scripts/audit_book07_full_theme_coverage.py
      - name: Rebuild canonical public thematic derivatives
        run: python scripts/rebuild_thematic_derivatives.py
      - name: Rebuild conceptual coverage audit
        run: python scripts/audit_conceptual_coverage.py
      - name: Validate books 1 through 7
        run: |
          python scripts/audit_book07_full_theme_coverage.py
          python scripts/audit_book06_full_theme_coverage.py
          python scripts/audit_book05_full_theme_coverage.py
          python scripts/audit_book04_full_theme_coverage.py
          python scripts/audit_book03_full_theme_coverage.py
          python scripts/audit_book02_psalms11_24_theme_coverage.py
          python scripts/audit_book01_end_book02_first10_theme_coverage.py
      - name: Commit regenerated data and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/book07-rebuild-final.yml
          git add -A data
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "build(book07): final public indexes for 440 additions; remove temporary workflow"
            git push origin HEAD:feat/book07-full-theme-coverage
          fi
