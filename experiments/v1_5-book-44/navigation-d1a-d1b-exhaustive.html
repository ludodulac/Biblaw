<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livre 44 — D1a/D1b exhaustif</title><style>:root{font-family:system-ui,sans-serif;color:#202124;background:#f7f7f5}main{max-width:1040px;margin:auto;padding:24px 16px 60px}.family,.card,.status{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{padding:8px 11px}.function,.rationale{background:#f1f1ef;padding:8px;border-radius:7px;margin:8px 0}.meta{font-size:.88rem;color:#666}.evidence{border-left:3px solid #bbb;padding-left:10px;margin:7px 0}.detail{margin-top:9px}.error{background:#fff0f0;padding:12px}h3{border-bottom:1px solid #ddd;padding-bottom:6px}</style></head><body><main><h1>Livre 44 — test exhaustif D1a / D1b</h1><p>Navigation expérimentale inchangée : famille → DIRECT → sujets, puis famille → FONCTIONNEL → sujets. Les fonctions restent attachées aux cartes et ne deviennent jamais des intertitres.</p><div class="controls"><button data-mode="D1a">D1a</button><button data-mode="D1b">D1b</button></div><div id="status" class="status">Chargement…</div><section id="out"></section></main><script>
const j=async p=>{const r=await fetch(p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=(...x)=>x.join('|');let A,C,R,P=[],mode='D1a';const rows=()=>A.audits.map(x=>x.slice(0,5));
function pm(){return new Map(P.flatMap(d=>d.subjects.map(s=>[key(d.source.recordId,s.localId),{...s,recordId:d.source.recordId,psalmNumber:d.source.psalmNumber,sourcePath:`data/documentary-extractions/psalms/book-44/psalm-${d.source.psalmNumber}.json`}])))}function fm(){const m=new Map();for(const f of C.families)for(const fn of f.functions)for(const x of fn.members)m.set(key(f.entry,x.recordId,x.localId),{label:fn.label,rationale:fn.rationale});return m}
function detail(s,fn,showRationale){return `${showRationale?`<div class="rationale"><strong>Rationale :</strong> ${esc(fn.rationale)}</div>`:''}<div class="meta">Versets : ${esc((s.verseNumbers||[]).join(', '))} · provenance V1.5 : <code>${esc(s.sourcePath)}</code></div>${(s.evidence||[]).map(e=>`<div class="evidence">v. ${esc((e.verseNumbers||[]).join(', '))} — ${esc(e.quote)}</div>`).join('')}<div class="meta"><strong>Note documentaire :</strong> ${esc(s.documentaryNote)}</div>`}
function card(a,p,f){const [family,recordId,localId,nature,fnLabel]=a,s=p.get(key(recordId,localId)),fn=f.get(key(family,recordId,localId)),rVisible=mode==='D1b';return `<article class="card"><strong>Psaume ${s.psalmNumber} · ${esc(localId)}</strong><div>${esc(s.localSubject)}</div><div class="function"><strong>Fonction documentaire :</strong> ${esc(fn.label)}</div>${rVisible?`<div class="rationale"><strong>Rationale :</strong> ${esc(fn.rationale)}</div>`:''}<details class="detail"><summary>Détail documentaire</summary>${detail(s,fn,!rVisible)}</details></article>`}
function render(){const p=pm(),f=fm(),all=rows();let h='';for(const family of A.scope.families){h+=`<section class="family"><h2>${esc(family)}</h2>`;for(const nature of ['DIRECT','FONCTIONNEL']){const rr=all.filter(a=>a[0]===family&&a[3]===nature);h+=`<h3>${nature} — ${rr.length}</h3>${rr.map(a=>card(a,p,f)).join('')}`}h+='</section>'}document.querySelector('#status').textContent=`${mode} · 6 familles · 65 rattachements · 46 DIRECT · 19 FONCTIONNEL · ordre ATTACHED-only invariant`;document.querySelector('#out').innerHTML=h}
async function init(){try{[A,C,R]=await Promise.all([j('d1a-exhaustive-audit.json'),j('consolidation-pilot.json'),j('relation-nature-audit.json')]);P=await Promise.all(Array.from({length:26},(_,i)=>j(`../../data/documentary-extractions/psalms/book-44/psalm-${260+i}.json`)));const all=rows(),p=pm(),f=fm(),rel=new Map(R.assignments.map(x=>[key(x.family,x.recordId,x.localId),x.relationNature]));if(all.length!==65||C.families.length!==6||R.assignments.length!==65)throw Error('Invariant cardinalité échoué');if(all.filter(a=>a[3]==='DIRECT').length!==46||all.filter(a=>a[3]==='FONCTIONNEL').length!==19)throw Error('Invariant nature échoué');const relSet=new Set(R.assignments.map(x=>key(x.family,x.recordId,x.localId))),srcSet=new Set(all.map(a=>key(a[0],a[1],a[2])));if(relSet.size!==65||srcSet.size!==65||[...relSet].some(x=>!srcSet.has(x)))throw Error('Ensemble des rattachements incohérent');for(const a of all){const [family,recordId,localId,nature,fnLabel]=a,fn=f.get(key(family,recordId,localId));if(!p.has(key(recordId,localId)))throw Error(`Sujet primaire absent: ${recordId}/${localId}`);if(!fn||fn.label!==fnLabel||!fn.rationale)throw Error(`Fonction/rationale absente: ${family}/${recordId}/${localId}`);if(rel.get(key(family,recordId,localId))!==nature)throw Error(`Nature incohérente: ${family}/${recordId}/${localId}`)}const multi=new Map();for(const a of all){const k=key(a[1],a[2]);multi.set(k,(multi.get(k)||0)+1)}if([...multi.values()].filter(n=>n>1).length!==13)throw Error('Invariant multi-rattachements échoué');document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});render()}catch(e){document.querySelector('#status').className='error';document.querySelector('#status').textContent=e.message}}init();
</script></body></html>
