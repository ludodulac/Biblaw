name: BIBLAW Livre 36 - reconstruction ephemere
on:
  push:
    branches:
      - feat/book36-ouriel-thematic-coverage-20261109
permissions:
  contents: write
jobs:
  rebuild:
    name: Regenerer et auditer les index du livre 36
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Installer l'extracteur PDF requis par le pipeline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Reconstruire les artefacts canoniques
        env:
          BIBLAW_STAGE_TIMEOUT_SECONDS: "900"
          BIBLAW_SLOW_STEP_SECONDS: "120"
        run: python scripts/run_canonical_thematic_pipeline.py
      - name: Auditer le livre 36 et la recherche
        run: |
          python scripts/audit_book36_full_theme_coverage.py
          python scripts/validate_thematic_index.py
          python scripts/validate_thematic_search_runtime.py
          python scripts/audit_conceptual_coverage.py
      - name: Sauvegarder la reconstruction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u data/thematic-index
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "BIBLAW book36: regenerate canonical thematic indexes after 169 enrichments"
            git push origin HEAD:feat/book36-ouriel-thematic-coverage-20261109
          fi
