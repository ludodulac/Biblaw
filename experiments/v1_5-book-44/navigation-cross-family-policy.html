<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Politique expérimentale INTERTITLE / ATTACHED — livre 44</title><style>:root{font-family:system-ui,sans-serif;color:#202124;background:#f7f7f5}main{max-width:980px;margin:auto;padding:28px 18px 70px}.families{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{border:1px solid #bbb;background:#fff;padding:9px 12px;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#202124;color:#fff}.summary,.function,.subject{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0}.bucket{margin:26px 0}.reason{font-size:.92rem;padding:7px 9px;background:#f1f1ef;border-radius:6px;margin:7px 0}.uncertain{border-left:5px solid #777}.meta{font-size:.9rem;color:#666}.evidence{margin:8px 0;padding-left:12px;border-left:3px solid #bbb}.error{background:#fff0f0;border:1px solid #c66;padding:12px;border-radius:8px}</style></head><body><main><h1>Contre-audit transversal — livre 44</h1><p>Surface strictement présentationnelle. Elle hydrate toujours les sujets depuis V1.5. INCERTAIN est rendu conservatoirement comme INTERTITLE et reste signalé.</p><div class="families" id="families"></div><div id="status" class="summary">Chargement…</div><section id="output"></section></main><script>
const FAMILIES=['argent','œuvre','vie intérieure','vertus','responsabilité','terre'];const j=async p=>{const r=await fetch(p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let C,R,G,RA,X,P=[],family='argent';
function pmap(){return new Map(P.flatMap(d=>d.subjects.map(s=>[[d.source.recordId,s.localId].join('|'),{...s,recordId:d.source.recordId,psalmNumber:d.source.psalmNumber,sourcePath:`data/documentary-extractions/psalms/book-44/psalm-${d.source.psalmNumber}.json`}])))}
function rows(){const rel=new Map(R.assignments.map(a=>[[a.family,a.recordId,a.localId].join('|'),a.relationNature])),by=pmap(),f=C.families.find(x=>x.entry===family);return f.functions.flatMap(fn=>fn.members.map(m=>({label:fn.label,rationale:fn.rationale,nature:rel.get([family,m.recordId,m.localId].join('|')),subject:by.get([m.recordId,m.localId].join('|'))})))}
function p2Decision(nature,label){const o=(G.priorityObservations||[]).find(x=>x.family===family&&x.relationNature===nature&&x.function===label);return o?.observation==='explanation-may-suffice'?'ATTACHED':'INTERTITLE'}
function auditDecision(nature,label){if(family==='responsabilité'&&nature==='DIRECT'){const d=RA.decisions.find(x=>x.function===label);return d?{decision:d.decision,reason:d.reason,source:'R3 responsabilité'}:{decision:'INTERTITLE',reason:'Décision R3 absente: repli conservateur.',source:'fallback'}}if(family==='responsabilité')return{decision:p2Decision(nature,label),reason:'Responsabilité FONCTIONNEL reste au comportement P2 antérieur; ce tour ne la réaudite pas.',source:'P2 antérieur'};const d=X.decisions.find(x=>x.family===family&&x.relationNature===nature&&x.function===label);if(!d)return{decision:'INTERTITLE',reason:'Décision de contre-audit absente: repli conservateur.',source:'fallback'};return{decision:d.decision,reason:d.reason,source:'contre-audit'}}
function effective(d){return d==='ATTACHED'?'ATTACHED':'INTERTITLE'}
function subj(r,attached,decision){const s=r.subject;return `<div class="subject ${decision==='INCERTAIN'?'uncertain':''}">${attached?`<div class="reason"><strong>Fonction / rationale :</strong> ${esc(r.label)} — ${esc(r.rationale)}${decision==='INCERTAIN'?'<br><strong>INCERTAIN — rendu conservatoirement comme intertitre dans la surface.</strong>':''}</div>`:''}<strong>Psaume ${s.psalmNumber} · ${esc(s.localId)}</strong><div>${esc(s.localSubject)}</div><div class="meta">Versets : ${esc((s.verseNumbers||[]).join(', '))} · provenance : <code>${esc(s.sourcePath)}</code></div>${(s.evidence||[]).map(e=>`<div class="evidence">v. ${esc((e.verseNumbers||[]).join(', '))} — ${esc(e.quote)}</div>`).join('')}${s.documentaryNote?`<details><summary>Note documentaire</summary>${esc(s.documentaryNote)}</details>`:''}</div>`}
function render(){document.querySelectorAll('.families button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===family)));const rs=rows();let headCount=0,attachedCount=0,uncertainCount=0,h='';for(const nature of ['DIRECT','FONCTIONNEL']){const bucket=rs.filter(x=>x.nature===nature);h+=`<div class="bucket"><h2>${nature} (${bucket.length})</h2>`;for(const label of [...new Set(bucket.map(x=>x.label))]){const items=bucket.filter(x=>x.label===label),a=auditDecision(nature,label),eff=effective(a.decision);if(a.decision==='INCERTAIN')uncertainCount++;if(eff==='INTERTITLE'){headCount++;h+=`<div class="function ${a.decision==='INCERTAIN'?'uncertain':''}"><h3>${esc(label)}${a.decision==='INCERTAIN'?' · INCERTAIN':''}</h3><p>${esc(items[0].rationale)}</p><div class="reason"><strong>Décision :</strong> ${esc(a.decision)} — ${esc(a.reason)}</div>${items.map(x=>subj(x,false,a.decision)).join('')}</div>`}else{attachedCount+=items.length;h+=items.map(x=>subj(x,true,a.decision)).join('')}}h+='</div>'}document.querySelector('#status').textContent=`${family} — ${rs.length} rattachement(s) · ${headCount} intertitre(s) traversé(s) · ${attachedCount} sujet(s) avec fonction attachée · ${uncertainCount} décision(s) INCERTAIN`;document.querySelector('#output').innerHTML=h}
async function init(){try{[C,R,G,RA,X]=await Promise.all([j('consolidation-pilot.json'),j('relation-nature-audit.json'),j('function-granularity-audit.json'),j('responsibility-direct-presentation-audit.json'),j('cross-family-presentation-counter-audit.json')]);P=await Promise.all(Array.from({length:26},(_,i)=>j(`../../data/documentary-extractions/psalms/book-44/psalm-${260+i}.json`)));const refs=new Set(P.flatMap(d=>d.subjects.map(s=>[d.source.recordId,s.localId].join('|')))),missing=R.assignments.filter(a=>!refs.has([a.recordId,a.localId].join('|')));if(C.families.length!==6||R.assignments.length!==65||R.assignments.filter(x=>x.relationNature==='DIRECT').length!==46||R.assignments.filter(x=>x.relationNature==='FONCTIONNEL').length!==19||missing.length||RA.decisions.length!==11||RA.counts.INTERTITLE!==3||RA.counts.ATTACHED!==8||X.counts.uniqueFunctionsAudited!==39||X.counts.presentationDecisionUnits!==41)throw Error('Invariant 6 familles / 65 / 46 / 19 / références / R3 / contre-audit échoué');for(const f of C.families)for(const fn of f.functions)for(const m of fn.members)if(!R.assignments.some(a=>a.family===f.entry&&a.recordId===m.recordId&&a.localId===m.localId))throw Error(`Nature manquante: ${f.entry}/${m.recordId}/${m.localId}`);document.querySelector('#families').innerHTML=FAMILIES.map(f=>`<button data-f="${esc(f)}">${esc(f)}</button>`).join('');document.querySelectorAll('.families button').forEach(b=>b.onclick=()=>{family=b.dataset.f;render()});render()}catch(e){document.querySelector('#status').className='error';document.querySelector('#status').textContent=e.message}}init();
</script></body></html>
