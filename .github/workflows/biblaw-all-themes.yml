name: Biblaw 106 - all Bible themes A-Z

on:
  push:
    branches: [feat/biblaw-all-themes-alphabetic-20261110]
  pull_request:
    paths:
      - 'index.html'
      - 'css/biblaw-light.css'
      - 'js/biblaw.js'
      - 'scripts/smoke_biblaw_all_themes_browser.mjs'
      - '.github/workflows/biblaw-all-themes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-themes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit the original 1,158 psalms and FAQ content
        run: |
          node --check js/biblaw.js
          node --check js/biblaw-faq.js
          python scripts/audit_public_ui_contract.py
          node scripts/check_faq_integrity.mjs
          node scripts/check_faq_101_topics.mjs
          node scripts/check_faq_dom.mjs
      - name: Stage public site locally (never deploy)
        run: python scripts/build_pages_site.py
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check alphabetical themes, ranking, reader and regression
        run: |
          python -m http.server 4173 --directory _site >/tmp/biblaw-106-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/smoke_biblaw_all_themes_browser.mjs
          node scripts/smoke_biblaw_m3_lazy_browser.mjs
          node scripts/smoke_faq_single_retour_browser.mjs
