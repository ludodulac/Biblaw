name: Validate thematic search UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'js/biblaw.js'
      - 'css/biblaw.css'
      - 'data/catalog.json'
      - 'data/corpus/**'
      - 'data/browser-search-catalog.json'
      - 'data/thematic-index/theme-directory.json'
      - 'data/thematic-index/theme-search-runtime.json'
      - 'data/thematic-index/theme-quality-audit.json'
      - 'scripts/build_browser_search_catalog.py'
      - 'scripts/audit_production_search_queries.py'
      - 'scripts/audit_psalm_number_search.py'
      - 'scripts/audit_browser_search_indexes.py'
      - 'scripts/check_biblaw.py'
      - 'scripts/rebuild_thematic_derivatives.py'
      - 'scripts/report_biblaw_diff.py'
      - '.github/workflows/validate-search-ui.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check fast-workflow helper syntax
        run: python -m py_compile scripts/check_biblaw.py scripts/rebuild_thematic_derivatives.py scripts/report_biblaw_diff.py
      - name: Check compact differential report on clean HEAD
        run: |
          python scripts/report_biblaw_diff.py --base HEAD | tee /tmp/biblaw-diff.txt
          grep -q 'SUMMARY significantChanges=no' /tmp/biblaw-diff.txt
      - name: Check browser search catalog freshness
        run: |
          cp data/browser-search-catalog.json /tmp/browser-search-catalog.before.json
          python scripts/build_browser_search_catalog.py
          cmp --silent /tmp/browser-search-catalog.before.json data/browser-search-catalog.json || {
            echo 'data/browser-search-catalog.json is stale relative to data/catalog.json and data/corpus'
            exit 1
          }
      - name: Check browser JavaScript syntax
        run: node --check js/biblaw.js
      - name: Check search UI DOM, bundle and contextual result contract
        run: |
          python - <<'PY'
          import json, unicodedata, re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('js/biblaw.js').read_text(encoding='utf-8')
          css=Path('css/biblaw.css').read_text(encoding='utf-8')
          required=('query','searchButton','archangelFilter','ambiguityPanel','suggestionKicker','suggestionTitle','senseChoices','closeAmbiguity','results','resultCount','themeDirectory','indexPanel','recordDialog','dialogContent')
          missing=[item for item in required if f'id="{item}"' not in html]
          assert not missing, f'missing DOM ids: {missing}'
          assert 'id="bookFilter"' not in html and 'bookFilter' not in js
          assert 'value="chouette"' not in html and 'id="query" type="search" value=""' in html
          assert 'numéro de psaume' in html.lower()
          assert 'value="psalm" checked' in html
          for value in ('prayer','note','annex'): assert f'value="{value}" checked' not in html
          for needle in ('themesByRecord','function contextualVerses','Passage concerné','Autres thèmes dans ce psaume','Thèmes présents dans ce psaume','dialog-themes','data-related-theme','classés Central, Important, puis Lié','const importanceRank','function exactVerses','const highlighted','const textFragments','const literalIncludes','const literalTextMatch','const stripLeadingArticle','const themeQueryForms','const activateThemeMode','function navigateToTheme(theme)','unresolvedTheme:true','Aucun thème indexé ne correspond à cette recherche','function textualPsalmMatches','Deux lectures de cette recherche','data-show-text-search','function resolveIndexedThemes(query)','if(resolvedThemes.length<=1){hideAmbiguity();return;}','alias?.themeIds?.length','const parsePsalmNumberQuery','function psalmNumberMatches(number)'):
              assert needle in js, needle
          assert '.theme-context' in css and '.compact-related' in css and '.search-hit' in css
          assert "{ central: 0, important: 1, related: 2 }" in js
          assert 'importanceRank(a.importance)-importanceRank(b.importance)' in js
          assert 'importanceRank(x.thematic?.importance)-importanceRank(y.thematic?.importance)' in js
          assert 'betterImportance' in js and 'sameImportance' in js
          assert 't.occurrenceCount' in js and 't.score' in js and 't.psalmCount' not in js and 't.totalScore' not in js
          assert 'literalIncludes(v.text,query)' in js and '...(r.conceptIds || [])' not in js and 'terms.filter' not in js
          assert "['l','le','la','les','un','une','des']" in js and 'for(const q of forms)' in js
          assert "const activateExactMode = () =>" in js and "$('modeExact').onclick=()=>{activateExactMode();search();}" in js
          assert 'theme.occurrenceCount||theme.occurrences?.length||0' in js and "theme.id?` · ${esc(theme.id)}`:''" in js
          assert "const theme=state.themeById.get(btn.dataset.themeId);if(!theme)return;$('query').value=theme.label;search();" in js
          assert "navigateToTheme(state.themeById.get(b.dataset.relatedTheme))" in js
          assert 'closeIndex();navigateToTheme(t)' in js
          def norm(value):
              value=''.join(c for c in unicodedata.normalize('NFD', str(value or '')) if unicodedata.category(c)!='Mn').lower().replace('œ','oe').replace('æ','ae').replace('’',' ').replace("'",' ')
              return re.sub(r'\s+',' ',re.sub(r'[^a-z0-9\s-]',' ',value).replace('-',' ')).strip()
          def literal_contains(value, query):
              needle=norm(query); return bool(needle) and f' {needle} ' in f' {norm(value)} '
          def forms(value):
              q=norm(value); parts=q.split(); stripped=' '.join(parts[1:]) if len(parts)>1 and parts[0] in {'l','le','la','les','un','une','des'} else q
              return list(dict.fromkeys(x for x in (q,stripped) if x))
          assert forms("l’assemblée") == ['l assemblee','assemblee']
          assert forms('la sainte assemblée') == ['la sainte assemblee','sainte assemblee']
          assert forms('assemblée')[-1] != forms('sainte assemblée')[-1]
          assert literal_contains('Alliance de lumière.', 'alliance de lumière') and not literal_contains('Alliance dans la lumière.', 'alliance de lumière')
          assert literal_contains('Dieu', 'dieu') and not literal_contains('dieux', 'dieu')
          bundle=json.loads(Path('data/browser-search-catalog.json').read_text(encoding='utf-8'))
          assert bundle['purpose']=='browser-search-corpus-bundle' and bundle['recordCount']==len(bundle['records'])
          psalms=[r for r in bundle['records'] if r.get('recordType')=='psalm']
          assert len(psalms)==1158
          PY
      - name: Check thematic theme suggestions
        run: |
          python - <<'PY'
          import json, re, unicodedata
          from pathlib import Path
          directory=json.loads(Path('data/thematic-index/theme-directory-public.json').read_text(encoding='utf-8'))
          runtime=json.loads(Path('data/thematic-index/theme-search-runtime.json').read_text(encoding='utf-8'))
          js=Path('js/biblaw.js').read_text(encoding='utf-8')
          themes=directory['themes']; by_id={t['id']:t for t in themes}
          def norm(value):
              value=''.join(c for c in unicodedata.normalize('NFD',str(value or '')) if unicodedata.category(c)!='Mn').lower().replace('œ','oe').replace('æ','ae').replace('’',' ').replace("'",' ')
              return re.sub(r'\\s+',' ',re.sub(r'[^a-z0-9\\s-]',' ',value).replace('-',' ')).strip()
          def resolve(query):
              q=norm(query); parts=q.split(); stripped=' '.join(parts[1:]) if len(parts)>1 and parts[0] in {'l','le','la','les','un','une','des'} else q; forms=list(dict.fromkeys(x for x in (q,stripped) if x))
              for form in forms:
                  entry=runtime.get('aliases',{}).get(form)
                  if entry and entry.get('themeIds'): return [by_id[x] for x in entry['themeIds'] if x in by_id]
              for form in forms:
                  exact=[t for t in themes if form in (norm(t['label']),norm(t['id']))]
                  if exact:return exact
              return []
          stop={'a','avons','avec','comment','dans','de','des','du','est','et','la','le','les','l','nous','ou','pour','pourquoi','sont','un','une'}
          equivalents={'4':{'4','quatre'},'quatre':{'quatre','4'},'magique':{'magique','magie'},'magiques':{'magiques','magie'},'mourir':{'mourir','mort'}}
          def notions(query):
              return [equivalents.get(term,{term}) for term in norm(query).split() if term and term not in stop]
          def suggest(query):
              query_notions=notions(query); exact={t['id'] for t in resolve(query)}; found={}
              def consider(theme,source,text):
                  words=set(norm(text).split())
                  matched=[index for index,variants in enumerate(query_notions) if any(term in words for term in variants)]
                  hits=len(matched)
                  if not hits:return
                  candidate=(1 if theme['id'] in exact else 0,hits,0 if source=='label' else 1,theme,matched)
                  current=found.get(theme['id'])
                  if current is None or candidate[:2]>current[:2] or candidate[:2]==current[:2] and candidate[2]<current[2]:found[theme['id']]=candidate
              for theme in themes:consider(theme,'label',theme['label'])
              for alias,entry in runtime.get('aliases',{}).items():
                  for theme_id in entry.get('themeIds',[]):
                      if theme_id in by_id:consider(by_id[theme_id],'alias',alias)
              ranked=sorted(found.values(),key=lambda x:(-x[0],-x[1],x[2],x[3]['label'],x[3]['id']))
              selected=[]; selected_ids=set()
              def add(item):
                  if item and item[3]['id'] not in selected_ids and len(selected)<8:selected.append(item);selected_ids.add(item[3]['id'])
              max_hits=ranked[0][1] if ranked else 0
              for item in ranked:
                  if item[1]==max_hits:add(item)
              for index in range(len(query_notions)):add(next((item for item in ranked if index in item[4]),None))
              for item in ranked:add(item)
              return [x[3] for x in selected]
          mort=suggest('mort')
          assert [t['label'] for t in mort]==['Mort','La mort ne résout pas le non-accompli','Préparer la mort en vivant','Vie après la mort comme continuité','Vie et mort']
          assert mort[0]['id']=='mort' and len({t['id'] for t in mort})==len(mort)
          assert not any(t['id']=='immortalite' for t in mort)
          vie_mort=suggest('vie mort')
          def matches_terms(theme,required):
              return required <= set(norm(theme['label']).split()) or any(theme['id'] in e.get('themeIds',[]) and required <= set(norm(a).split()) for a,e in runtime['aliases'].items())
          both=[t for t in vie_mort if matches_terms(t,{'vie','mort'})]
          assert both and vie_mort[:len(both)]==both and any(t['id']=='vie-et-mort' for t in vie_mort)
          ambiguous=next((a for a,e in runtime['aliases'].items() if e.get('ambiguous') and len(e.get('themeIds',[]))>1),None)
          assert ambiguous and len(resolve(ambiguous))>1
          single=next((t['label'] for t in themes if len(suggest(t['label']))==1),None)
          assert single and len(suggest(single))==1
          assert "if(state.mode==='themes')" in js and "const suggestions=suggestIndexedThemes(query);" in js
          assert "const exactItems=matches(query)" in js
          assert "btn.onclick=()=>navigateToTheme(state.themeById.get(btn.dataset.themeId))" in js
          assert "const themeQueryNotions = query =>" in js and "THEME_QUERY_STOP_WORDS" in js and "THEME_QUERY_EQUIVALENTS" in js
          natural_elements=[t['label'] for t in suggest('les 4 éléments magiques')]
          assert 'Quatre éléments' in natural_elements and 'Magie' in natural_elements, natural_elements
          natural_mort=[t['label'] for t in suggest('Pourquoi avons-nous peur de mourir ?')]
          assert 'Peur' in natural_mort and 'Mort' in natural_mort, natural_mort
          assert all(t['id'] in by_id for t in suggest('les 4 éléments magiques')+suggest('Pourquoi avons-nous peur de mourir ?'))
          assert "const exactItems=matches(query)" in js and "literalOccurrenceCount(record,query)" in js
          print('Theme suggestions OK:', [t['label'] for t in mort], 'vie mort:', [t['label'] for t in vie_mort])
          PY
      - name: Check thematic runtime and quality contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          runtime=json.loads(Path('data/thematic-index/theme-search-runtime.json').read_text(encoding='utf-8'))
          directory=json.loads(Path('data/thematic-index/theme-directory.json').read_text(encoding='utf-8'))
          quality=json.loads(Path('data/thematic-index/theme-quality-audit.json').read_text(encoding='utf-8'))
          stats=quality['stats']
          assert runtime['semanticMerging'] is False and runtime['connectionMeaning']=='psalm-cooccurrence-only'
          assert runtime['themeCount']==directory['themeCount']==stats['themeCount']
          assert stats['normalizedDirectoryCollisionCount']==0
          assert stats['relationsWithoutVerseNumbers']==0 and stats['relationsWithoutTeaching']==0
          canonical={t['id'] for t in directory['themes']}
          for theme in directory['themes']:
              assert theme['occurrenceCount'] == len(theme.get('occurrences', [])) and isinstance(theme.get('score'), int)
          for alias in runtime['aliases'].values(): assert set(alias['themeIds']) <= canonical
          ambiguous={key:alias for key,alias in runtime['aliases'].items() if alias.get('ambiguous')}
          assert len(ambiguous)==runtime['ambiguousAliasCount']
          assert len(ambiguous)==stats['sameNormalizedLabelMultipleIdsCount']
          assert all(len(a.get('themeIds',[]))>1 for a in ambiguous.values())
          assert runtime['aliases']['alliance de lumiere']['ambiguous'] is True
          assert set(runtime['aliases']['alliance de lumiere']['themeIds'])=={'alliance','alliance-de-lumiere'}
          print(f"Search UI contract OK: {runtime['themeCount']} themes, {runtime['aliasCount']} aliases, {len(ambiguous)} explicit semantic ambiguities, 0 technical directory collisions")
          PY
      - name: Audit production search queries
        run: python scripts/audit_production_search_queries.py
      - name: Audit psalm number search
        run: python scripts/audit_psalm_number_search.py
      - name: Audit browser search indexes
        run: python scripts/audit_browser_search_indexes.py