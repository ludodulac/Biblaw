name: BIBLAW 064-18 B targeted original PDF evidence
on:
  pull_request:
    paths:
      - 'scripts/prove_notes_064_18_B.py'
      - '.github/workflows/prove-notes-064-18-B.yml'
permissions:
  contents: read
jobs:
  proof-b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF reader
        run: python -m pip install --quiet pymupdf==1.26.4
      - name: Read only thirteen targeted PDF pages
        run: python scripts/prove_notes_064_18_B.py
      - name: Preserve evidence with original page renders
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biblaw-064-18-proof-B
          path: reports/notes-064-18-proof/B/
          if-no-files-found: error
