name: Audit thematic coverage

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/corpus/books/**'
      - 'data/thematic-index/books/**'
      - 'data/thematic-index/method.json'
      - 'data/thematic-index/theme-directory.json'
      - 'data/thematic-index/theme-search-index.json'
      - 'data/thematic-index/theme-relations-validated.json'
      - 'data/thematic-index/thematic-coverage-report.json'
      - 'data/browser-search-catalog.json'
      - 'js/biblaw.js'
      - 'scripts/audit_thematic_coverage.py'
      - '.github/workflows/audit-thematic-coverage.yml'
  pull_request:
    paths:
      - 'data/corpus/books/**'
      - 'data/thematic-index/books/**'
      - 'data/thematic-index/method.json'
      - 'data/thematic-index/theme-directory.json'
      - 'data/thematic-index/theme-search-index.json'
      - 'data/thematic-index/theme-relations-validated.json'
      - 'data/thematic-index/thematic-coverage-report.json'
      - 'data/browser-search-catalog.json'
      - 'js/biblaw.js'
      - 'scripts/audit_thematic_coverage.py'
      - '.github/workflows/audit-thematic-coverage.yml'

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check audit syntax
        run: python -m py_compile scripts/audit_thematic_coverage.py
      - name: Measure thematic coverage
        run: python scripts/audit_thematic_coverage.py
      - name: Prove committed coverage report is current
        run: git diff --exit-code -- data/thematic-index/thematic-coverage-report.json
      - name: Probe assembly-like detected themes
        run: |
          python - <<'PY'
          import json, unicodedata
          from pathlib import Path
          def norm(value):
              text=unicodedata.normalize('NFD',str(value or ''))
              text=''.join(ch for ch in text if unicodedata.category(ch)!='Mn')
              return ' '.join(text.lower().replace('œ','oe').replace('’',' ').replace("'",' ').replace('-',' ').split())
          directory=json.loads(Path('data/thematic-index/theme-directory.json').read_text(encoding='utf-8'))
          found=[]
          for theme in directory['themes']:
              values=[theme.get('id',''),theme.get('label',''),*(theme.get('labelVariants') or [])]
              if any('assemblee' in norm(value) for value in values):
                  found.append((theme.get('id'),theme.get('label'),theme.get('occurrenceCount'),theme.get('labelVariants') or []))
          print('ASSEMBLY_LEXICAL_THEME_COUNT',len(found))
          for row in found:
              print('ASSEMBLY_LEXICAL_THEME',json.dumps(row,ensure_ascii=False))
          PY
      - name: Probe current mort ordering exactly as browser
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          directory=json.loads(Path('data/thematic-index/theme-directory.json').read_text(encoding='utf-8'))
          catalog=json.loads(Path('data/browser-search-catalog.json').read_text(encoding='utf-8'))
          records={r['id']:r for r in catalog['records']}
          theme=next(t for t in directory['themes'] if t['id']=='mort')
          rank={'central':0,'important':1,'related':2}
          rows=[]
          for occurrence in theme['occurrences']:
              record=records[occurrence['recordId']]
              rows.append((occurrence,record))
          rows.sort(key=lambda pair:(rank.get(pair[0].get('importance'),3), int(pair[1].get('number',999999)), pair[1].get('id','')))
          print('MORT_THEME_LABEL',theme['label'])
          print('MORT_OCCURRENCE_COUNT',len(rows))
          print('MORT_IMPORTANCE_COUNTS',json.dumps({key:sum(1 for o,_ in rows if o.get('importance')==key) for key in rank},ensure_ascii=False))
          for i,(o,r) in enumerate(rows,1):
              print(f"MORT_ORDER {i:03d} {o.get('importance')} book={r.get('book',{}).get('number')} psalm={r.get('number')} record={r.get('id')} score={o.get('score')}")
          PY
      - name: Assert browser thematic ordering contract remains explicit
        run: |
          grep -F "importanceRank(x.thematic?.importance)-importanceRank(y.thematic?.importance)||x.record.number-y.record.number" js/biblaw.js
