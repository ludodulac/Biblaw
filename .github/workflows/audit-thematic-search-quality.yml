name: Audit thematic search quality

on:
  workflow_dispatch:

# Diagnostic manual check only. The canonical pipeline already rebuilds and publishes this report
# for every thematic-source change, so a second push-triggered writer would only duplicate work and
# compete for the same generated file.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rebuild directory and quality report locally
        run: |
          python scripts/build_thematic_directory.py
          python scripts/audit_thematic_search_quality.py
      - name: Verify committed quality outputs are fresh
        run: git diff --exit-code -- data/thematic-index/theme-directory.json data/thematic-index/theme-quality-audit.json
