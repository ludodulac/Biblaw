name: Validate thematic index

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/thematic-index/books/**'
      - 'scripts/validate_thematic_index.py'
      - '.github/workflows/validate-thematic-index.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate thematic index
        run: python scripts/validate_thematic_index.py
      - name: Commit validation report
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/thematic-index/validation-report.json)" ]; then
            echo 'No validation report changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/thematic-index/validation-report.json
          git commit -m 'Validate thematic index'
          git push
