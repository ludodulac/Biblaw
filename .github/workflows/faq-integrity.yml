name: FAQ reference integrity

on:
  pull_request:
    paths:
      - 'data/faq-*.json'
      - 'data/corpus/books/**'
      - 'js/biblaw-faq.js'
      - 'scripts/check_faq_integrity.mjs'
      - 'scripts/check_faq_dom.mjs'
      - 'scripts/check_faq_100_merge.mjs'
      - 'scripts/check_faq_101_topics.mjs'
      - '.github/workflows/faq-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'data/faq-*.json'
      - 'data/corpus/books/**'
      - 'js/biblaw-faq.js'
      - 'scripts/check_faq_integrity.mjs'
      - 'scripts/check_faq_dom.mjs'
      - 'scripts/check_faq_100_merge.mjs'

permissions:
  contents: read

jobs:
  faq-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 105 archived FAQ, 95 composite entries, 424 links and 19 routes
        run: node scripts/check_faq_integrity.mjs
      - name: Vérifier les dix regroupements sans perte de citations ni textes
        run: node scripts/check_faq_100_merge.mjs
      - name: Vérifier les thèmes FAQ et le chargement différé des 95 réponses
        run: node scripts/check_faq_101_topics.mjs
      - name: Exercise the FAQ public loader and citation links
        run: node scripts/check_faq_dom.mjs
      - name: Rejouer les contrôles FAQ du déploiement Pages
        shell: bash
        run: |
          failed=0
          for test in scripts/audit_faq_*.py scripts/smoke_faq_*.mjs; do
            if [[ "$test" == "scripts/smoke_faq_browser.mjs" || "$test" == "scripts/smoke_faq_full_browser.mjs" || "$test" == "scripts/smoke_faq_independent_browser.mjs" || "$test" == "scripts/audit_faq_pdf_source.py" || "$test" == "scripts/audit_faq_19_20_pdf.py" ]]; then continue; fi
            echo "=== $test ==="
            if [[ "$test" == *.py ]]; then
              python "$test" || failed=1
            else
              node "$test" || failed=1
            fi
          done
          exit "$failed"
