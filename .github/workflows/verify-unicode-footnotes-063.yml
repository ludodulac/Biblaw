name: BIBLAW 063 final PDF note typography
on:
  pull_request:
    paths:
      - 'scripts/verify_unicode_footnotes_063.py'
      - '.github/workflows/verify-unicode-footnotes-063.yml'
permissions:
  contents: read
jobs:
  exact-footnotes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf==1.26.4
      - name: Verify only 33 PDF footnote bounds including nonbreaking hyphens
        run: python scripts/verify_unicode_footnotes_063.py
      - name: Store individual source/marker/page comparison
        uses: actions/upload-artifact@v4
        with:
          name: biblaw-063-unicode-footnote-proofs
          path: reports/notes-063/unicode-footnote-decisions.json
