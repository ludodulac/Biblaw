name: Validate thematic search UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'js/biblaw.js'
      - 'data/browser-search-catalog.json'
      - 'data/thematic-index/theme-directory.json'
      - 'data/thematic-index/theme-search-runtime.json'
      - '.github/workflows/validate-search-ui.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: node --check js/biblaw.js
      - name: Check search UI DOM and bundle contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('js/biblaw.js').read_text(encoding='utf-8')
          required=('query','searchButton','archangelFilter','bookFilter','ambiguityPanel','suggestionKicker','suggestionTitle','senseChoices','closeAmbiguity','results','resultCount','themeDirectory','indexPanel','recordDialog','dialogContent')
          missing=[item for item in required if f'id="{item}"' not in html]
          assert not missing, f'missing DOM ids: {missing}'
          assert 'js/biblaw.js' in html
          assert "fetch('data/browser-search-catalog.json')" in js
          assert "catalog.records.map" not in js
          assert "$('bookFilter').onchange=search" in js or "$('bookFilter').onchange = search" in js
          bundle=json.loads(Path('data/browser-search-catalog.json').read_text(encoding='utf-8'))
          assert bundle['purpose']=='browser-search-corpus-bundle'
          assert bundle['recordCount']==len(bundle['records'])
          assert bundle['recordCount'] > 1000
          print(f"Browser search bundle OK: {bundle['recordCount']} records")
          PY
      - name: Check thematic runtime contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          runtime=json.loads((root/'data/thematic-index/theme-search-runtime.json').read_text(encoding='utf-8'))
          directory=json.loads((root/'data/thematic-index/theme-directory.json').read_text(encoding='utf-8'))
          assert runtime['semanticMerging'] is False
          assert runtime['connectionMeaning']=='psalm-cooccurrence-only'
          assert runtime['themeCount']==directory['themeCount']
          canonical={t['id'] for t in directory['themes']}
          for alias in runtime['aliases'].values(): assert set(alias['themeIds']) <= canonical
          print(f"Search UI contract OK: {runtime['themeCount']} themes, {runtime['aliasCount']} aliases")
          PY
