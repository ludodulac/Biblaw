name: Temporary rebuild BIBLAW book 29
on:
  push:
    branches:
      - feat/book29-michael-thematic-coverage-20261109
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: book29-regeneration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  rebuild-book29:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF extraction dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Rebuild and independently audit book 29
        run: |
          python scripts/run_canonical_thematic_pipeline.py
          python scripts/audit_book29_full_theme_coverage.py
          python scripts/validate_thematic_index.py
          git diff --exit-code -- data/corpus/books
          git status --short
      - name: Commit only regenerated thematic data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/thematic-index
          if ! git diff --cached --quiet; then
            git commit -m "BIBLAW book29: rebuild canonical thematic indexes and 27 psalms"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
