name: BIBLAW 060 review source notes
on:
  pull_request:
    paths:
      - 'scripts/audit_extracted_notes_060.py'
      - '.github/workflows/audit-extracted-notes-060.yml'
permissions:
  contents: read
jobs:
  audit-extracted-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install --quiet pymupdf==1.26.4
      - name: Audit all extracted notes without publishing them
        run: python scripts/audit_extracted_notes_060.py
      - name: Attach complete note-by-note report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biblaw-notes-audit-060
          path: reports/notes-extraites-060/
          if-no-files-found: warn
