<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R3 — Responsabilité DIRECT</title><style>:root{font-family:system-ui,sans-serif;color:#202124;background:#f7f7f5}main{max-width:940px;margin:auto;padding:28px 18px 70px}.tabs{display:flex;gap:8px;margin:18px 0}button{border:1px solid #bbb;background:white;padding:9px 12px;border-radius:8px}button[aria-pressed=true]{background:#202124;color:white}.summary,.function,.subject{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0}.reason{font-size:.92rem;padding:7px 9px;background:#f1f1ef;border-radius:6px}.meta{font-size:.9rem;color:#666}.evidence{margin:8px 0;padding-left:12px;border-left:3px solid #bbb}.error{background:#fff0f0;border:1px solid #c66;padding:12px}</style></head><body><main><h1>Responsabilité DIRECT — P1 / P2 / R3</h1><p>R3 ne change aucune donnée C. Il applique seulement les décisions de <code>responsibility-direct-presentation-audit.json</code> aux 12 rattachements DIRECT de responsabilité. Le reste de P2 demeure inchangé.</p><div class="tabs"><button data-mode="P1">P1</button><button data-mode="P2">P2</button><button data-mode="R3">R3</button></div><div id="status" class="summary">Chargement…</div><section id="output"></section></main><script>
const j=async p=>{const r=await fetch(p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let C,R,G,A,P=[],mode='R3';
function pmap(){return new Map(P.flatMap(d=>d.subjects.map(s=>[[d.source.recordId,s.localId].join('|'),{...s,recordId:d.source.recordId,psalmNumber:d.source.psalmNumber,sourcePath:`data/documentary-extractions/psalms/book-44/psalm-${d.source.psalmNumber}.json`}])))}
function rows(){const rel=new Map(R.assignments.map(a=>[[a.family,a.recordId,a.localId].join('|'),a.relationNature])),by=pmap(),f=C.families.find(x=>x.entry==='responsabilité');return f.functions.flatMap(fn=>fn.members.map(m=>({label:fn.label,rationale:fn.rationale,nature:rel.get(['responsabilité',m.recordId,m.localId].join('|')),subject:by.get([m.recordId,m.localId].join('|'))}))).filter(x=>x.nature==='DIRECT')}
function p2Decision(label){const o=(G.priorityObservations||[]).find(x=>x.family==='responsabilité'&&x.relationNature==='DIRECT'&&x.function===label);return o?.observation==='explanation-may-suffice'?'ATTACHED':'INTERTITLE'}function decision(label){if(mode==='P1')return'INTERTITLE';if(mode==='P2')return p2Decision(label);return A.decisions.find(x=>x.function===label)?.decision||'INTERTITLE'}
function subj(r,attached){const s=r.subject;return `<div class="subject">${attached?`<div class="reason"><strong>Fonction / raison documentaire :</strong> ${esc(r.label)} — ${esc(r.rationale)}</div>`:''}<strong>Psaume ${s.psalmNumber} · ${esc(s.localId)}</strong><div>${esc(s.localSubject)}</div><div class="meta">Versets : ${esc((s.verseNumbers||[]).join(', '))} · provenance : <code>${esc(s.sourcePath)}</code></div>${(s.evidence||[]).map(e=>`<div class="evidence">v. ${esc((e.verseNumbers||[]).join(', '))} — ${esc(e.quote)}</div>`).join('')}</div>`}
function render(){document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));const rs=rows(),labels=[...new Set(rs.map(r=>r.label))],heads=labels.filter(x=>decision(x)==='INTERTITLE'),attached=rs.filter(x=>decision(x.label)==='ATTACHED');document.querySelector('#status').textContent=`${mode} — 12 rattachements DIRECT · ${heads.length} intertitre(s) · ${attached.length} sujet(s) avec fonction attachée`;let h='';for(const label of labels){const items=rs.filter(x=>x.label===label);if(decision(label)==='INTERTITLE')h+=`<div class="function"><h2>${esc(label)}</h2><p>${esc(items[0].rationale)}</p>${items.map(x=>subj(x,false)).join('')}</div>`;else h+=items.map(x=>subj(x,true)).join('')}document.querySelector('#output').innerHTML=h}
async function init(){try{[C,R,G,A]=await Promise.all([j('consolidation-pilot.json'),j('relation-nature-audit.json'),j('function-granularity-audit.json'),j('responsibility-direct-presentation-audit.json')]);P=await Promise.all(Array.from({length:26},(_,i)=>j(`../../data/documentary-extractions/psalms/book-44/psalm-${260+i}.json`)));const rs=rows();if(C.families.length!==6||R.assignments.length!==65||R.assignments.filter(x=>x.relationNature==='DIRECT').length!==46||R.assignments.filter(x=>x.relationNature==='FONCTIONNEL').length!==19||rs.length!==12||new Set(rs.map(x=>x.label)).size!==11||A.decisions.length!==11)throw Error('Invariant C / responsabilité DIRECT échoué');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});render()}catch(e){document.querySelector('#status').className='error';document.querySelector('#status').textContent=e.message}}init();
</script></body></html>
