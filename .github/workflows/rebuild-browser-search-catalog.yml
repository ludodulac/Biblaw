name: Rebuild browser search catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/catalog.json'
      - 'data/corpus/**'
      - 'scripts/build_browser_search_catalog.py'
      - '.github/workflows/rebuild-browser-search-catalog.yml'

permissions:
  contents: write

# The canonical thematic pipeline also publishes data/browser-search-catalog.json.
# Use the same serialization group so two writers never race on the generated bundle.
concurrency:
  group: thematic-index-generated-files
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild browser search catalog
        run: python scripts/build_browser_search_catalog.py
      - name: Commit generated catalog when needed
        run: |
          if [ -z "$(git status --porcelain -- data/browser-search-catalog.json)" ]; then
            echo 'Browser search catalog already fresh'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/browser-search-catalog.json
          git commit -m 'Rebuild browser search catalog'
          git pull --rebase origin main
          git push origin HEAD:main
