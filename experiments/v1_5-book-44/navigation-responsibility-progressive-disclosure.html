<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsabilité DIRECT — D0/D1a/D1b</title><style>:root{font-family:system-ui,sans-serif;color:#202124;background:#f7f7f5}main{max-width:1040px;margin:auto;padding:24px 16px 60px}.card,.status{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{padding:8px 11px}.function,.rationale{background:#f1f1ef;padding:8px;border-radius:7px;margin:8px 0}.meta{font-size:.88rem;color:#666}.evidence{border-left:3px solid #bbb;padding-left:10px;margin:7px 0}.detail{margin-top:9px}.error{background:#fff0f0;padding:12px}</style></head><body><main><h1>responsabilité → DIRECT — divulgation progressive</h1><p>Les 12 sujets restent frères et dans le même ordre. Seule varie la quantité d’information simultanément développée.</p><div class="controls"><button data-mode="D0">D0 complet</button><button data-mode="D1a">D1a compact</button><button data-mode="D1b">D1b compact+rationale</button></div><div id="status" class="status">Chargement…</div><section id="out"></section></main><script>
const j=async p=>{const r=await fetch(p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=(...x)=>x.join('|');let A,C,R,P=[],mode='D1a';
function pm(){return new Map(P.flatMap(d=>d.subjects.map(s=>[key(d.source.recordId,s.localId),{...s,recordId:d.source.recordId,psalmNumber:d.source.psalmNumber,sourcePath:`data/documentary-extractions/psalms/book-44/psalm-${d.source.psalmNumber}.json`}])))}function fm(){const m=new Map();for(const f of C.families)if(f.entry==='responsabilité')for(const fn of f.functions)for(const x of fn.members)m.set(key(x.recordId,x.localId),{label:fn.label,rationale:fn.rationale});return m}
function details(s,fn,showRationale){return `${showRationale?`<div class="rationale"><strong>Rationale :</strong> ${esc(fn.rationale)}</div>`:''}<div class="meta">Versets : ${esc((s.verseNumbers||[]).join(', '))} · provenance V1.5 : <code>${esc(s.sourcePath)}</code></div>${(s.evidence||[]).map(e=>`<div class="evidence">v. ${esc((e.verseNumbers||[]).join(', '))} — ${esc(e.quote)}</div>`).join('')}<div class="meta"><strong>Note documentaire :</strong> ${esc(s.documentaryNote)}</div>`}
function card(row,p,f){const [recordId,localId,fnLabel]=row,s=p.get(key(recordId,localId)),fn=f.get(key(recordId,localId));const head=`<strong>Psaume ${s.psalmNumber} · ${esc(localId)}</strong><div>${esc(s.localSubject)}</div><div class="function"><strong>Fonction documentaire :</strong> ${esc(fn.label)}</div>`;if(mode==='D0')return `<article class="card">${head}${details(s,fn,true)}</article>`;const rationaleVisible=mode==='D1b';return `<article class="card">${head}${rationaleVisible?`<div class="rationale"><strong>Rationale :</strong> ${esc(fn.rationale)}</div>`:''}<details class="detail"><summary>Détail documentaire</summary>${details(s,fn,!rationaleVisible)}</details></article>`}
function render(){const p=pm(),f=fm();document.querySelector('#status').textContent=`${mode} · responsabilité → DIRECT · 12 sujets frères · ordre invariant · aucun regroupement fonctionnel`;document.querySelector('#out').innerHTML=A.audits.map(x=>card(x,p,f)).join('')}
async function init(){try{[A,C,R]=await Promise.all([j('responsibility-direct-progressive-disclosure-audit.json'),j('consolidation-pilot.json'),j('relation-nature-audit.json')]);P=await Promise.all(Array.from({length:26},(_,i)=>j(`../../data/documentary-extractions/psalms/book-44/psalm-${260+i}.json`)));const p=pm(),f=fm(),direct=R.assignments.filter(x=>x.family==='responsabilité'&&x.relationNature==='DIRECT'),expected=direct.map(x=>key(x.recordId,x.localId)),actual=A.audits.map(x=>key(x[0],x[1]));if(A.audits.length!==12||direct.length!==12)throw Error('Cardinalité responsabilité/DIRECT incohérente');if(expected.join('\n')!==actual.join('\n'))throw Error('Ordre ou ensemble des 12 rattachements incohérent');for(const x of A.audits){const [recordId,localId,fnLabel]=x,s=p.get(key(recordId,localId)),fn=f.get(key(recordId,localId));if(!s)throw Error(`Sujet absent: ${recordId}/${localId}`);if(!fn||fn.label!==fnLabel||!fn.rationale)throw Error(`Fonction/rationale absente: ${recordId}/${localId}`)}document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});render()}catch(e){document.querySelector('#status').className='error';document.querySelector('#status').textContent=e.message}}init();
</script></body></html>
