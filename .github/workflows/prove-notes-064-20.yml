name: BIBLAW 064-20 final two notes original PDF evidence
on:
  pull_request:
    paths:
      - 'scripts/prove_notes_064_20.py'
      - '.github/workflows/prove-notes-064-20.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF reader
        run: python -m pip install --quiet pymupdf==1.26.4
      - name: Capture seven pertinent source PDF pages
        run: python scripts/prove_notes_064_20.py
      - name: Preserve source images, coordinates and note comparison
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biblaw-064-20-proof
          path: reports/notes-064-20-proof/
          if-no-files-found: error
