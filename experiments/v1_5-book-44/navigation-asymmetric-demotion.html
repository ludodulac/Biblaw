<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T1/T2 — test asymétrique</title><style>:root{font-family:system-ui,sans-serif;color:#202124;background:#f7f7f5}main{max-width:980px;margin:auto;padding:24px 16px 60px}.candidate,.subject,.summary{background:#fff;border:1px solid #ddd;border-radius:10px;padding:13px;margin:10px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}button{padding:8px 11px}.attached{font-size:.92rem;background:#f1f1ef;padding:8px;border-radius:6px;margin-bottom:8px}.meta{font-size:.88rem;color:#666}.evidence{border-left:3px solid #bbb;padding-left:10px;margin:7px 0}.error{background:#fff0f0;padding:12px}</style></head><body><main><h1>11 candidats — démotion asymétrique T1/T2</h1><p>T1 traverse la fonction. T2 présente directement les mêmes sujets avec fonction et rationale attachées. Aucune donnée C n'est modifiée.</p><div class="controls"><button id="t1">T1</button><button id="t2">T2</button></div><div id="status" class="summary">Chargement…</div><section id="out"></section></main><script>
const j=async p=>{const r=await fetch(p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let A,C,R,P=[],mode='T2';
function pmap(){return new Map(P.flatMap(d=>d.subjects.map(s=>[[d.source.recordId,s.localId].join('|'),{...s,recordId:d.source.recordId,psalmNumber:d.source.psalmNumber,sourcePath:`data/documentary-extractions/psalms/book-44/psalm-${d.source.psalmNumber}.json`}])))}
function fmap(){const m=new Map();for(const f of C.families)for(const fn of f.functions)m.set([f.entry,fn.label].join('|'),fn);return m}
function subject(s,fn,attached){return `<div class="subject">${attached?`<div class="attached"><strong>${esc(fn.label)}</strong> — ${esc(fn.rationale)}</div>`:''}<strong>Psaume ${s.psalmNumber} · ${esc(s.localId)}</strong><div>${esc(s.localSubject)}</div><div class="meta">Versets : ${esc((s.verseNumbers||[]).join(', '))} · provenance : <code>${esc(s.sourcePath)}</code></div>${(s.evidence||[]).map(e=>`<div class="evidence">v. ${esc((e.verseNumbers||[]).join(', '))} — ${esc(e.quote)}</div>`).join('')}<div class="meta">Note documentaire : ${esc(s.documentaryNote)}</div></div>`}
function render(){const pm=pmap(),fm=fmap();document.querySelector('#status').textContent=`${mode} — ${A.candidates.length} candidats · 65 rattachements C inchangés · 46 DIRECT / 19 FONCTIONNEL`;let h='';for(const c of A.candidates){const fn=fm.get([c.family,c.function].join('|')),ss=c.members.map(x=>pm.get(x.join('|')));h+=`<article class="candidate"><div class="meta">${esc(c.family)} → ${esc(c.relationNature)} · précédent ${esc(c.previousStatus)} · verdict ${esc(c.verdict)}</div>`;if(mode==='T1')h+=`<h2>${esc(c.function)}</h2><p>${esc(fn.rationale)}</p>${ss.map(s=>subject(s,fn,false)).join('')}`;else h+=ss.map(s=>subject(s,fn,true)).join('');h+='</article>'}document.querySelector('#out').innerHTML=h}
async function init(){try{[A,C,R]=await Promise.all([j('asymmetric-intertitle-demotion-audit.json'),j('consolidation-pilot.json'),j('relation-nature-audit.json')]);P=await Promise.all(Array.from({length:26},(_,i)=>j(`../../data/documentary-extractions/psalms/book-44/psalm-${260+i}.json`)));if(A.candidates.length!==11||C.families.length!==6||R.assignments.length!==65||R.assignments.filter(x=>x.relationNature==='DIRECT').length!==46||R.assignments.filter(x=>x.relationNature==='FONCTIONNEL').length!==19)throw Error('Invariant structurel échoué');const pm=pmap(),fm=fmap(),rel=new Map(R.assignments.map(x=>[[x.family,x.recordId,x.localId].join('|'),x.relationNature]));for(const c of A.candidates){const fn=fm.get([c.family,c.function].join('|'));if(!fn)throw Error(`Fonction absente: ${c.family}/${c.function}`);for(const m of c.members){if(!pm.get(m.join('|')))throw Error(`Sujet absent: ${m.join('/')}`);if(rel.get([c.family,...m].join('|'))!==c.relationNature)throw Error(`Nature incohérente: ${c.family}/${m.join('/')}`);if(!fn.members.some(x=>x.recordId===m[0]&&x.localId===m[1]))throw Error(`Membre C absent: ${c.family}/${m.join('/')}`)}}document.querySelector('#t1').onclick=()=>{mode='T1';render()};document.querySelector('#t2').onclick=()=>{mode='T2';render()};render()}catch(e){document.querySelector('#status').className='error';document.querySelector('#status').textContent=e.message}}init();
</script></body></html>
